<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOT YOUR SPOT — Račun dobiti i gubitka 2026</title>
<style>
/* ══ PALETA — bankarski Navy / Deep Blue ══════════════════════════════════ */
:root{
  --nav-900:#0a1628; --nav-800:#0f1e35; --nav-700:#16294a; --nav-600:#1f3a63;
  --nav-500:#2b5088; --nav-400:#4a72ab; --gold:#c8a951; --gold-d:#a88a35;
  --bg:#f6f7fa; --surf:#ffffff; --surf-2:#fafbfd; --surf-3:#f1f3f8;
  --line:#e8ebf1; --line-2:#f0f2f6;
  --tx:#121826; --tx-2:#5a6478; --tx-3:#98a1b3;
  --pos:#22c55e;--pos-lt:#86efac;--neg-lt:#fca5a5; --pos-bg:#e8faef; --neg:#ef4444; --neg-bg:#fdecec;
  --warn:#f59e0b; --warn-bg:#fef6e7; --info:#3b82f6; --info-bg:#eaf2fe;
  --c1:#3b82f6; --c2:#38bdf8; --c3:#22c55e; --c4:#84cc16; --c5:#fbbf24;
  --c6:#f97316; --c7:#ef4444; --c8:#8b5cf6; --c9:#6366f1; --c10:#ec4899;
  --sh-1:0 1px 2px rgba(18,24,38,.04);
  --sh-2:0 2px 8px rgba(18,24,38,.05), 0 10px 30px rgba(18,24,38,.05);
  --sh-3:0 16px 48px rgba(18,24,38,.18);
  --r:15px; --r-s:11px; --r-xs:8px;
  --sans:'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI Variable Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:'Inter','SF Pro Display',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#080f1c; --surf:#101c30; --surf-2:#16243c; --surf-3:#1d2e49;
  --line:#24354f; --line-2:#1b2a42;
  --tx:#e8eef6; --tx-2:#9db0c8; --tx-3:#6b7f99;
  --pos:#4ade80;--pos-lt:#3f8a5c;--neg-lt:#a85a5a; --pos-bg:#0e2f1d; --neg:#f87171; --neg-bg:#331717;
  --warn:#fbbf24; --warn-bg:#302614; --info:#60a5fa; --info-bg:#132239;
  --c1:#60a5fa; --c2:#38bdf8; --c3:#4ade80; --c4:#a3e635; --c5:#fbbf24;
  --c6:#fb923c; --c7:#f87171; --c8:#a78bfa; --c9:#818cf8; --c10:#f472b6;
  --sh-1:0 1px 3px rgba(0,0,0,.4); --sh-2:0 4px 16px rgba(0,0,0,.4);
  --sh-3:0 12px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans); background:var(--bg); color:var(--tx);
  font-size:13px; line-height:1.5; -webkit-font-smoothing:antialiased;
  display:flex; overflow:hidden;
  font-variant-numeric:tabular-nums;
}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ══ SIDEBAR ══════════════════════════════════════════════════════════════ */
#side{
  width:246px; flex:0 0 246px; background:var(--nav-800); color:#c4d3e6;
  display:flex; flex-direction:column; height:100vh; position:relative; z-index:20;
}
#side::after{content:'';position:absolute;inset:0 0 0 auto;width:1px;background:rgba(255,255,255,.07)}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:11px;align-items:center}
.brand-logo{width:38px;height:38px;border-radius:9px;background:linear-gradient(145deg,var(--gold),var(--gold-d));
  display:flex;align-items:center;justify-content:center;flex:0 0 38px;overflow:hidden;
  font-weight:800;font-size:14px;color:var(--nav-900);letter-spacing:-.5px}
.brand-logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand-t{font-size:12.5px;font-weight:700;color:#fff;letter-spacing:.2px;line-height:1.25}
.brand-s{font-size:10px;color:#7e93ad;letter-spacing:.4px;margin-top:2px}
#nav{flex:1;overflow-y:auto;padding:10px 10px 14px}
#nav::-webkit-scrollbar{width:5px}
#nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
.nav-h{font-size:9.5px;font-weight:700;letter-spacing:1.3px;color:#607890;text-transform:uppercase;padding:14px 10px 6px}
.nav-i{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;
  color:#b3c5db;font-size:12.5px;font-weight:500;transition:background .13s,color .13s;user-select:none;position:relative}
.nav-i:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-i.on{background:var(--nav-600);color:#fff;font-weight:600}
.nav-i.on::before{content:'';position:absolute;left:-10px;top:7px;bottom:7px;width:3px;background:var(--gold);border-radius:0 3px 3px 0}
.nav-i svg{width:16px;height:16px;flex:0 0 16px;stroke-width:1.7}
.nav-dot{width:6px;height:6px;border-radius:3px;flex:0 0 6px;margin-left:auto}
.nav-badge{margin-left:auto;background:var(--neg);color:#fff;font-size:9.5px;font-weight:700;
  border-radius:9px;padding:1px 6px;min-width:18px;text-align:center;font-family:var(--mono)}
.side-f{padding:11px 14px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:8px}
.side-f-s{font-size:10px;color:#7e93ad;flex:1;font-family:var(--mono)}
.icon-btn{width:28px;height:28px;border-radius:7px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);color:#b3c5db;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.icon-btn svg{width:14px;height:14px;stroke-width:1.8}

/* ══ MAIN ═════════════════════════════════════════════════════════════════ */
#main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0}
#top{height:56px;flex:0 0 56px;background:var(--surf);border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 22px;gap:12px;box-shadow:var(--sh-1);z-index:10}
#top-t{font-size:15px;font-weight:650;letter-spacing:-.2px}
#top-s{font-size:11px;color:var(--tx-3);margin-left:2px}
.spacer{flex:1}
#view{flex:1;overflow-y:auto;padding:22px 24px 60px}
#view::-webkit-scrollbar{width:9px}
#view::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;border:2px solid var(--bg)}
#view::-webkit-scrollbar-thumb:hover{background:var(--tx-3)}

/* ══ BUTTONS ══════════════════════════════════════════════════════════════ */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;
  border:1px solid var(--line);background:var(--surf);color:var(--tx-2);font-family:var(--sans);
  font-size:12px;font-weight:550;cursor:pointer;transition:all .13s;white-space:nowrap}
.btn:hover{background:var(--surf-3);color:var(--tx);border-color:var(--tx-3)}
.btn svg{width:14px;height:14px;stroke-width:1.9}
.btn.pri{background:var(--nav-600);border-color:var(--nav-600);color:#fff}
.btn.pri:hover{background:var(--nav-700);border-color:var(--nav-700);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold-d);color:var(--nav-900);font-weight:650}
.btn.gold:hover{background:var(--gold-d);color:#fff}
.btn.ok{background:var(--pos-bg);border-color:transparent;color:var(--pos)}
.btn.ok:hover{background:var(--pos);color:#fff}
.btn.dgr{background:var(--neg-bg);border-color:transparent;color:var(--neg)}
.btn.dgr:hover{background:var(--neg);color:#fff}
.btn.sm{padding:5px 9px;font-size:11px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ══ CARDS ════════════════════════════════════════════════════════════════ */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden}
.card-h{padding:15px 18px 13px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.card-t{font-size:13px;font-weight:650;letter-spacing:-.1px}
.card-sub{font-size:11px;color:var(--tx-3);margin-top:2px;font-weight:400;letter-spacing:0}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1240px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* ══ KPI ══════════════════════════════════════════════════════════════════ */
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:17px 19px 15px;
  box-shadow:var(--sh-1);position:relative;overflow:hidden;transition:box-shadow .16s,transform .16s}
.kpi:hover{box-shadow:var(--sh-2)}
.kpi-l{font-size:10.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--tx-3)}
.kpi-v{font-size:25px;font-weight:750;letter-spacing:-.9px;margin:10px 0 5px;line-height:1.05;
  font-variant-numeric:tabular-nums}
.kpi-v .eur{font-size:.62em;font-weight:650;opacity:.75;margin-left:3px}
.kpi-c{font-size:11.5px;color:var(--tx-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:2px;font-family:var(--mono);font-size:10px;font-weight:700;
  padding:1.5px 6px;border-radius:5px;letter-spacing:-.1px}
.pill.up{background:var(--pos-bg);color:var(--pos)}
.pill.dn{background:var(--neg-bg);color:var(--neg)}
.pill.nt{background:var(--surf-3);color:var(--tx-3)}
.txt-pos{color:var(--pos)}.txt-neg{color:var(--neg)}.txt-mut{color:var(--tx-3)}
.eur{font-size:.72em;color:var(--tx-3);font-weight:500;margin-left:2px}

/* ══ TABLICE ══════════════════════════════════════════════════════════════ */
.tw{overflow:auto;max-width:100%}
.tw::-webkit-scrollbar{height:9px;width:9px}
.tw::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
th{font-size:9.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--tx-3);
  padding:9px 10px;text-align:right;white-space:nowrap;background:var(--surf-2);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
th.l,td.l{text-align:left}
td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line-2);white-space:nowrap}
tbody tr:hover td{background:var(--surf-2)}
.sticky-l{position:sticky;left:0;background:var(--surf);z-index:2}
th.sticky-l{z-index:4;background:var(--surf-2)}
tbody tr:hover .sticky-l{background:var(--surf-2)}
.row-sec td{background:var(--surf-3)!important;font-weight:700;font-size:10px;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--tx-2);padding:7px 10px}
.row-tot td{background:var(--surf-2)!important;font-weight:700;border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line)}
.row-fin td{background:var(--nav-800)!important;color:#fff!important;font-weight:700}
.row-fin td .eur{color:rgba(255,255,255,.5)}

/* ══ INPUTI ═══════════════════════════════════════════════════════════════ */
input,select,textarea{font-family:var(--sans);font-size:12px;color:var(--tx);background:var(--surf);
  border:1px solid var(--line);border-radius:var(--r-xs);padding:6px 9px;outline:none;transition:border-color .13s,box-shadow .13s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--nav-500);box-shadow:0 0 0 3px rgba(43,80,136,.13)}
input.n,td input{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.cell-inp{border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:5px;
  font-family:var(--mono);text-align:right;font-size:12px}
.cell-inp:hover{background:var(--surf-3);border-color:var(--line)}
.cell-inp:focus{background:var(--surf);border-color:var(--nav-500)}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
  color:var(--tx-3);margin-bottom:5px}
.hint{font-size:10.5px;color:var(--tx-3);margin-top:4px;line-height:1.45}
.ieur{display:flex;align-items:center;justify-content:flex-end;gap:2px}
.ieur input{flex:1;min-width:0;width:auto}
.ieur .eur{flex:0 0 auto;padding-right:2px}
.fld label.sw-lbl{display:flex;font-size:12px;font-weight:500;letter-spacing:0;
  text-transform:none;color:var(--tx);margin-bottom:0;margin-top:5px}

/* ══ CHIPS / TABS ═════════════════════════════════════════════════════════ */
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:var(--surf);
  font-size:11.5px;font-weight:550;color:var(--tx-2);cursor:pointer;transition:all .13s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px}
.chip:hover{border-color:var(--nav-400);color:var(--tx)}
.chip.on{background:var(--nav-600);border-color:var(--nav-600);color:#fff}
.chip .c{font-family:var(--mono);font-size:9.5px;opacity:.65}
.chip.has{border-color:var(--nav-400)}
.seg{display:inline-flex;background:var(--surf-3);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:5px 12px;border-radius:7px;border:none;background:transparent;font-family:var(--sans);
  font-size:11.5px;font-weight:550;color:var(--tx-2);cursor:pointer}
.seg button.on{background:var(--surf);color:var(--tx);box-shadow:var(--sh-1);font-weight:650}

/* ══ BADGE / ALERT ════════════════════════════════════════════════════════ */
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--surf-3);color:var(--tx-3)}
.bdg.pos{background:var(--pos-bg);color:var(--pos)}
.bdg.neg{background:var(--neg-bg);color:var(--neg)}
.bdg.wrn{background:var(--warn-bg);color:var(--warn)}
.bdg.inf{background:var(--info-bg);color:var(--info)}
.alert{display:flex;gap:13px;padding:14px 17px;border-radius:var(--r-s);border:1px solid var(--line);
  background:var(--surf);margin-bottom:9px;align-items:flex-start;border-left-width:3px}
.alert.d{border-left-color:var(--neg);background:var(--neg-bg)}
.alert.w{border-left-color:var(--warn);background:var(--warn-bg)}
.alert.g{border-left-color:var(--pos);background:var(--pos-bg)}
.alert.i{border-left-color:var(--info);background:var(--info-bg)}
.alert-i{width:19px;height:19px;flex:0 0 19px;margin-top:1px}
.alert-t{font-size:12.5px;font-weight:650;margin-bottom:3px}
.alert-b{font-size:11.5px;color:var(--tx-2);line-height:1.55}
.alert-m{font-size:10px;color:var(--tx-3);margin-top:5px;font-family:var(--mono);letter-spacing:.5px}

/* ══ MODAL ════════════════════════════════════════════════════════════════ */
.ovl{position:fixed;inset:0;background:rgba(10,22,40,.55);backdrop-filter:blur(6px);z-index:1000;
  display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--surf);border-radius:var(--r);box-shadow:var(--sh-3);width:100%;max-width:640px;
  max-height:88vh;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.modal.wide{max-width:1180px}
.modal-h{padding:17px 21px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal-t{font-size:14px;font-weight:650;flex:1}
.modal-b{padding:19px 21px;overflow-y:auto;flex:1}
.modal-f{padding:14px 21px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:var(--surf-2)}

/* ══ DROPZONE ═════════════════════════════════════════════════════════════ */
.dz{border:2px dashed var(--line);border-radius:var(--r);padding:38px 24px;text-align:center;
  background:var(--surf-2);cursor:pointer;transition:all .15s}
.dz:hover,.dz.over{border-color:var(--nav-500);background:var(--info-bg)}
.dz svg{width:40px;height:40px;stroke-width:1.3;color:var(--tx-3);margin-bottom:11px}
.dz.over svg{color:var(--nav-500)}
.dz-t{font-size:13.5px;font-weight:600;margin-bottom:5px}
.dz-s{font-size:11.5px;color:var(--tx-3);line-height:1.6}

/* ══ CHART ════════════════════════════════════════════════════════════════ */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--sans);font-size:10.5px;font-weight:500;fill:var(--tx-3)}
.chart .ax{stroke:var(--line-2);stroke-width:1}
.chart .bar{transition:opacity .12s}
.chart .seg{transition:opacity .12s}
.chart .seg:hover{opacity:.82}
.chart .bar{transition:opacity .12s}
.chart .bar:hover{opacity:.78}
.chart .hit{fill:transparent;cursor:crosshair}
#tip{position:fixed;z-index:2000;background:var(--nav-900);color:#fff;border-radius:9px;padding:9px 12px;
  font-size:11.5px;pointer-events:none;opacity:0;transition:opacity .1s;box-shadow:var(--sh-3);
  max-width:270px;line-height:1.55;border:1px solid rgba(255,255,255,.11)}
#tip.on{opacity:1}
#tip .tt{font-weight:700;margin-bottom:6px;font-size:11px;letter-spacing:.5px;color:var(--gold);
  text-transform:uppercase}
#tip .tr{display:flex;justify-content:space-between;gap:18px;font-size:11.5px;padding:2px 0;
  font-variant-numeric:tabular-nums}
#tip .tr span:first-child{color:#a8bdd6;display:flex;align-items:center;gap:5px}
#tip .sw{width:8px;height:8px;border-radius:2px;display:inline-block}
.lgd{display:flex;gap:15px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--tx-2);font-weight:500}
.lgd span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.lgd i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 9px}
.chart-hd{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:4px}
.chart-hd .ct{font-size:13.5px;font-weight:650;letter-spacing:-.15px}
.chart-hd .cs{font-size:11.5px;color:var(--tx-3);margin-top:2px}
.dleg{margin-top:16px;display:flex;flex-direction:column}
.dleg-r{display:flex;align-items:center;gap:10px;font-size:12px;padding:7px 2px;border-bottom:1px solid var(--line-2)}
.dleg-r:last-child{border-bottom:none}
.dleg-r i{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.dleg-r .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx-2)}
.dleg-r .v{font-weight:650;font-variant-numeric:tabular-nums;color:var(--tx)}
.dleg-r .p{color:var(--tx-3);font-variant-numeric:tabular-nums;width:52px;text-align:right}

/* ══ MISC ═════════════════════════════════════════════════════════════════ */
.empty{text-align:center;padding:52px 20px;color:var(--tx-3)}
.empty svg{width:44px;height:44px;stroke-width:1.2;margin-bottom:13px;opacity:.5}
.empty-t{font-size:13px;font-weight:600;color:var(--tx-2);margin-bottom:5px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);z-index:3000;
  background:var(--nav-900);color:#fff;padding:11px 19px;border-radius:10px;font-size:12.5px;font-weight:550;
  box-shadow:var(--sh-3);transition:transform .28s cubic-bezier(.32,.72,0,1);display:flex;gap:9px;align-items:center}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast svg{width:16px;height:16px;stroke-width:2}
.sep{height:1px;background:var(--line-2);margin:16px 0}
.mut{color:var(--tx-3)}
.sw-lbl{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:12px;user-select:none}
.sw-box{width:36px;height:21px;border-radius:11px;background:var(--line);position:relative;transition:background .18s;flex:0 0 36px}
.sw-box::after{content:'';position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:8px;
  background:#fff;transition:transform .18s;box-shadow:var(--sh-1)}
input[type=checkbox]:checked + .sw-box{background:var(--pos)}
input[type=checkbox]:checked + .sw-box::after{transform:translateX(15px)}
input[type=checkbox].sw-in{display:none}

  if(lc>-1&&ld>-1)      v = lc>ld ? v.replace(/\./g,'').replace(',','.') : v.replace(/,/g,'');
  else if(lc>-1)        v = (v.length-lc-1===3 && /^\d{1,3}(,\d{3})+$/.test(v)) ? v.replace(/,/g,'') : v.replace(',','.');
  else if(ld>-1 && /^\d{1,3}(\.\d{3})+$/.test(v)) v = v.replace(/\./g,'');
  const n=parseFloat(v);
  return isFinite(n) ? (neg?-n:n) : 0;
}
/** "dd.mm." | "dd.mm.yyyy" | "d.m.yy" → {d,m,y} ili null */
function pd(s){
  const m=String(s==null?'':s).trim().match(/^(\d{1,2})\s*[.\/-]\s*(\d{1,2})\s*(?:[.\/-]\s*(\d{2,4}))?\s*\.?$/);
  if(!m) return null;
  const d=+m[1], mo=+m[2]; let y=m[3]?+m[3]:YEAR;
  if(y<100) y+=2000;
  if(d<1||d>31||mo<1||mo>12) return null;
  return {d:d,m:mo,y:y};
}

/* Plaće se vode ručno u rubrici Djelatnici. Sve što je uvoz izvoda ikad
   proknjižio kao trošak plaće (plaća, prehrana, prijevoz, nagrada, naknada
   za rad od kuće, tekući računi po specifikaciji) uklanja se iz knjige —
   ručno unesene stavke se ne diraju. */
let PLPURGE=null;
function plPurge(){
  if(!D || !D.td || typeof payrollDesc!=='function') return 0;
  let n=0, iz=0, mj={};
  for(const k in D.td){
    const arr12=D.td[k]; if(!Array.isArray(arr12)) continue;
    for(let mi=0; mi<arr12.length; mi++){
      const arr=arr12[mi]; if(!arr || !arr.length) continue;
      const keep=[];
      for(let i=0;i<arr.length;i++){
        const t=arr[i];
        if(t && t.src==='izvod' && payrollDesc(t.o)){
          n++; iz+=Number(t.a)||0; mj[mi]=(mj[mi]||0)+1;
        } else keep.push(t);
      }
      if(keep.length!==arr.length) arr12[mi]=keep;
    }
  }
  if(n) PLPURGE={n:n, a:Math.round(iz*100)/100, mj:mj};
  return n;
}

function val(k,i){
  const tx=(D.td[k]&&D.td[k][i])||[];
  if(tx.length) return tx.reduce((s,t)=>s+(Number(t.a)||0),0);
  return Number((D.p[k]||[])[i])||0;
}

/* ═══════════════════════════════════════════════════════════════════════════
   FINANCIRANJE
   Povrati pozajmica i dokapitalizacije nisu poslovni trošak nego otplata
   duga. Ostaju gdje jesu, ali se prikazuju odvojeno da se vidi rezultat
   poslovanja bez njih. Ista pravila koristi i cash flow (Other cash out 1)
   te obračun PDV-a (izuzeto iz pretporeza).
   ═══════════════════════════════════════════════════════════════════════════ */
const RE_FIN = /POZAJM|ZAJAM|DOKAPITAL|REALTOS/i;
/** Povrati pozajmica po mjesecima — samo unutar rashoda */
function finPoMj(){
  const out=Z12();
  D.rows.forEach(r=>{
    if(r.s==='prihod') return;
    (D.td[r.k]||[]).forEach((mo,mi)=>(mo||[]).forEach(t=>{
      if(RE_FIN.test(String(t.o||''))) out[mi]+=Number(t.a)||0;
    }));
  });
  return out.map(v=>Math.round(v*100)/100);
}

function calc(){
  const rp=D.rows.filter(r=>r.s==='prihod'), rl=D.rows.filter(r=>r.s==='place'),
        rf=D.rows.filter(r=>r.s==='fiksni'), ro=D.rows.filter(r=>r.s==='ostali');
  const acc=rows=>MR.map((_,i)=>rows.reduce((s,r)=>s+val(r.k,i),0));
  const prihodi=acc(rp), place=acc(rl), fiksni=acc(rf), ostali=acc(ro);
  const rashodi=MR.map((_,i)=>place[i]+fiksni[i]+ostali[i]);
  const dobit=MR.map((_,i)=>prihodi[i]-rashodi[i]);
  const fin=finPoMj();                                   /* povrati pozajmica u rashodima */
  const dobitFin=MR.map((_,i)=>dobit[i]+fin[i]);         /* rezultat bez otplate duga */
  let k=0; const kum=dobit.map(v=>(k+=v));
  return {prihodi:prihodi,place:place,fiksni:fiksni,ostali:ostali,rashodi:rashodi,dobit:dobit,kum:kum,
          fin:fin,dobitFin:dobitFin};
}
/** Mjeseci u kojima ima ikakvog prometa */
function activeM(c){ c=c||calc(); const a=[]; for(let i=0;i<12;i++) if(c.prihodi[i]||c.rashodi[i]) a.push(i); return a; }

/** Ujedinjena lista pravila: naučena (korisnička) prije sistemskih */
function allRules(){
  const u = D.rules.map(r=>({p:norm(r.p),c:r.c,d:r.d||'any',f:r.f||'',u:1,id:r.id}));
  const s = SYSRULES.map(r=>({p:norm(r[0]),c:r[1],d:r[2]||'any',f:r[3]||'',u:0}));
  return u.concat(s);
}

/**
 * Klasificira jednu stavku izvoda.
 * @param {string} desc  opis iz izvoda
 * @param {string} dir   'in' (potražuje/uplata) | 'out' (duguje/isplata)
 * @returns {{cat:string,flag:string,rule:string,conf:string}}
 */
function classify(desc, dir){
  const t = norm(desc);
  const rules = allRules();
  let best=null, bestLen=-1;
  for(let i=0;i<rules.length;i++){
    const r=rules[i];
    if(!r.p) continue;
    if(r.d!=='any' && r.d!==dir) continue;
    if(t.indexOf(r.p)===-1) continue;
    const score = r.p.length + (r.u?1000:0);
    if(score>bestLen){ bestLen=score; best=r; }
  }
  if(best){
    let cat=best.c;
    /* Kod isplata plaća skupinu određuje registar djelatnika, a ne pravilo */
    if(best.f==='split' && !best.u){
      const e=empMatch(desc);
      if(e && e.rola) cat=e.rola;
    }
    return {cat:cat, flag:best.f, rule:best.p, conf: best.u?'nauceno' : (best.p.length>=6?'visoka':'srednja')};
  }
  // Bez podudaranja — odlučuje smjer novca
  if(dir==='in') return {cat:'prihodi_grupe', flag:'chk', rule:'', conf:'niska'};
  return {cat:'razno', flag:'chk', rule:'', conf:'niska'};
}

/** Sprema naučeno pravilo iz korisničkog ispravka */
function learn(desc, cat, dir){
  const key = ruleKeyFrom(desc);
  if(!key || key.length<3) return null;
  const n = norm(key);
  const ex = D.rules.find(r=>norm(r.p)===n);
  if(ex){ ex.c=cat; ex.d=dir||'any'; ex.n=(ex.n||0)+1; return ex; }
  const r={id:uid(), p:key, c:cat, d:dir||'any', f:'', n:1, t:isoToday()};
  D.rules.push(r);
  return r;
}
/** Iz punog opisa izvlači stabilan ključ: naziv partnera bez brojeva računa */
function ruleKeyFrom(desc){
  let t = norm(desc);
  t = t.replace(/RN\.?\s?BR\.?:?.*/,'').replace(/RN:.*/,'').replace(/\bR\.?BR\.?.*/,'');
  t = t.replace(/\b\d[\d.\-\/]{3,}\b/g,' ').replace(/\s+/g,' ').trim();
  const w = t.split(' ').filter(x=>x.length>1);
  return w.slice(0,3).join(' ').trim();
}

/* ═══════════════════════════════════════════════════════════════════════════
   PARSIRANJE IZVODA
   Zajednički ulaz: niz "linija", svaka {t:tekst, seg:[{x,s}]}
   ═══════════════════════════════════════════════════════════════════════════ */

const RE_AMT  = /-?\d{1,3}(?:\.\d{3})*,\d{2}(?!\d)|-?\d+,\d{2}(?!\d)|-?\d{1,3}(?:,\d{3})+\.\d{2}(?!\d)|-?\d+\.\d{2}(?!\d)/g;
const RE_DATE = /\b(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})?\.?\b/;
const RE_IBAN = /\bHR\d{19}\b/;

/** Zamjenjuje datume i IBAN-e razmacima iste duljine — da se ne čitaju kao iznosi */
const RE_MASK = /\b\d{1,2}[.\/]\d{1,2}[.\/]\d{2,4}\.?|\b\d{1,2}[.\/]\d{1,2}\.(?!\d)|\bHR\d{19}\b|\bHR\d{2}[\s\d]{15,25}\b/g;
function maskLine(t){
  return t.replace(RE_MASK, m=>' '.repeat(m.length));
}
/** Nalazi sve iznose u tekstu s pozicijom (indeks znaka ili x-koordinata) */
function amountsIn(line){
  const out=[]; let m;
  const masked = maskLine(line.t);
  RE_AMT.lastIndex=0;
  while((m=RE_AMT.exec(masked))!==null){
    const before = m.index>0 ? masked[m.index-1] : ' ';
    if(/[\d.,\/-]/.test(before)) continue;
    const after = masked[m.index+m[0].length];
    if(after && /[\d\/]/.test(after)) continue;
    const v=pn(m[0]);
    out.push({v:v, raw:m[0], i:m.index, x:xAt(line, m.index)});
  }
  return out;
}
/** x-koordinata znaka na indeksu i (iz segmenata PDF-a); fallback = indeks */
function xAt(line,i){
  if(!line.seg || !line.seg.length) return i;
  if(line.seg[0].o!==undefined){            // segmenti s poznatim pomakom u tekstu (CSV)
    let last=line.seg[0];
    for(let k=0;k<line.seg.length;k++){ if(i>=line.seg[k].o) last=line.seg[k]; else break; }
    return last.x;
  }
  let acc=0;
  for(let k=0;k<line.seg.length;k++){
    const s=line.seg[k];
    if(i<acc+s.s.length+1) return s.x;
    acc+=s.s.length+1;
  }
  return line.seg[line.seg.length-1].x;
}

/**
 * Glavni parser: iz linija gradi transakcije.
 * @param lines [{t,seg}]
 * @param opt   {colMode:'auto'|'sign'|'left-out'|'right-out', defYear}
 */
/** Stupci Isplata / Uplata pročitani iz zaglavlja tablice — radi i kad je stavka samo jedna */
function hdrAnchors(L){
  const RO=/isplat|dugovn|duguje|tere[cć]enj|na\s+teret|zadu[zž]enj|odljev/i;
  const RI=/uplat|potra[zž]n|potra[zž]uje|odobrenj|u\s+korist|priljev/i;
  for(let i=0;i<L.length && i<60;i++){
    const l=L[i];
    const mo=RO.exec(l.t), mi=RI.exec(l.t);
    if(!mo||!mi) continue;
    if(amountsIn(l).length) continue;        // zaglavlje nema iznose
    const xo=xAt(l,mo.index), xi=xAt(l,mi.index);
    if(xo!==xi) return {out:xo, in:xi};
  }
  return null;
}

/** Navodi li opis naš izlazni račun istog iznosa — tada novac sigurno ulazi */
function ownInvoiceIn(desc, amt){
  const rn=rnOf(desc); if(!rn) return false;
  const pre=rn.split('-')[0];
  for(const k in D.td){
    const r=D.rows.find(x=>x.k===k); if(!r || r.s!=='prihod') continue;
    const mons=D.td[k]||[];
    for(let m=0;m<mons.length;m++){
      const arr=mons[m]||[];
      for(let j=0;j<arr.length;j++){
        const t=arr[j];
        if(Math.abs((Number(t.a)||0)-amt)>=0.005) continue;
        const tr=rnOf(t.o);
        if(tr && tr.split('-')[0]===pre) return true;
      }
    }
  }
  return false;
}

function parseStatement(lines, opt){
  opt = opt || {};
  // 1. odbaci prazne i zaglavlja
  const L = lines.map(l=>({t:String(l.t||'').replace(/\s+/g,' ').trim(), seg:l.seg||null}))
                 .filter(l=>l.t.length>2);

  // 2. skupi x-pozicije svih iznosa da prepoznamo stupce
  const xs=[];
  L.forEach(l=>amountsIn(l).forEach(a=>xs.push(a.x)));
  const cols = clusterX(xs);

  // 2b. početno stanje računa (za provjeru preko salda)
  let openBal=null;
  for(let i=0;i<L.length;i++){
    if(/prethodno\s+stanje|po[cč]etno\s+stanje|stanje\s+prethodnog|preneseno\s+sa\s+strane|prijenos\s+sa\s+strane/i.test(L[i].t)){
      const a=amountsIn(L[i]); if(a.length){ openBal=a[a.length-1].v; break; }
    }
  }

  // 3. grupiraj u transakcije — nova transakcija počinje linijom s datumom
  const raw=[];
  let cur=null;
  for(let i=0;i<L.length;i++){
    const l=L[i];
    const dm = l.t.match(RE_DATE);
    const amts = amountsIn(l);
    const isHdr = /^(datum|opis|duguje|potraz|potraž|stanje|iznos|valuta|str\.?\s*\d|izvod\s*br|broj\s*izvoda|ukupno|saldo|promet|novo\s+stanje|prethodno|preneseno|po[cč]etno|prijenos\s+sa|strana\s*\d|list\s*\d)\b/i.test(l.t)
                 || /^(privredna banka|erste|zagreba[cč]ka banka|otp banka|raiffeisen|addiko|hpb)\b/i.test(l.t)
                 || /\biban\b/i.test(l.t) && !amts.length;
    if(dm && amts.length && !isHdr){
      if(cur) raw.push(cur);
      cur={date:dm[0], txt:l.t, amts:amts, extra:[]};
    } else if(cur && !isHdr && !dm){
      cur.txt += ' ' + l.t;
      if(amts.length) cur.amts = cur.amts.concat(amts);
    } else if(dm && !amts.length && !isHdr){
      if(cur) raw.push(cur);
      cur={date:dm[0], txt:l.t, amts:[], extra:[]};
    }
  }
  if(cur) raw.push(cur);

  // 3b. najpouzdanija metoda — smjer iz promjene stanja računa
  const byBal = (opt.colMode==='auto') ? resolveByBalance(raw, openBal) : false;
  const hdr = (opt.colMode==='auto' && !byBal) ? hdrAnchors(L) : null;
  const method = byBal ? 'saldo' : (opt.colMode!=='auto' ? 'rucno'
                 : hdr ? 'zaglavlje' : (cols.length>=2 ? 'stupci' : 'predznak'));

  // 4. pretvori u stavke
  const out=[];
  raw.forEach(r=>{
    if(!r.amts.length) return;
    const dt = pd(r.date) || pd(r.date.replace(/\.$/,''));
    if(!dt) return;
    if(opt.defYear && dt.y===YEAR && /^\d{1,2}[.\/]\d{1,2}\.?$/.test(r.date)) dt.y=opt.defYear;

    const pick = r.pick || pickAmount(r.amts, cols, opt.colMode, hdr);
    if(!pick || !pick.v) return;

    let desc = cleanDesc(r.txt, r.date, r.amts);
    if(!desc) desc='(bez opisa)';

    let dir = pick.dir;
    /* Opis navodi naš izlazni račun s istim iznosom — to je naplata, ne trošak */
    if(dir==='out' && ownInvoiceIn(desc, Math.abs(pick.v))) dir='in';
    const cls = classify(desc, dir);
    /* Smjer nije potvrđen ni saldom ni stupcima — neka ide na provjeru */
    if(method==='predznak' && r.amts.length===1 && pick.v>0 && cls.conf!=='nauceno'){
      cls.conf='niska'; cls.flag=cls.flag||'chk';
    }
    out.push({
      id: uid(),
      dt: dt,
      dts: fmtDY(dt),
      amt: Math.abs(pick.v),
      dir: dir,
      desc: desc,
      raw: r.txt,
      cat: cls.cat,
      flag: cls.flag,
      conf: cls.conf,
      rule: cls.rule,
      use: cls.cat!=='__skip'
    });
  });
  return {items:out, cols:cols, method:method};
}

/**
 * Ako izvod ima stupac sa stanjem računa, smjer i iznos očitavaju se iz promjene
 * stanja između dva reda. To je neovisno o rasporedu stupaca i najtočnije je.
 * @returns true ako je metoda primjenjiva (tada su r.pick popunjeni)
 */
function resolveByBalance(raw, openBal){
  const rows = raw.filter(r=>r.amts.length>=2);
  if(rows.length<3) return false;
  let prev = (openBal!==null && openBal!==undefined) ? openBal : null;
  let ok=0, tot=0;
  const tmp=[];
  raw.forEach(r=>{
    if(!r.amts.length) return;
    const bal = r.amts[r.amts.length-1].v;
    if(prev!==null && r.amts.length>=2){
      const d = Math.round((bal-prev)*100)/100;
      tot++;
      const hit = r.amts.slice(0,-1).some(a=>Math.abs(Math.abs(a.v)-Math.abs(d))<0.011);
      if(hit && Math.abs(d)>0.001){ ok++; tmp.push({r:r, v:Math.abs(d), dir: d>0?'in':'out'}); }
    }
    prev = bal;
  });
  if(tot>=3 && ok/tot>=0.6){
    tmp.forEach(x=>{ x.r.pick={v:x.v, dir:x.dir}; });
    return true;
  }
  return false;
}

/** Grupira x-koordinate u stupce (jednostavno 1D klasteriranje) */
function clusterX(xs){
  if(!xs.length) return [];
  const s=xs.slice().sort((a,b)=>a-b);
  const span=s[s.length-1]-s[0];
  const tol=Math.max(6, span*0.045);
  const cl=[]; let g=[s[0]];
  for(let i=1;i<s.length;i++){
    if(s[i]-g[g.length-1]<=tol) g.push(s[i]);
    else { cl.push(g); g=[s[i]]; }
  }
  cl.push(g);
  return cl.map(g=>({c:g.reduce((a,b)=>a+b,0)/g.length, n:g.length}))
           .filter(c=>c.n>=2).sort((a,b)=>a.c-b.c);
}

/**
 * Odabire pravi iznos iz linije i određuje smjer.
 * Standardni raspored hrvatskog izvoda: … | DUGUJE | POTRAŽUJE | STANJE
 */
function pickAmount(amts, cols, mode, hdr){
  mode = mode || 'auto';
  if(hdr && mode==='auto'){
    const tol=Math.max(30, Math.abs(hdr.in-hdr.out)*0.45);
    const near=(x,c)=>Math.abs(x-c)<=tol;
    const o=amts.find(a=>near(a.x,hdr.out) && Math.abs(a.v)>0);
    const i=amts.find(a=>near(a.x,hdr.in)  && Math.abs(a.v)>0);
    if(o) return {v:Math.abs(o.v), dir:'out'};
    if(i) return {v:Math.abs(i.v), dir:'in'};
  }
  if(mode==='sign'){
    const a=amts[0];
    return {v:Math.abs(a.v), dir: a.v<0 ? 'out':'in'};
  }
  if(cols.length>=3 && mode==='auto'){
    // zadnji stupac = stanje računa → izbaci ga
    const cD=cols[cols.length-3].c, cP=cols[cols.length-2].c, cS=cols[cols.length-1].c;
    const near=(x,c)=>Math.abs(x-c)<=Math.max(10,(cS-cD)*0.28);
    const dug=amts.find(a=>near(a.x,cD)), pot=amts.find(a=>near(a.x,cP));
    if(dug && Math.abs(dug.v)>0) return {v:Math.abs(dug.v), dir:'out'};
    if(pot && Math.abs(pot.v)>0) return {v:Math.abs(pot.v), dir:'in'};
  }
  if(cols.length===2 && mode==='auto'){
    const cD=cols[0].c, cP=cols[1].c, mid=(cD+cP)/2;
    const dug=amts.find(a=>a.x<=mid), pot=amts.find(a=>a.x>mid);
    if(dug && Math.abs(dug.v)>0) return {v:Math.abs(dug.v), dir:'out'};
    if(pot && Math.abs(pot.v)>0) return {v:Math.abs(pot.v), dir:'in'};
  }
  if(mode==='left-out' && amts.length>=2)  return {v:Math.abs(amts[0].v), dir:'out'};
  if(mode==='right-out' && amts.length>=2) return {v:Math.abs(amts[amts.length-1].v), dir:'out'};
  // jedan iznos — predznak ili ključne riječi
  const a = amts[0];
  const t = norm(amts.__t||'');
  if(a.v<0) return {v:Math.abs(a.v), dir:'out'};
  return {v:Math.abs(a.v), dir:'out'};
}

/** Čisti opis: miče datume, iznose, IBAN-e, modele i pozive na broj */
function cleanDesc(txt, date, amts){
  let t=' '+txt+' ';
  if(date) t=t.split(date).join(' ');
  (amts||[]).forEach(a=>{ t=t.split(a.raw).join(' '); });
  t=t.replace(/\b\d{1,2}[.\/]\d{1,2}[.\/]\d{2,4}\.?\b/g,' ')
     .replace(RE_IBAN,' ')
     .replace(/\bHR\d{2}[\s\d]{15,25}\b/g,' ')
     .replace(/\bMODEL\s*HR\d{2}\b/gi,' ')
     .replace(/\bPOZIV NA BR(OJ)?\.?\b/gi,' ')
     .replace(/\b\d{2}-\d{4,}-\d+\b/g,' ')
     .replace(/^\s*\d{1,4}\s+/,' ')
     .replace(/\s{2,}/g,' ').trim();
  return t.slice(0,140);
}

/**
 * Usporedba s već unesenim stavkama.
 * Traži po SVIM mjesecima jer se stavka u aplikaciji vodi po datumu računa,
 * a na izvodu se pojavljuje po datumu plaćanja — često su to različiti mjeseci.
 * @returns 'tocno'  — isti dan i iznos, prepoznatljivo isti partner → već uneseno
 *          'mozda'  — isti ili susjedni dan i isti iznos → treba pogledati
 *          false    — nema podudaranja
 */
function isDuplicate(it){
  const nd = norm(it.desc), key = nd.slice(0,20);
  const target = new Date(it.dt.y, it.dt.m-1, it.dt.d).getTime();
  let maybe=false;
  for(let k in D.td){
    const mons=D.td[k]||[];
    for(let mi=0; mi<mons.length; mi++){
      const arr=mons[mi]||[];
      for(let j=0;j<arr.length;j++){
        const t=arr[j];
        if(Math.abs((Number(t.a)||0)-it.amt)>=0.005) continue;
        // usporedi i datum računa i datum plaćanja
        let diff=null;
        [t.d, t.p].forEach(str=>{
          const q=pd(str); if(!q) return;
          const y = q.y && q.y>2000 ? q.y : it.dt.y;
          const dd=Math.abs(new Date(y,q.m-1,q.d).getTime()-target)/864e5;
          if(diff===null || dd<diff) diff=dd;
        });
        if(diff===null || diff>1) continue;
        const o=norm(t.o);
        const isti = !key || o.indexOf(key)>-1 || key.indexOf(o.slice(0,20))>-1 || sharedWord(o,nd);
        if(diff===0 && isti) return 'tocno';
        maybe=true;
      }
    }
  }
  return maybe ? 'mozda' : false;
}
/* ═══════════════════════════════════════════════════════════════════════════
   ZATVARANJE OTVORENIH RAČUNA
   Uplata kupca ili plaćanje dobavljaču s izvoda ne smije otvoriti novi redak
   ako taj račun već postoji u knjizi, a polje PLAĆENO mu je prazno.
   U tom slučaju se u postojeći redak upisuje samo datum plaćanja s izvoda.
   ═══════════════════════════════════════════════════════════════════════════ */

/** Sekcija kategorije: 'prihod' | 'place' | 'fiksni' | 'ostali' */
function secOf(k){ const r=D.rows.find(x=>x.k===k); return r?r.s:''; }

/** Broj računa iz opisa — 'RN.BR:112-1-1', 'po računu 97-1-1', '112/1/1' */
function rnOf(s){
  const u=String(s||'').toUpperCase();
  /* podnosi sve oblike iz knjige: RN.BR:112-1-1 · RN:BR:240142-BIL1-011 ·
     RN:13-1-142 · RN: 15-U-1/2026 · "po računu br. 97-1-1" */
  let m=u.match(/\bRN\s*[.:]?\s*(?:BR\s*[.:]?)?\s*([0-9]+(?:[-\/][0-9A-Z]+)+)/);
  if(!m) m=u.match(/RA[CČ]UN[UA]?\s*(?:BR\.?:?)?\s*([0-9]+(?:[-\/][0-9A-Z]+)+)/);
  if(!m) m=u.match(/(?:^|\s)(\d{1,7}[-\/][0-9A-Z]{1,6}[-\/][0-9A-Z]{1,6})(?:\s|$)/);
  return m ? m[1].replace(/\//g,'-') : '';
}

/** Račun je otvoren dok polje PLAĆENO ne sadrži valjan datum */
function unpaidRow(t){ return !pd(t.p); }

/**
 * Traži otvoreni račun koji ova stavka s izvoda zatvara.
 * Uvjeti: isti iznos, ista strana (uplata → prihod, isplata → trošak),
 * datum računa nije nakon uplate, i podudaranje broja računa ili naziva partnera.
 * @param claimed lista redaka koje je već preuzela neka ranija stavka
 */
function findOpenMatch(it, claimed){
  const traziPrihod = it.dir==='in';
  const nd = norm(it.desc), rn = rnOf(it.desc);
  const target = new Date(it.dt.y, it.dt.m-1, it.dt.d).getTime();
  /* Dopušteno odstupanje iznosa — pokriva zatipak pri ručnom unosu (56,68 umjesto 56,88),
     ne i djelomično plaćanje. Uvažava se samo uz jak signal (broj računa, partner ili
     ista kategorija). */
  const tol = Math.min(5, Math.max(0.5, it.amt*0.02));
  const cands=[];
  for(let k in D.td){
    const s=secOf(k); if(!s) continue;
    if(traziPrihod !== (s==='prihod')) continue;
    const mons=D.td[k]||[];
    for(let mi=0; mi<mons.length; mi++){
      const arr=mons[mi]||[];
      for(let j=0;j<arr.length;j++){
        const t=arr[j];
        if(claimed && claimed.indexOf(t)>-1) continue;
        if(!unpaidRow(t)) continue;
        const diff=Math.abs((Number(t.a)||0)-it.amt);
        if(diff>tol) continue;
        const tocno = diff<0.005;
        let age=9999;
        const q=pd(t.d);
        if(q){
          const y = q.y && q.y>2000 ? q.y : it.dt.y;
          age = (target - new Date(y,q.m-1,q.d).getTime())/864e5;
          if(age < -3 || age > 400) continue;      // uplata prije izdavanja računa
        }
        const tr = rnOf(t.o);
        let sc = 0;
        if(rn && tr){
          /* oba zapisa navode broj računa — ako se ne radi o istom, ovo nije taj račun,
             makar se partner i iznos poklapali */
          if(rn.split('-')[0] !== tr.split('-')[0]) continue;
          sc = (rn===tr) ? 3 : 2.5;
        }
        else if(sharedWord(norm(t.o), nd)) sc = 2;  // isti partner, bez broja računa
        /* ručno unesen račun često nosi samo broj („RN:606998/7/1/2026"), a izvod samo
           naziv banke — tada ih povezuje ista knjigovodstvena kategorija */
        else if(it.cat && k===it.cat) sc = 2;
        else continue;
        if(it.cat && k===it.cat && sc<3) sc += 0.4;
        /* dospijeće upravo na dan plaćanja dodatno potvrđuje da je to taj račun */
        const v=pd(t.v);
        if(v && v.d===it.dt.d && v.m===it.dt.m) sc += 0.6;
        if(!tocno){
          if(sc<2) continue;          // približan iznos prihvaća se samo uz jak signal
          sc -= 1;
        }
        cands.push({cat:k, mi:mi, t:t, sc:sc, age:Math.abs(age), diff:diff, near:!tocno});
      }
    }
  }
  if(!cands.length) return null;
  cands.sort((a,b)=> (a.near?1:0)-(b.near?1:0) || b.sc-a.sc || a.diff-b.diff || a.age-b.age);
  const best=cands[0];
  best.cands=cands.slice(0,8);   // kod više otvorenih računa korisnik bira koji
  return best;
}

/** Dodjeljuje svakoj stavci otvoreni račun koji zatvara; jedan račun = jedna uplata */
/**
 * Djelatnik iz registra spomenut u opisu.
 * Traže se svi dijelovi imena, neovisno o redoslijedu — izvod piše
 * „PREZIME IME", a registar „Ime Prezime".
 */
function empMatch(desc){
  let E=(D.settings&&D.settings.emps)||[];
  /* registar još nije inicijaliziran (npr. pri učitavanju) — koristi polazni popis */
  if(!E.length){ try{ E=EMPS_DEF.map(e=>({ime:e[0], rm:e[1], rola:e[2]})); }catch(e){ E=[]; } }
  if(!E.length) return null;
  const n=norm(desc);
  for(let i=0;i<E.length;i++){
    const dij=norm(E[i].ime).split(' ').filter(w=>w.length>=3);
    if(!dij.length) continue;
    let sve=true;
    for(let j=0;j<dij.length;j++){
      const re=new RegExp('(^|[^A-Z0-9])'+dij[j].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^A-Z0-9]|$)');
      if(!re.test(n)){ sve=false; break; }
    }
    if(sve) return E[i];
  }
  return null;
}

/* Oznake koje se na izvodu pojavljuju isključivo uz isplate plaća i naknada.
   Banka ponekad prelomi riječ ("za P LAĆA-..."), pa se dopušta razmak. */
const RE_PLACE_HARD=/(^|[^A-Z])P ?LAC[AE]([^A-Z]|$)|TEKUCI RACUNI PO SPECIFIKACIJI|OTPREMNIN|BOZICNIC|(^|[^A-Z])REGRES|DAR DJETETU/;
/* Slabije oznake — vrijede samo uz ime djelatnika iz registra */
const RE_PLACE_SOFT=/PREHRAN|PRIJEVOZ|NAGRADA|NAKNADA ZA RAD|NEOPOREZIV|ISPLATA/;
/* Isplate djelatniku koje NISU plaća (pozajmice, dokapitalizacija, troškovi na ime djelatnika) */
const RE_PLACE_NOT=/POZAJM|ZAJAM|DOKAPITAL|KREDIT|DIVIDEND|UDJEL|DOZVOL|BORAVAK|NAJAM|PUTNI NALOG|LOKO/;

/** Prepoznaje opis s izvoda koji pripada plaćama (i kad stavka nije razvrstana) */
function payrollDesc(desc){
  const s=String(desc||''); if(!s) return false;
  const n=norm(s);
  if(RE_PLACE_NOT.test(n)) return false;
  if(RE_PLACE_HARD.test(n)) return true;
  return RE_PLACE_SOFT.test(n) && !!empMatch(s);
}

/** Je li stavka isplata plaće — zastavica, kategorija plaća ili ime djelatnika u opisu */
function isPayroll(it){
  if(it.flag==='split') return true;
  const r=D.rows.find(x=>x.k===it.cat);
  if(r && r.s==='place') return true;
  return payrollDesc(it.desc||it.o||'');
}

function matchOpen(items){
  const claimed=[];
  items.slice().sort((a,b)=>dnum(a.dt)-dnum(b.dt)).forEach(it=>{
    it.match=null; it.mode='new';
    /* Plaće se u RDG-u vode kao mjesečni bruto iznos, pa isplata s izvoda
       ne otvara novi redak — upisuje se samo datum isplate, i to za
       PRETHODNI mjesec jer se plaća isplaćuje mjesec poslije. */
    if(it.dir==='out' && isPayroll(it)){
      it.mode='place';
      it.pm = (it.dt.m-2+12)%12;      // rujanska isplata → plaće za kolovoz
      return;
    }
    if(it.dup==='tocno') return;
    const m=findOpenMatch(it, claimed);
    if(m){ it.match=m; it.mode='close'; claimed.push(m.t); }
  });
}

/** Dijele li opisi barem jednu prepoznatljivu riječ (naziv partnera ili broj računa) */
function sharedWord(a,b){
  const stop={'D.O.O.':1,'DOO':1,'J.D.O.O.':1,'RN.BR':1,'RN':1,'BR':1,'POS':1,'PBZ':1,'ZA':1,'PO':1,'I':1,'THE':1,'INC':1,'LTD':1,'GMBH':1};
  const wa=a.split(' ').filter(w=>w.length>3 && !stop[w]);
  const wb=b.split(' ').filter(w=>w.length>3 && !stop[w]);
  for(let i=0;i<wa.length;i++) if(wb.indexOf(wa[i])>-1) return true;
  return false;
}

/* ═══════════════════════════════════════════════════════════════════════════
   UVOZ IZVODA  —  PDF (pdf.js) · zalijepljeni tekst · CSV/TXT · Excel
   ═══════════════════════════════════════════════════════════════════════════ */

const CDN = {
  pdf:  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfW: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
};
const LIB = {pdf:null, xlsx:null};

function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src; s.onload=()=>res(); s.onerror=()=>rej(new Error('Nije moguće učitati '+src));
    document.head.appendChild(s);
  });
}
async function needPdf(){
  if(window.pdfjsLib) { LIB.pdf=window.pdfjsLib; }
  if(!LIB.pdf){
    await loadScript(CDN.pdf);
    if(!window.pdfjsLib) throw new Error('pdf.js nije dostupan');
    LIB.pdf = window.pdfjsLib;
    LIB.pdf.GlobalWorkerOptions.workerSrc = CDN.pdfW;
  }
  return LIB.pdf;
}
async function needXlsx(){
  if(window.XLSX){ LIB.xlsx=window.XLSX; return LIB.xlsx; }
  await loadScript(CDN.xlsx);
  if(!window.XLSX) throw new Error('SheetJS nije dostupan');
  LIB.xlsx=window.XLSX; return LIB.xlsx;
}

/* ── PDF → linije s x-koordinatama ────────────────────────────────────────── */
async function pdfLines(buf){
  const pdfjs = await needPdf();
  const doc = await pdfjs.getDocument({data:buf}).promise;
  const lines=[];
  for(let p=1;p<=doc.numPages;p++){
    const page = await doc.getPage(p);
    const tc   = await page.getTextContent();
    const rows = {};
    tc.items.forEach(it=>{
      const s=(it.str||'');
      if(!s.trim()) return;
      const x=it.transform[4], y=Math.round(it.transform[5]*2)/2;
      const key=y.toFixed(1);
      (rows[key] = rows[key] || []).push({x:x, s:s});
    });
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{
      const seg = rows[y.toFixed(1)].sort((a,b)=>a.x-b.x);
      // spoji susjedne fragmente u jedan tekst, čuvajući x svakog segmenta
      const t = seg.map(s=>s.s).join(' ').replace(/\s+/g,' ').trim();
      if(t) lines.push({t:t, seg:seg, page:p});
    });
  }
  return lines;
}

/* ── Tekst → linije ───────────────────────────────────────────────────────── */
function textLines(txt){
  return String(txt||'').split(/\r?\n/).map(t=>({t:t, seg:null}));
}

/* ── CSV / TXT ────────────────────────────────────────────────────────────── */
function csvLines(txt){
  const raw=String(txt||'').split(/\r?\n/).filter(l=>l.trim());
  if(!raw.length) return [];
  const cand=[';','\t','|',','];
  let sep=';', best=0;
  cand.forEach(c=>{ const n=(raw[0].split(c).length-1); if(n>best){best=n;sep=c;} });
  if(best===0) return textLines(txt);
  return raw.map(l=>{
    const cells=splitCsv(l,sep).map(c=>c.trim());
    let off=0;
    const seg=cells.map((c,ix)=>{ const o={x:ix*120, s:c, o:off}; off+=c.length+2; return o; });
    return {t:cells.join('  '), seg:seg};
  });
}
function splitCsv(line,sep){
  const out=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){ if(q && line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(ch===sep && !q){ out.push(cur); cur=''; }
    else cur+=ch;
  }
  out.push(cur); return out;
}

/* ── Excel ────────────────────────────────────────────────────────────────── */
async function xlsxLines(buf){
  const X = await needXlsx();
  const wb = X.read(buf,{type:'array',cellDates:false,raw:false});
  const lines=[];
  wb.SheetNames.forEach(sn=>{
    const rows = X.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:''});
    rows.forEach(r=>{
      const cells=r.map(c=>String(c==null?'':c).trim());
      if(!cells.join('').trim()) return;
      let x=0; const seg=cells.map(c=>{const o={x:x,s:c}; x+=120; return o;});
      lines.push({t:cells.join('  '), seg:seg});
    });
  });
  return lines;
}


/* ═══════════════════════════════════════════════════════════════════════════
   PBZ — IZVADAK PO TRANSAKCIJSKOM RAČUNU (dnevni)
   Stavka se prostire kroz nekoliko redaka, datum je u zaglavlju izvatka,
   a iznos u stupcu Isplata (Duguje) ili Uplata (Potražuje). Stupci se
   prepoznaju po x-položaju naslova, pa se iznos u stranoj valuti
   ("20,00 (840)") ne miješa s iznosom terećenja.
   ═══════════════════════════════════════════════════════════════════════════ */

function isPBZ(lines){
  const t=lines.map(l=>l.t).join(' ');
  return /IZVADAK\s+PO\s+TRANSAKCIJSKOM\s+RA[CČ]UNU/i.test(t)
      || (/Izvadak\s+EUR\s+br/i.test(t) && /Isplata/i.test(t) && /Uplata/i.test(t));
}

/** Vrijednost segmenta na liniji unutar raspona x */
function segIn(line, x0, x1){
  if(!line.seg || !line.seg.length) return '';
  return line.seg.filter(s=>s.x>=x0 && s.x<x1).map(s=>s.s).join(' ').trim();
}

function parsePBZ(lines){
  const L=lines;
  // 1. zaglavlje tablice → x-položaji stupaca
  let hi=-1, A={};
  for(let i=0;i<L.length;i++){
    const t=L[i].t;
    if(/\bRBR\b/i.test(t) && /Isplata/i.test(t) && /Uplata/i.test(t)){
      hi=i;
      (L[i].seg||[]).forEach(s=>{
        const w=norm(s.s);
        if(w.indexOf('RBR')===0 && A.rbr===undefined) A.rbr=s.x;
        else if(w.indexOf('RACUN')===0 && A.naz===undefined) A.naz=s.x;
        else if(w.indexOf('REFERENCA')===0 && A.ref===undefined) A.ref=s.x;
        else if(w.indexOf('OPIS')===0 && A.opis===undefined) A.opis=s.x;
        else if(w.indexOf('SIFRA')===0 && A.sif===undefined) A.sif=s.x;
        else if(w.indexOf('ISPLATA')===0 && A.isp===undefined) A.isp=s.x;
        else if(w.indexOf('UPLATA')===0 && A.upl===undefined) A.upl=s.x;
      });
      break;
    }
  }
  if(hi<0 || A.isp===undefined || A.upl===undefined) return null;
  if(A.naz===undefined) A.naz=A.rbr+20;
  if(A.ref===undefined) A.ref=(A.naz+A.opis)/2;
  if(A.sif===undefined) A.sif=(A.opis+A.isp)/2;

  // 2. podaci iz zaglavlja izvatka
  const head=L.slice(0,hi).map(l=>l.t).join('\n');
  const g=(re)=>{ const m=head.match(re); return m?m[1]:''; };
  const datIzv = pd(g(/Datum\s*izvatka\s*:?\s*(\d{1,2}\.\d{1,2}\.\d{4})/i));
  const meta={
    broj:   g(/Izvadak\s*EUR\s*br\.?\s*:?\s*(\d+)/i),
    datum:  datIzv,
    prije:  pn(g(/Stanje\s*prethodnog\s*izvatka\s*:?\s*([\d.,]+)/i)),
    duguje: pn(g(/Ukupni\s*dugovni\s*promet\s*na\s*dan\s*:?\s*([\d.,]+)/i)),
    potraz: pn(g(/Ukupni\s*potra[zž]ni\s*promet\s*na\s*dan\s*:?\s*([\d.,]+)/i)),
    novo:   pn(g(/Novo\s*stanje\s*:?\s*([\d.,]+)/i)),
  };

  // 3. blokovi stavki — počinju rednim brojem "1." u prvom stupcu
  const isStart=l=>{
    if(!l.seg||!l.seg.length) return false;
    const f=l.seg[0];
    return f.x < A.naz-6 && /^\d{1,3}\.$/.test(f.s);
  };
  const isEnd=l=>/KRAJ\s+\d*\s*EUR\s+IZVATKA|\*\*\*\s*KRAJ/i.test(l.t);
  const blocks=[]; let cur=null;
  for(let i=hi+1;i<L.length;i++){
    const l=L[i];
    if(isEnd(l)){ if(cur) blocks.push(cur); cur=null; break; }
    if(isStart(l)){ if(cur) blocks.push(cur); cur=[l]; }
    else if(cur) cur.push(l);
  }
  if(cur) blocks.push(cur);

  // 4. stavke
  const tol=Math.max(30,(A.upl-A.isp)*0.55);
  const items=[];
  blocks.forEach(bl=>{
    let desc='', name='', amt=null, dir='out', dv=null, di=null;
    bl.forEach((l,li)=>{
      const o=segIn(l, A.opis-10, A.sif-10);
      if(o && !/^\d+[,.]\d{2}\s*\(\d+\)$/.test(o)) desc += (desc?' ':'')+o;
      // naziv partnera = samo PRVI redak stupca; iza njega slijede ulica, mjesto i država
      const n=segIn(l, A.naz-10, A.ref-10);
      if(n && li>0 && !name && !RE_IBAN.test(n)) name = n;
      // datumi u stupcu Šifra namjene / Datum valute / Datum izvršenja
      const dcol=segIn(l, A.sif-10, A.isp-10);
      const dm=dcol.match(/(\d{1,2}\.\d{1,2}\.\d{4})/g);
      if(dm){ if(!dv) dv=pd(dm[0]); if(dm[1]) di=pd(dm[1]); else if(dv&&!di) di=null; }
      // iznosi u stupcima Isplata / Uplata
      (l.seg||[]).forEach(s=>{
        if(s.x < A.isp-tol) return;
        if(!/^-?\d{1,3}(\.\d{3})*,\d{2}$|^-?\d+,\d{2}$/.test(s.s)) return;
        const v=pn(s.s); if(!v) return;
        const toIsp=Math.abs(s.x-A.isp), toUpl=Math.abs(s.x-A.upl);
        if(amt===null){ amt=Math.abs(v); dir = toIsp<=toUpl ? 'out':'in'; }
      });
    });
    if(amt===null) return;
    const dt = di || dv || meta.datum;
    if(!dt) return;
    name=name.replace(/\s{2,}/g,' ').trim();
    desc=desc.replace(/^PBZ\s+POS\s+/i,'').replace(/^POS\s+/i,'')
             .replace(/\s+\d{1,3}(?:\.\d{3})*,\d{2}\s*\(\s*\d{3}\s*\)\s*$/,'')   // iznos u stranoj valuti
             .replace(/\s{2,}/g,' ').trim();
    const kartica=/VISA|MASTERCARD|MAESTRO|DEBITNA|KARTIC/i.test(name);

    // broj računa iz opisa → zapis u obliku kakav se već koristi u aplikaciji
    let rn='';
    let mm=desc.match(/^(\d+[-\/]\d+[-\/]\d+)$/);
    if(mm) rn=mm[1];
    else { mm=desc.match(/(?:po\s+)?ra[cč]unu?\s*(?:br\.?:?)?\s*([0-9]+[-\/][0-9A-Za-z\-\/]+)/i); if(mm) rn=mm[1]; }

    let full;
    if(kartica)            full = desc;
    else if(rn && dir==='in')  full = 'RN.BR:'+rn+(name?' / '+name:'');
    else if(rn)            full = (name?name+' ':'')+'RN.BR:'+rn;
    else                   full = ((name?name+' ':'')+desc).trim();
    if(!full) full = desc || name || '(bez opisa)';
    const cls=classify(full, dir);
    items.push({
      id:uid(), dt:dt, dts:fmtDY(dt), amt:amt, dir:dir, desc:full.slice(0,140),
      raw:bl.map(l=>l.t).join(' | ').slice(0,300),
      cat:cls.cat, flag:cls.flag, conf:cls.conf, rule:cls.rule,
      use:cls.cat!=='__skip'
    });
  });
  return {items:items, meta:meta};
}

/** Provjera protiv kontrolnih zbrojeva s izvatka */
function pbzCheck(items, meta){
  const d=items.filter(i=>i.dir==='out').reduce((s,i)=>s+i.amt,0);
  const u=items.filter(i=>i.dir==='in').reduce((s,i)=>s+i.amt,0);
  const okD=Math.abs(d-(meta.duguje||0))<0.005, okU=Math.abs(u-(meta.potraz||0))<0.005;
  return {duguje:d, potraz:u, okD:okD, okU:okU, ok:okD&&okU,
          ocek_d:meta.duguje||0, ocek_u:meta.potraz||0};
}

/* ═══════════════════════════════════════════════════════════════════════════
   EKRAN ZA UVOZ
   ═══════════════════════════════════════════════════════════════════════════ */
let IMP = null;   // {items:[], cols:[], src:'', mode:'auto', filter:'all'}
let AUDIT = [];   // provjera redaka nastalih uvozom izvoda

/* ═══════════════════════════════════════════════════════════════════════════
   PROVJERA UVEZENIH STAVAKA
   Svaki redak nastao uvozom izvoda (src:'izvod') svrstava se u jedno od troje:
     spoji    — uplata pripada računu koji je u knjizi i još je bez datuma plaćanja
     duplikat — ista stavka je već ručno unesena i plaćena, uvoz ju je ponovio
     ok       — nova stavka koje u knjizi nije bilo
   ═══════════════════════════════════════════════════════════════════════════ */

/** Ručno unesena stavka koju je uvoz ponovio (isti iznos, partner i datum ±3 dana) */
function dupOfManual(pr){
  const nd=norm(String(pr.t.o||'')), rn=rnOf(pr.t.o);
  const q=pd(pr.t.d)||pd(pr.t.p); if(!q) return null;
  const target=new Date(q.y,q.m-1,q.d).getTime();
  const a=Number(pr.t.a)||0;
  let best=null;
  for(const k in D.td){
    const s=secOf(k); if(!s) continue;
    (D.td[k]||[]).forEach((arr,mi)=>(arr||[]).forEach(t=>{
      if(t===pr.t || t.src==='izvod') return;
      if(Math.abs((Number(t.a)||0)-a)>=0.005) return;
      let diff=null;
      [t.d,t.p].forEach(str=>{
        const w=pd(str); if(!w) return;
        const y=(w.y&&w.y>2000)?w.y:q.y;
        const dd=Math.abs(new Date(y,w.m-1,w.d).getTime()-target)/864e5;
        if(diff===null||dd<diff) diff=dd;
      });
      if(diff===null||diff>3) return;
      const tr=rnOf(t.o);
      let sc=0;
      if(rn&&tr){ if(rn.split('-')[0]!==tr.split('-')[0]) return; sc=3; }
      else if(sharedWord(norm(t.o),nd)) sc=2;
      else return;
      const c={cat:k,mi:mi,t:t,sc:sc,diff:diff};
      if(!best||c.sc>best.sc||(c.sc===best.sc&&c.diff<best.diff)) best=c;
    }));
  }
  return best;
}

function importAudit(){
  const rows=[], out=[], claimed=[];
  for(const k in D.td){
    const s=secOf(k); if(!s) continue;
    (D.td[k]||[]).forEach((arr,mi)=>(arr||[]).forEach(t=>{
      if(t.src==='izvod') rows.push({cat:k, mi:mi, t:t, dir:(s==='prihod'?'in':'out')});
    }));
  }
  rows.sort((a,b)=>{ const A=pd(a.t.p)||pd(a.t.d), B=pd(b.t.p)||pd(b.t.d);
                     return (A?dnum(A):0)-(B?dnum(B):0); });
  rows.forEach(pr=>{
    /* plaće se vode ručno u rubrici Djelatnici — uvezeni redak je uvijek višak */
    if(pr.dir==='out' && payrollDesc(pr.t.o)){
      const e=empMatch(String(pr.t.o||''));
      return out.push({row:pr, kind:'place', emp:(e?e.ime:'')});
    }
    const q=pd(pr.t.p)||pd(pr.t.d);
    if(!q) return out.push({row:pr, kind:'ok'});
    const it={desc:String(pr.t.o||''), amt:Number(pr.t.a)||0, dir:pr.dir, dt:q, cat:pr.cat};
    const m=findOpenMatch(it, claimed.concat([pr.t]));
    if(m){ claimed.push(m.t); return out.push({row:pr, kind:'spoji', inv:m}); }
    const d=dupOfManual(pr);
    if(d) return out.push({row:pr, kind:'duplikat', dupOf:d});
    out.push({row:pr, kind:'ok'});
  });
  return out;
}
/** Koliko redaka traži zahvat — koristi se za upozorenja i značku u izborniku */
function auditCount(){
  try{ return importAudit().filter(a=>a.kind!=='ok').length; }catch(e){ return 0; }
}

/* ── zahvati ───────────────────────────────────────────────────────────────── */
function dropRow(r){
  const arr=(D.td[r.cat]||[])[r.mi]||[];
  const ix=arr.indexOf(r.t); if(ix>-1) arr.splice(ix,1);
}
function applyMerge(a){
  a.inv.t.p = a.row.t.p || a.row.t.d;
  if(!pd(a.inv.t.v)) a.inv.t.v = a.inv.t.p;
  /* izvod je mjerodavan za iznos — ispravlja zatipak iz ručnog unosa */
  if(a.inv.near) a.inv.t.a = Math.round((Number(a.row.t.a)||0)*100)/100;
  dropRow(a.row);
}
/** Odabir drugog otvorenog računa kad partner ima više stavki istog iznosa */
function auditPick(ix, sel){
  const a=AUDIT[ix]; if(!a||!a.inv) return;
  const c=(a.inv.cands||[])[sel]; if(!c) return;
  a.inv=Object.assign({}, c, {cands:a.inv.cands});
}
function auditMerge(ix){
  const a=AUDIT[ix]; if(!a||a.kind!=='spoji') return;
  const dat=a.row.t.p||a.row.t.d;
  applyMerge(a); save(true); reRender();
  toast('Spojeno — datum '+dat+' upisan u polje PLAĆENO');
}
function auditDrop(ix){
  const a=AUDIT[ix]; if(!a) return;
  dropRow(a.row); save(true); reRender();
  toast('Uvezeni redak obrisan');
}
function auditAll(kind){
  const list=AUDIT.filter(a=>a.kind===kind);
  if(!list.length) return;
  let iz=0;
  list.forEach(a=>{ if(kind==='spoji') applyMerge(a); else { iz+=Number(a.row.t.a)||0; dropRow(a.row); } });
  save(true); reRender();
  toast(kind==='spoji' ? 'Spojeno '+list.length+' uplata s otvorenim računima'
      : kind==='place' ? 'Uklonjeno '+list.length+' stavaka plaća ('+nf2(iz)+' EUR) — plaće ostaju onako kako su unesene u rubrici Djelatnici'
                       : 'Obrisano '+list.length+' dvostruko knjiženih redaka');
}

/** Koliko uvezene stavke podižu prihode i rashode u odnosu na ručni unos */
function auditEffect(){
  const e={in:0, out:0, n:0, po:{}};
  AUDIT.forEach(a=>{
    const v=Number(a.row.t.a)||0;
    e.n++;
    if(a.row.dir==='in') e.in+=v; else e.out+=v;
    const l=catLbl(a.row.cat);
    e.po[l]=(e.po[l]||0)+v;
  });
  return e;
}
function auditDropAll(){
  if(!AUDIT.length) return;
  const n=AUDIT.length;
  AUDIT.forEach(a=>dropRow(a.row));
  save(true); reRender();
  toast('Uklonjeno '+n+' redaka nastalih uvozom — brojke su vraćene na ručni unos');
}

/** Sažetak: za koliko uvoz podiže prihode i rashode i po kojim kategorijama */
function auditEffectBox(){
  const e=auditEffect();
  if(!e.n) return '';
  const po=Object.keys(e.po).sort((a,b)=>e.po[b]-e.po[a])
    .map(k=>'<span class="chip" style="cursor:default">'+esc(k)+' <span class="c">'+nf2(e.po[k])+'</span></span>').join('');

function wireImport(){
  const dz=document.getElementById('dz'), inp=document.getElementById('dzInp');
  if(!dz) return;
  dz.onclick=()=>inp.click();
  inp.onchange=e=>{ if(e.target.files.length) handleFiles([].slice.call(e.target.files)); };
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('over');}));
  dz.addEventListener('drop',e=>{ const f=[].slice.call(e.dataTransfer.files); if(f.length) handleFiles(f); });
  document.getElementById('btnPaste').onclick=()=>{
    const t=document.getElementById('pasteBox').value;
    if(!t.trim()) return toast('Zalijepite tekst izvoda',1);
    runParse(csvLines(t).length>2 && t.indexOf(';')>-1 ? csvLines(t) : textLines(t), 'zalijepljeni tekst');
  };
}

async function handleFiles(files){
  files.sort((a,b)=>a.name.localeCompare(b.name));
  const all=[], metas=[], greske=[];
  for(let i=0;i<files.length;i++){
    const f=files[i];
    impStat('<div class="alert i"><div class="alert-i">'+IC.clock+'</div><div><div class="alert-t">Obrađujem '
      +(files.length>1?(i+1)+' / '+files.length+' — ':'')+esc(f.name)+'…</div>'
      +'<div class="alert-b">Čitam sadržaj i primjenjujem knjigovodstvena pravila.</div></div></div>');
    try{
      const lines=await readAny(f);
      if(!lines.length) throw new Error('Datoteka ne sadrži čitljiv tekst.');
      if(isPBZ(lines)){
        const r=parsePBZ(lines);
        if(r && r.items.length){
          const chk=pbzCheck(r.items, r.meta);
          metas.push(Object.assign({file:f.name}, r.meta, {chk:chk}));
          r.items.forEach(it=>{ it.src=f.name; all.push(it); });
          continue;
        }
      }
      const mode=(document.getElementById('colMode')||{}).value||'auto';
      const res=parseStatement(lines,{colMode:mode, defYear:YEAR});
      res.items.forEach(it=>{ it.src=f.name; all.push(it); });
      if(!res.items.length) greske.push(f.name+' — nije prepoznata nijedna stavka');
    }catch(err){ greske.push(f.name+' — '+(err.message||String(err))); }
  }
  if(!all.length){
    return impStat('<div class="alert d"><div class="alert-i">'+IC.warn+'</div><div><div class="alert-t">Uvoz nije uspio</div>'
      +'<div class="alert-b">'+esc(greske.join(' · ')||'Nije pronađena nijedna transakcija.')
      +'<br><br>Rješenje: otvorite PDF, označite tablicu, kopirajte je i zalijepite u polje iznad.</div></div></div>');
  }
  all.forEach(it=>{ it.dup=isDuplicate(it); if(it.dup==='tocno') it.use=false; });
  matchOpen(all);
  all.sort((a,b)=>dnum(a.dt)-dnum(b.dt));
  IMP={items:all, cols:[], src: files.length>1 ? files.length+' izvadaka' : files[0].name,
       mode:'auto', filter:'all', method: metas.length?'pbz':'auto', metas:metas, greske:greske};
  openReview();
}

/** Čitanje datoteke bilo kojeg podržanog oblika → linije */
async function readAny(f){
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  if(ext==='pdf')                     return await pdfLines(await f.arrayBuffer());
  if(ext==='xls'||ext==='xlsx')       return await xlsxLines(await f.arrayBuffer());
  return csvLines(await f.text());
}

async function handleFile(f){
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  impStat('<div class="alert i"><div class="alert-i">'+IC.clock+'</div><div><div class="alert-t">Obrađujem '+esc(f.name)+'…</div>'
    +'<div class="alert-b">Čitam sadržaj i primjenjujem knjigovodstvena pravila.</div></div></div>');
  try{
    let lines;
    if(ext==='pdf'){        lines = await pdfLines(await f.arrayBuffer()); }
    else if(ext==='xls'||ext==='xlsx'){ lines = await xlsxLines(await f.arrayBuffer()); }
    else {                  lines = csvLines(await f.text()); }
    if(!lines.length) throw new Error('Datoteka ne sadrži čitljiv tekst. Ako je PDF skeniran, kopirajte tekst ručno ili zatražite izvod u CSV/Excel formatu.');
    runParse(lines, f.name);
  }catch(err){
    impStat('<div class="alert d"><div class="alert-i">'+IC.warn+'</div><div><div class="alert-t">Uvoz nije uspio</div>'
      +'<div class="alert-b">'+esc(err.message||String(err))+'<br><br>Rješenje: otvorite PDF, označite tablicu, kopirajte je i zalijepite u polje iznad.</div></div></div>');
  }
}

function runParse(lines, srcName){
  const mode=(document.getElementById('colMode')||{}).value||'auto';
  const res = parseStatement(lines, {colMode:mode, defYear:YEAR});
  if(!res.items.length){
    impStat('<div class="alert w"><div class="alert-i">'+IC.warn+'</div><div><div class="alert-t">Nije pronađena nijedna transakcija</div>'
      +'<div class="alert-b">Provjerena su '+lines.length+' reda. Aplikacija traži retke koji sadrže datum (dd.mm.gggg) i iznos (1.234,56). '
      +'Pokušajte promijeniti postavku „Stupci“ ili zalijepite samo tablicu transakcija bez zaglavlja.</div></div></div>');
    return;
  }
  res.items.forEach(it=>{ it.dup = isDuplicate(it); if(it.dup==='tocno') it.use=false; });
  matchOpen(res.items);
  IMP = {items:res.items, cols:res.cols, src:srcName, mode:mode, filter:'all', method:res.method};
  openReview();
}
