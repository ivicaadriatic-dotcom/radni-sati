function openReview(){
  const old=document.getElementById('revModal'); if(old) old.remove();
  const o=document.createElement('div');
  o.className='ovl'; o.id='revModal';
  o.innerHTML='<div class="modal wide"><div class="modal-h">'
    +'<div style="flex:1"><div class="modal-t">Pregled prije knjiženja</div>'
    +'<div class="card-sub" id="revSub"></div></div>'
    +'<button class="btn sm" onclick="closeReview()">'+IC.x+'</button></div>'
    +'<div style="padding:12px 21px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center;flex-wrap:wrap" class="no-print">'
    +'<div class="chips" id="revFilters"></div><div style="flex:1"></div>'
    +'<button class="btn sm" onclick="revAll(1)">Označi sve</button>'
    +'<button class="btn sm" onclick="revAll(0)">Odznači sve</button></div>'
    +'<div id="revCheck" style="padding:0 21px"></div>'
    +'<div class="modal-b" style="padding:0"><div class="tw" id="revTable"></div></div>'
    +'<div class="modal-f"><div id="revSum" style="flex:1;font-size:12px" class="mono"></div>'
    +'<button class="btn" onclick="closeReview()">Odustani</button>'
    +'<button class="btn gold" onclick="commitImport()">'+IC.save+' Proknjiži označeno</button></div></div>';
  document.body.appendChild(o);
  renderReview();
}
function closeReview(){ const m=document.getElementById('revModal'); if(m) m.remove(); IMP=null; }

function renderReview(){
  if(!IMP) return;
  const its=IMP.items;
  const nIn=its.filter(i=>i.dir==='in').length, nOut=its.filter(i=>i.dir==='out').length;
  const nDup=its.filter(i=>!!i.dup).length, nChk=its.filter(i=>i.flag==='chk'||i.conf==='niska').length;
  const nClose=its.filter(i=>!!i.match).length;
  const nPlace=its.filter(i=>i.pm!==undefined).length;
  const nFin=its.filter(i=>i.flag==='fin').length, nSplit=its.filter(i=>i.flag==='split').length;

  const METH={saldo:'smjer utvrđen iz promjene stanja računa',stupci:'smjer utvrđen iz rasporeda stupaca duguje / potražuje',
              predznak:'smjer utvrđen iz predznaka iznosa',rucno:'smjer prema ručno odabranoj postavci stupaca',
              pbz:'PBZ izvadak po transakcijskom računu — stupci Isplata / Uplata',
              zaglavlje:'smjer utvrđen iz zaglavlja tablice (Isplata / Uplata)'};
  document.getElementById('revSub').innerHTML =
    'Izvor: <strong>'+esc(IMP.src)+'</strong> · pronađeno '+its.length+' '+(its.length===1?'transakcija':its.length<5?'transakcije':'transakcija')
    + (METH[IMP.method]?' · '+METH[IMP.method]:'');

  /* kontrola protiv zbrojeva s izvatka */
  const box=document.getElementById('revCheck');
  if(box){
    const M=IMP.metas||[];
    if(!M.length) box.innerHTML='';
    else {
      const sviOk=M.every(m=>m.chk.ok);
      const rows=M.map(m=>{
        const c=m.chk;
        return '<tr><td class="l mono" style="font-size:11px">'+esc(m.broj?('br. '+m.broj):m.file)+'</td>'
          +'<td class="l" style="font-size:11px">'+esc(fmtDY(m.datum))+'</td>'
          +'<td class="mono">'+nf2(c.duguje)+'</td><td class="mono txt-mut">'+nf2(c.ocek_d)+'</td>'
          +'<td class="mono">'+nf2(c.potraz)+'</td><td class="mono txt-mut">'+nf2(c.ocek_u)+'</td>'
          +'<td class="mono txt-mut">'+nf2(m.prije)+'</td><td class="mono" style="font-weight:650">'+nf2(m.novo)+'</td>'
          +'<td>'+(c.ok?'<span class="bdg pos">slaže se</span>':'<span class="bdg neg">provjeri</span>')+'</td></tr>';
      }).join('');
      box.innerHTML='<div class="alert '+(sviOk?'g':'w')+'" style="margin:0 0 11px"><div class="alert-i">'
        +(sviOk?IC.chk:IC.warn)+'</div><div style="flex:1"><div class="alert-t">'
        +(sviOk?'Kontrolni zbrojevi se slažu s izvatkom':'Kontrolni zbrojevi ne odgovaraju — provjeri prije knjiženja')+'</div>'
        +'<div class="alert-b">Pročitani iznosi uspoređeni su s poljima „Ukupni dugovni promet na dan" i „Ukupni potražni promet na dan" iz zaglavlja izvatka.</div></div></div>'
        +'<div class="tw"><table><thead><tr><th class="l">Izvadak</th><th class="l">Datum</th>'
        +'<th>Duguje</th><th>s izvatka</th><th>Potražuje</th><th>s izvatka</th>'
        +'<th>Staro stanje</th><th>Novo stanje</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    }
  }

  const F=[['all','Sve',its.length],['in','Prihodi',nIn],['out','Rashodi',nOut],
           ['close','Zatvara račune',nClose],['place','Datum plaća',nPlace],
           ['chk','Za provjeru',nChk],['fin','Financiranje',nFin],['split','Plaće',nSplit],['dup','Duplikati',nDup]];
  document.getElementById('revFilters').innerHTML = F.filter(f=>f[2]>0||f[0]==='all')
    .map(f=>'<button class="chip'+(IMP.filter===f[0]?' on':'')+'" onclick="revFilter(\''+f[0]+'\')">'+f[1]+' <span class="c">'+f[2]+'</span></button>').join('');

  const vis = its.filter(i=>{
    if(IMP.filter==='all') return true;
    if(IMP.filter==='in') return i.dir==='in';
    if(IMP.filter==='out') return i.dir==='out';
    if(IMP.filter==='dup') return !!i.dup;
    if(IMP.filter==='close') return !!i.match;
    if(IMP.filter==='place') return i.pm!==undefined;
    if(IMP.filter==='chk') return i.flag==='chk'||i.conf==='niska';
    return i.flag===IMP.filter;
  });

  const opts = D.rows.map(r=>'<option value="'+r.k+'">'+esc(r.l)+'</option>').join('')
             + '<option value="__skip">— ne knjiži —</option>';
  const h=['<table><thead><tr>'
    +'<th style="width:34px"></th><th class="l" style="width:82px">Datum</th>'
    +'<th style="width:112px">Iznos</th><th style="width:74px">Smjer</th>'
    +'<th class="l" style="min-width:250px">Opis iz izvoda</th>'
    +'<th class="l" style="width:210px">Kategorija</th><th style="width:96px">Pouzdanost</th>'
    +'</tr></thead><tbody>'];
  vis.forEach(it=>{
    const badge = it.mode==='place' ? '<span class="bdg inf" title="Ne knjiži se — upisuje se samo datum isplate plaća">datum isplate plaća</span>'
      : it.mode==='close' ? '<span class="bdg pos" title="Ne otvara novi redak — upisuje datum plaćanja u postojeći račun">zatvara račun</span>'
      : it.dup==='tocno' ? '<span class="bdg wrn">već uneseno</span>'
      : it.dup==='mozda' ? '<span class="bdg wrn" title="Isti dan i isti iznos, ali drugačiji opis">isti dan i iznos</span>'
      : it.flag==='fin' ? '<span class="bdg inf">financiranje</span>'
      : it.flag==='split' ? '<span class="bdg wrn">plaće</span>'
      : it.conf==='nauceno' ? '<span class="bdg pos">naučeno</span>'
      : it.conf==='visoka' ? '<span class="bdg pos">visoka</span>'
      : it.conf==='srednja'? '<span class="bdg inf">srednja</span>'
      : '<span class="bdg neg">provjeri</span>';
    h.push('<tr'+(it.dup==='tocno'?' style="opacity:.62"':'')+'>'
      +'<td><input type="checkbox" style="width:15px;height:15px;accent-color:var(--nav-600)" '+(it.use?'checked':'')+' onchange="revUse(\''+it.id+'\',this.checked)"></td>'
      +'<td class="l mono" style="font-size:11px">'+esc(it.dts)+'</td>'
      +'<td class="mono" style="font-weight:600;color:'+(it.dir==='in'?'var(--pos)':'var(--tx)')+'">'+nf2(it.amt)+'</td>'
      +'<td><button class="chip'+(it.dir==='in'?' on':'')+'" style="padding:2px 8px;font-size:10px;'
        +(it.dir==='in'?'background:var(--pos);border-color:var(--pos)':'background:var(--neg-bg);border-color:transparent;color:var(--neg)')
        +'" onclick="revDir(\''+it.id+'\')">'+(it.dir==='in'?'prihod':'rashod')+'</button></td>'
      +'<td class="l" style="font-size:11.5px;max-width:340px" title="'+esc(it.raw)+'">'
        +'<div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(it.desc)+'</div>'
        +(it.match ? matchNote(it) : it.pm!==undefined ? placeNote(it) : '')+'</td>'
      +'<td class="l">'+(it.mode==='place'
        ? '<span class="txt-mut" style="font-size:11px">plaće — ne knjiži se</span>'
        : it.mode==='close'
        ? '<span class="txt-mut" style="font-size:11px">'+esc(catLbl(it.match.cat))+'</span>'
        : '<select onchange="revCat(\''+it.id+'\',this.value)" style="font-size:11px;padding:4px 6px">'
          +opts.replace('value="'+it.cat+'"','value="'+it.cat+'" selected')+'</select>')+'</td>'
      +'<td>'+badge+'</td></tr>');
  });
  h.push('</tbody></table>');
  document.getElementById('revTable').innerHTML=h.join('');

  const sel=its.filter(i=>i.use);
  const nov=sel.filter(i=>i.mode!=='close' && i.mode!=='place');
  const zat=sel.filter(i=>i.mode==='close');
  const pl =sel.filter(i=>i.mode==='place');
  const sIn=nov.filter(i=>i.dir==='in').reduce((s,i)=>s+i.amt,0);
  const sOut=nov.filter(i=>i.dir==='out').reduce((s,i)=>s+i.amt,0);
  document.getElementById('revSum').innerHTML=
    '<strong>'+nov.length+'</strong> novih redaka &nbsp;·&nbsp; prihodi <span class="txt-pos">'+nf2(sIn)+' EUR</span>'
    +' &nbsp;·&nbsp; rashodi <span class="txt-neg">'+nf2(sOut)+' EUR</span>'
    +' &nbsp;·&nbsp; neto '+(sIn-sOut>=0?'<span class="txt-pos">':'<span class="txt-neg">')+nf2(sIn-sOut)+' EUR</span>'
    +(zat.length?' &nbsp;·&nbsp; <span class="txt-pos">zatvara '+zat.length+' '+(zat.length===1?'račun':'računa')+'</span>':'')
    +(pl.length?' &nbsp;·&nbsp; <span style="color:var(--info)">plaće: samo datum isplate</span>':'');
}
/** Redak ispod opisa za isplatu plaća: za koji mjesec se upisuje datum */
function placeNote(it){
  const je=it.mode==='place';
  const sel='<select onchange="revPm(\''+it.id+'\',this.selectedIndex)" style="font-size:10px;padding:1px 4px">'
    + MN.map((m,i)=>'<option'+(i===it.pm?' selected':'')+'>'+esc(m)+'</option>').join('')+'</select>';
  return '<div style="font-size:10.5px;margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;'
    +(je?'color:var(--info)':'color:var(--mut)')+'">'
    +'<span>'+(je?'↳ upisuje datum isplate <strong>'+esc(it.dts.replace(/\s*\d{4}\.?$/,''))+'</strong> za plaće mjeseca'
                 :'↳ isplata plaća za mjesec')+'</span>'+sel
    +'<button class="chip" style="padding:1px 7px;font-size:9.5px" onclick="revMode(\''+it.id+'\')">'
    +(je?'radije knjiži kao trošak':'samo datum isplate')+'</button></div>';
}
function revPm(id, ix){
  const i=IMP.items.find(x=>x.id===id); if(!i) return;
  i.pm=ix; i.mode='place'; renderReview();
}
function catLbl(k){ const r=D.rows.find(x=>x.k===k); return r?r.l:k; }

/** Redak ispod opisa: koji otvoreni račun ova uplata zatvara i prekidač načina knjiženja */
function matchNote(it){
  const t=it.match.t, close=it.mode==='close';
  const opis=String(t.o||'').length>44 ? String(t.o).slice(0,44)+'…' : String(t.o||'');
  const cs=it.match.cands||[t];
  const izbor = cs.length>1
    ? '<select onchange="revPick(\''+it.id+'\',this.selectedIndex)" style="font-size:10px;padding:2px 4px;max-width:280px">'
      + cs.map((c,ix)=>'<option'+(c.t===t?' selected':'')+'>'+esc(String(c.t.o||'').slice(0,40))+' · '+esc(c.t.d||'')+'</option>').join('')
      +'</select>'
    : '„'+esc(opis)+'" ('+esc(t.d||'')+', '+nf2(Number(t.a)||0)+' EUR)';
  return '<div style="font-size:10.5px;margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;'
    +(close?'color:var(--pos)':'color:var(--mut)')+'">'
    +'<span>'+(close?'↳ upisuje <strong>'+esc(it.dts.replace(/\s*\d{4}\.?$/,''))+'</strong> u PLAĆENO računa'
                    :'↳ postoji otvoren račun')+'</span>'+izbor
    +(cs.length>1?'<span class="bdg wrn" style="font-size:9px" title="Više otvorenih računa istog partnera i iznosa — provjeri koji se zatvara">'+cs.length+' otvorena</span>':'')
    +(it.match.near?'<span class="bdg wrn" style="font-size:9px" title="Ručno je upisan drugi iznos — izvod je mjerodavan pa se iznos ispravlja">iznos '
        +nf2(Number(t.a)||0)+' → '+nf2(it.amt)+'</span>':'')
    +'<button class="chip" style="padding:1px 7px;font-size:9.5px" onclick="revMode(\''+it.id+'\')">'
    +(close?'radije novi redak':'zatvori taj račun')+'</button></div>';
}
/** Ručni odabir računa kad partner ima više otvorenih stavki istog iznosa */
function revPick(id, ix){
  const i=IMP.items.find(x=>x.id===id); if(!i||!i.match) return;
  const cs=i.match.cands||[]; const c=cs[ix]; if(!c) return;
  i.match=Object.assign({}, c, {cands:cs});
  i.mode='close';
  renderReview();
}
function revMode(id){
  const i=IMP.items.find(x=>x.id===id); if(!i) return;
  if(i.pm!==undefined && !i.match) i.mode = i.mode==='place' ? 'new' : 'place';
  else if(i.match)                 i.mode = i.mode==='close' ? 'new' : 'close';
  renderReview();
}
function revFilter(f){ IMP.filter=f; renderReview(); }
function revAll(v){ IMP.items.forEach(i=>{ if(!(v&&i.dup==='tocno')) i.use=!!v; }); renderReview(); }
function revUse(id,v){ const i=IMP.items.find(x=>x.id===id); if(i) i.use=v; renderReview(); }
function revDir(id){
  const i=IMP.items.find(x=>x.id===id); if(!i) return;
  i.dir = i.dir==='in'?'out':'in';
  const c=classify(i.desc,i.dir); i.cat=c.cat; i.flag=c.flag; i.conf=c.conf;
  /* promjena smjera mijenja i račun koji se može zatvoriti */
  const zauzeti=IMP.items.filter(x=>x!==i && x.match).map(x=>x.match.t);
  const m=findOpenMatch(i, zauzeti);
  i.match=m||null; i.mode=m?'close':'new';
  renderReview();
}
function revCat(id,c){
  const i=IMP.items.find(x=>x.id===id); if(!i) return;
  const changed = i.cat!==c;
  i.cat=c;
  if(changed && c!=='__skip'){ i.conf='nauceno'; i.flag=''; i.learn=true; }
  renderReview();
}

function commitImport(){
  if(!IMP) return;
  const sel=IMP.items.filter(i=>i.use && (i.mode==='close' ? !!i.match : i.mode==='place' ? true : i.cat!=='__skip'));
  if(!sel.length) return toast('Nema označenih stavki',1);
  let nIn=0,nOut=0,learned=0,zatvoreno=0;
  const place={};
  sel.forEach(it=>{
    /* Isplata plaća — bruto iznos je već u RDG-u, upisuje se samo datum isplate */
    if(it.mode==='place'){
      D.settings.placeDates=D.settings.placeDates||{};
      D.settings.placeDates[it.pm]=fmtDY(it.dt);
      place[it.pm]=fmtDY(it.dt);
      return;
    }
    /* uplata zatvara postojeći račun — samo datum plaćanja, bez novog retka */
    if(it.mode==='close' && it.match){
      it.match.t.p = fmtD(it.dt);
      if(!pd(it.match.t.v)) it.match.t.v = fmtD(it.dt);
      /* izvod je mjerodavan za iznos — ispravlja zatipak iz ručnog unosa */
      if(it.match.near) it.match.t.a = Math.round(it.amt*100)/100;
      zatvoreno++;
      return;
    }
    const mi=it.dt.m-1;
    if(mi<0||mi>11) return;
    if(!D.td[it.cat]) D.td[it.cat]=[[],[],[],[],[],[],[],[],[],[],[],[]];
    while(D.td[it.cat].length<12) D.td[it.cat].push([]);
    D.td[it.cat][mi].push({
      d: fmtD(it.dt), a: Math.round(it.amt*100)/100, o: it.desc,
      v: fmtD(it.dt), p: fmtD(it.dt), src:'izvod'
    });
    if(it.dir==='in') nIn+=it.amt; else nOut+=it.amt;
    if(it.learn){ if(learn(it.desc, it.cat, it.dir)) learned++; }
  });
  // sortiraj mjesece po datumu
  Object.keys(D.td).forEach(k=>D.td[k].forEach(m=>m.sort((a,b)=>{
    const A=pd(a.d),B=pd(b.d); return (A?A.d:99)-(B?B.d:99);
  })));
  D.imports.push({t:new Date().toLocaleString('hr-HR'), f:IMP.src, n:sel.length, in:nIn, out:nOut, z:zatvoreno});
  save(true);
  closeReview();
  const pk=Object.keys(place);
  toast('Proknjiženo '+(sel.length-zatvoreno-pk.length)+' stavki'
    +(zatvoreno?' · zatvoreno '+zatvoreno+' računa (upisan datum plaćanja)':'')
    +(pk.length?' · datum isplate plaća za '+pk.map(m=>MN[m]).join(', ')+': '+place[pk[0]]:'')
    +(learned?' · zapamćeno '+learned+' novih pravila':''));
  go('dash');

/* ═══════════════════════════════════════════════════════════════════════════
   GRAFOVI — čisti inline SVG, bez vanjskih biblioteka.
   Svaki graf ima hover tooltip s vrijednostima.
   ═══════════════════════════════════════════════════════════════════════════ */

function niceMax(v){
  if(v<=0) return 10;
  const e=Math.pow(10,Math.floor(Math.log10(v))), n=v/e;
  const s = n<=1?1 : n<=1.2?1.2 : n<=1.5?1.5 : n<=2?2 : n<=2.5?2.5 : n<=3?3 : n<=4?4 : n<=5?5 : n<=6?6 : n<=8?8 : 10;
  return s*e;
}
/** Zaokružena skala: cijele vrijednosti na svakoj crti, i za negativan raspon */
function scale(mx,mn,want){
  mx=Math.max(0,mx||0); mn=Math.min(0,mn||0);
  const rng=(mx-mn)||1;
  let step=niceMax(rng/(want||5));
  let top=Math.ceil(mx/step)*step, bot=Math.floor(mn/step)*step;
  if(top===bot) top=bot+step;
  let guard=0;
  while((top-bot)/step>10 && guard++<8) step*=2;
  top=Math.ceil(mx/step)*step; bot=Math.floor(mn/step)*step;
  if(top===bot) top=bot+step;
  const ticks=[]; for(let v=bot; v<=top+step*0.001; v+=step) ticks.push(Math.round(v*1e6)/1e6);
  return {top:top, bot:bot, rng:top-bot, ticks:ticks};
}

/** Stupac zaobljen samo na vanjskom kraju — kao na predlošku */
function roundedBar(x,y,w,h,up,color){
  const r=Math.min(w/2, h, 7);
  const X=x.toFixed(1), Y1=y.toFixed(1), W=w.toFixed(1), H=h.toFixed(1);
  if(h<=r*1.05) return '<rect class="bar" x="'+X+'" y="'+Y1+'" width="'+W+'" height="'+H+'" rx="'+Math.min(r,h/2).toFixed(1)+'" fill="'+color+'"/>';
  const d = up
    ? 'M'+x.toFixed(1)+','+(y+h).toFixed(1)+' L'+x.toFixed(1)+','+(y+r).toFixed(1)
      +' Q'+x.toFixed(1)+','+Y1+' '+(x+r).toFixed(1)+','+Y1
      +' L'+(x+w-r).toFixed(1)+','+Y1
      +' Q'+(x+w).toFixed(1)+','+Y1+' '+(x+w).toFixed(1)+','+(y+r).toFixed(1)
      +' L'+(x+w).toFixed(1)+','+(y+h).toFixed(1)+' Z'
    : 'M'+x.toFixed(1)+','+Y1+' L'+x.toFixed(1)+','+(y+h-r).toFixed(1)
      +' Q'+x.toFixed(1)+','+(y+h).toFixed(1)+' '+(x+r).toFixed(1)+','+(y+h).toFixed(1)
      +' L'+(x+w-r).toFixed(1)+','+(y+h).toFixed(1)
      +' Q'+(x+w).toFixed(1)+','+(y+h).toFixed(1)+' '+(x+w).toFixed(1)+','+(y+h-r).toFixed(1)
      +' L'+(x+w).toFixed(1)+','+Y1+' Z';
  return '<path class="bar" d="'+d+'" fill="'+color+'"/>';
}

function legendOf(series){

/**
 * Grupirani stupčasti graf s pozitivnim i negativnim vrijednostima.
 * @param o {labels:[], series:[{n,c,d}], h, id, unit}
 */
function barChart(o){
  const W=1000, H=o.h||260, PL=54, PR=14, PT=14, PB=26;
  const iw=W-PL-PR, ih=H-PT-PB;
  const N=o.labels.length, S=o.series.length;
  let mx=0, mn=0;
  o.series.forEach(s=>s.d.forEach(v=>{ v=Number(v)||0; if(v>mx)mx=v; if(v<mn)mn=v; }));
  const sc=scale(mx,mn,5), top=sc.top, bot=sc.bot, rng=sc.rng;
  const y0=PT+ih*(top/rng);
  const Y=v=>PT+ih*((top-(Number(v)||0))/rng);
  const gw=iw/N, bw=Math.min(gw*0.74/S, 30), off=(gw-bw*S)/2;

  const g=[];
  g.push('<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:'+H+'px">');
  // mreža
  sc.ticks.forEach(v=>{
    const y=Y(v);
    g.push('<line class="ax" x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'"'+(Math.abs(v)<1e-9?' stroke="var(--tx-3)" stroke-width="1.2"':'')+'/>');
    g.push('<text x="'+(PL-7)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end">'+nfk(v)+'</text>');
  });
  // stupci
  o.series.forEach((s,si)=>{
    s.d.forEach((v,i)=>{
      v=Number(v)||0; if(!v) return;
      const x=PL+gw*i+off+bw*si;
      const yt=v>=0?Y(v):y0, hh=Math.max(2,Math.abs(Y(v)-y0));
      /* s.cn = boja za negativne vrijednosti; bez nje stupac ima jednu boju */
      g.push(roundedBar(x, yt, bw, hh, v>=0, (v<0 && s.cn) ? s.cn : s.c));
    });
  });
  // oznake x
  o.labels.forEach((l,i)=>{
    g.push('<text x="'+(PL+gw*i+gw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(l)+'</text>');
  });
  // hover zone
  for(let i=0;i<N;i++){
    const tip='<div class="tt">'+esc(o.tlabels?o.tlabels[i]:o.labels[i])+'</div>'
      + o.series.map(s=>tipRow(((Number(s.d[i])||0)<0 && s.cn)?s.cn:s.c, s.n, nf2(s.d[i])+' '+(o.unit||'EUR'))).join('');
    g.push('<rect class="hit" x="'+(PL+gw*i).toFixed(1)+'" y="'+PT+'" width="'+gw.toFixed(1)+'" height="'+ih+'" data-tip="'+esc(tip).replace(/"/g,'&quot;')+'"/>');
  }
  g.push('</svg>');
  return g.join('') + (o.nolegend?'':'<div style="margin-top:12px;justify-content:center;display:flex">'+legendOf(o.series)+'</div>');
}

/** Linijski graf s površinom */
function lineChart(o){
  const W=1000,H=o.h||240,PL=54,PR=14,PT=14,PB=26;
  const iw=W-PL-PR, ih=H-PT-PB, N=o.labels.length;
  let mx=0,mn=0;
  o.series.forEach(s=>s.d.forEach(v=>{v=Number(v)||0; if(v>mx)mx=v; if(v<mn)mn=v;}));
  const sc=scale(mx,mn,4), top=sc.top, bot=sc.bot, rng=sc.rng;
  const X=i=>PL+(N<2?iw/2:iw*i/(N-1));
  const Y=v=>PT+ih*((top-(Number(v)||0))/rng);
  const g=['<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:'+H+'px">'];
  const defs=[];
  sc.ticks.forEach(v=>{
    const y=Y(v);
    g.push('<line class="ax" x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'"'+(Math.abs(v)<1e-9?' stroke="var(--tx-3)"':'')+'/>');
    g.push('<text x="'+(PL-7)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end">'+nfk(v)+'</text>');
  });
  o.series.forEach((s,si)=>{
    const gid='lg'+si+'_'+Math.random().toString(36).slice(2,6);
    defs.push('<linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0%" stop-color="'+s.c+'" stop-opacity=".26"/>'
      +'<stop offset="100%" stop-color="'+s.c+'" stop-opacity="0"/></linearGradient>');
    const pts=s.d.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1));
    if(s.fill!==false)
      g.push('<path d="M'+X(0).toFixed(1)+','+Y(bot<0?0:bot).toFixed(1)+' L'+pts.join(' L')+' L'+X(N-1).toFixed(1)+','+Y(bot<0?0:bot).toFixed(1)+' Z" fill="url(#'+gid+')"/>');
    g.push('<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+s.c+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"'+(s.dash?' stroke-dasharray="5 4"':'')+'/>');
    s.d.forEach((v,i)=>g.push('<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3" fill="var(--surf)" stroke="'+s.c+'" stroke-width="2"/>'));
  });
  g.splice(1,0,'<defs>'+defs.join('')+'</defs>');
  o.labels.forEach((l,i)=>g.push('<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(l)+'</text>'));
  const step=N<2?iw:iw/(N-1);
  for(let i=0;i<N;i++){
    const tip='<div class="tt">'+esc(o.tlabels?o.tlabels[i]:o.labels[i])+'</div>'
      + o.series.map(s=>tipRow(s.c,s.n,nf2(s.d[i])+' EUR')).join('');
    g.push('<rect class="hit" x="'+(X(i)-step/2).toFixed(1)+'" y="'+PT+'" width="'+step.toFixed(1)+'" height="'+ih+'" data-tip="'+esc(tip).replace(/"/g,'&quot;')+'"/>');
  }
  g.push('</svg>');
  return g.join('') + (o.nolegend?'':'<div style="margin-top:12px;justify-content:center;display:flex">'+legendOf(o.series)+'</div>');
}

/** Prstenasti graf strukture troškova — debeli luk, zaobljeni krajevi, razmaci */
function donut(items,size){
  const S=size||248, R=S/2, cx=R, cy=R;
  const tot=items.reduce((s,i)=>s+i.v,0);
  if(!tot) return '<div class="empty">'+IC.chart+'<div class="empty-t">Nema podataka</div></div>';
  const th=Math.round(S*0.145);          // debljina prstena
  const rad=R-th/2-2;                    // polumjer sredine linije
  const GAP=items.length>1?0.030:0;      // razmak između segmenata (rad)
  const C=2*Math.PI*rad;
  let a=-Math.PI/2;
  const g=['<svg class="chart" viewBox="0 0 '+S+' '+S+'" style="height:'+S+'px;width:'+S+'px;margin:0 auto;display:block;overflow:visible">'];
  items.forEach(it=>{
    const frac=it.v/tot;
    let sweep=frac*Math.PI*2-GAP;
    if(sweep<0.02) sweep=Math.max(0.02, frac*Math.PI*2*0.85);
    const len=sweep*rad;
    const tip='<div class="tt">'+esc(it.n)+'</div>'
      +tipRow(it.c,'Iznos',nf2(it.v)+' EUR')+tipRow('','Udjel',pc(frac*100)+' %');
    g.push('<circle class="seg" cx="'+cx+'" cy="'+cy+'" r="'+rad.toFixed(2)+'" fill="none"'
      +' stroke="'+it.c+'" stroke-width="'+th+'" stroke-linecap="round"'
      +' stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'"'
      +' transform="rotate('+((a+GAP/2)*180/Math.PI).toFixed(2)+' '+cx+' '+cy+')"'
      +' data-tip="'+esc(tip).replace(/"/g,'&quot;')+'"/>');
    a+=frac*Math.PI*2;
  });
  g.push('<text x="'+cx+'" y="'+(cy-5)+'" text-anchor="middle" style="font-size:10.5px;letter-spacing:1.1px;fill:var(--tx-3);font-weight:600">UKUPNO</text>');
  g.push('<text x="'+cx+'" y="'+(cy+17)+'" text-anchor="middle" style="font-size:19px;font-weight:750;fill:var(--tx);letter-spacing:-.5px">'+nfk(tot)+' €</text>');
  g.push('</svg>');
  const lg='<div class="dleg">'
    + items.map(it=>'<div class="dleg-r"><i style="background:'+it.c+'"></i>'
      +'<span class="n">'+esc(it.n)+'</span>'
      +'<span class="v">'+nf0(it.v)+' €</span>'
      +'<span class="p">'+pc(it.v/tot*100)+' %</span></div>').join('')
    +'</div>';
  return g.join('')+lg;
}

function hbar(items,unit){

/* ── Linearna regresija za projekciju ─────────────────────────────────────── */
function linReg(pts){
  const n=pts.length; if(n<2) return {a:0,b:pts.length?pts[0].y:0};
  let sx=0,sy=0,sxy=0,sxx=0;
  pts.forEach(p=>{sx+=p.x;sy+=p.y;sxy+=p.x*p.y;sxx+=p.x*p.x;});
  const d=n*sxx-sx*sx;
  if(!d) return {a:0,b:sy/n};
  const a=(n*sxy-sx*sy)/d;
  return {a:a, b:(sy-a*sx)/n};
}
function forecast(k){
  const c=calc(), act=activeM(c);
  if(act.length<2) return [];
  const mk=arr=>linReg(act.map(i=>({x:i,y:arr[i]})));
  const rp=mk(c.prihodi), rr=mk(c.rashodi);
  const last=act[act.length-1], out=[];
  for(let j=1;j<=(k||3);j++){
    const i=last+j; if(i>11) break;
    const p=Math.max(0,rp.a*i+rp.b), r=Math.max(0,rr.a*i+rr.b);
    out.push({i:i, m:MN[i], prihodi:p, rashodi:r, dobit:p-r});
  }
  return out;
}

function viewDash(EXP){
  const c=calc(), act=activeM(c);
  const tp=sum(c.prihodi), tr=sum(c.rashodi), td=tp-tr;
  const tp5=sum(D.p25.prihodi), tr5=sum(D.p25.rashodi), td5=tp5-tr5;
  const marza = tp? td/tp*100 : 0;
  const marza5= tp5? td5/tp5*100 : 0;
  const dl=(a,b)=> b? (a-b)/Math.abs(b)*100 : (a?100:0);
  const pill=(v,inv)=>{ const good = inv? v<0 : v>0;
    if(!isFinite(v)||Math.abs(v)<0.05) return '<span class="pill nt">0,0%</span>';
    return '<span class="pill '+(good?'up':'dn')+'">'+(v>0?'▲':'▼')+' '+pc(Math.abs(v))+'%</span>'; };

  const h=[];
  /* KPI */
  h.push('<div class="grid g4" style="margin-bottom:16px">');
  h.push(kpi('Ukupni prihodi', tp, 'var(--pos)', 'vs '+(YEAR-1)+': '+nf0(tp5)+' EUR '+pill(dl(tp,tp5))));
  h.push(kpi('Ukupni rashodi', tr, 'var(--neg)', 'vs '+(YEAR-1)+': '+nf0(tr5)+' EUR '+pill(dl(tr,tr5),true)));
  h.push(kpi('Dobit / gubitak', td, td>=0?'var(--pos)':'var(--neg)', 'vs '+(YEAR-1)+': '+nf0(td5)+' EUR '+pill(dl(td,td5))));
  h.push(kpi('Neto marža', marza, marza>=0?'var(--c1)':'var(--neg)', 'vs '+(YEAR-1)+': '+pc(marza5)+' % '+pill(marza-marza5), '%'));
  h.push('</div>');

  /* automatski uklonjene isplate plaća iz ranijih uvoza */
  if(PLPURGE && PLPURGE.n) h.push('<div class="alert g" style="margin-bottom:16px"><div class="alert-i">'+IC.chk+'</div><div style="flex:1">'
    +'<div class="alert-t">Uklonjeno '+PLPURGE.n+' stavaka plaća ('+nf2(PLPURGE.a)+' EUR) iz troškova</div>'
    +'<div class="alert-b">Plaće, prehrana, prijevoz, nagrade i naknade unose se ručno u rubrici <strong>Djelatnici</strong>, '
    +'pa ih uvoz izvoda ne knjiži kao trošak. Stavke koje je raniji uvoz ubacio u RAZNO, BANKU i ostale kategorije sada su izbrisane, '
    +'a bruto plaće u Računu D i G ostaju onakve kakve si ih unio.</div></div>'
    +'<button class="btn sm" onclick="go(\'emp\')">Otvori Djelatnike</button></div>');

  /* stavke nastale uvozom izvoda koje odstupaju od ručnog unosa */
  try{
    const au=importAudit();
    const nS=au.filter(x=>x.kind==='spoji').length, nD=au.filter(x=>x.kind==='duplikat').length;
    const pl=au.filter(x=>x.kind==='place');
    const nP=pl.length, izP=pl.reduce((s,x)=>s+(Number(x.row.t.a)||0),0);
    if(nS||nD||nP) h.push('<div class="alert d" style="margin-bottom:16px"><div class="alert-i">'+IC.warn+'</div><div style="flex:1">'
      +'<div class="alert-t">Uvezene stavke treba srediti — prihod i rashod su uvećani</div><div class="alert-b">'
      +(nS?'<strong>'+nS+'</strong> uplata pripada računu koji je već u knjizi i još je bez datuma plaćanja. ':'')
      +(nD?'<strong>'+nD+'</strong> stavki uvoz je ponovio, a već su ručno unesene. ':'')
      +(nP?'<strong>'+nP+'</strong> stavaka plaća i naknada ('+nf2(izP)+' EUR) knjiženo je kao trošak, a plaće se unose ručno u rubrici Djelatnici.':'')
      +'</div></div><button class="btn sm" onclick="go(\'import\')">Otvori provjeru</button></div>');
  }catch(e){}

  /* dospijeća danas */
  const du=getDues();
  if(du.over.length||du.today.length){
    const so=du.over.reduce((s,d)=>s+d.a,0), st=du.today.reduce((s,d)=>s+d.a,0);
    h.push('<div class="alert '+(du.over.length?'d':'w')+'" style="margin-bottom:16px"><div class="alert-i">'+IC.clock+'</div><div style="flex:1">'
      +'<div class="alert-t">Dospijeća na dan '+fmtDY(todayO())+'</div><div class="alert-b">'
      +(du.today.length?'<strong>'+du.today.length+'</strong> stavki dospijeva danas ('+nf2(st)+' EUR). ':'')
      +(du.over.length?'<strong>'+du.over.length+'</strong> stavki je u kašnjenju ('+nf2(so)+' EUR).':'')
      +'</div></div><button class="btn sm" onclick="go(\'dues\')">Otvori</button></div>');
  }

  /* glavni graf */
  const S1=[{n:'Prihodi '+YEAR, c:'var(--c3)', d:c.prihodi},
            {n:'Rashodi '+YEAR, c:'var(--c7)', d:c.rashodi},
            {n:'Prihodi '+(YEAR-1),  c:'var(--c9)', d:D.p25.prihodi},
            {n:'Rashodi '+(YEAR-1),  c:'var(--c5)', d:D.p25.rashodi}];
  h.push('<div class="card" style="margin-bottom:16px"><div class="card-b">'
    + chartHead('Prihodi i rashodi po mjesecima', YEAR+' u usporedbi s '+(YEAR-1)+'.', S1)
    + barChart({labels:MR, tlabels:MN, h:300, series:S1, nolegend:true})
    +'</div></div>');

  /* dobit + kumulativ */
  h.push('<div class="grid g2" style="margin-bottom:16px">');
  /* Boja prati predznak: dobit zeleno, gubitak crveno; prethodna godina u svjetlijoj nijansi */
  const S2=[{n:'Dobit '+YEAR,     c:'var(--pos)',    cn:'var(--neg)',    d:c.dobit},
            {n:'Dobit '+(YEAR-1), c:'var(--pos-lt)', cn:'var(--neg-lt)', d:D.p25.dobit}];
  h.push('<div class="card"><div class="card-b">'
    + chartHead('Dobit / gubitak po mjesecima','Zeleno je dobit, crveno gubitak — svjetlije je '+(YEAR-1)+'.', S2)
    + barChart({labels:MR, tlabels:MN, h:222, series:S2, nolegend:true})+'</div></div>');
  const S3=[{n:'Kumulativna dobit '+YEAR, c:'var(--c8)', d:c.kum}];
  h.push('<div class="card"><div class="card-b">'
    + chartHead('Kumulativni rezultat','Zbroj od početka godine · '+nf2(c.kum[act.length?act[act.length-1]:0])+' €', S3)
    + lineChart({labels:MR, tlabels:MN, h:222, series:S3, nolegend:true})+'</div></div>');
  h.push('</div>');

  /* struktura + top troškovi */
  const items=D.rows.filter(r=>r.s!=='prihod').map(r=>({n:r.l, v:sum(MR.map((_,m)=>val(r.k,m)))}))
                    .filter(x=>x.v>0).sort((a,b)=>b.v-a.v)
                    .map((x,i)=>Object.assign(x,{c:'var(--c'+((i%10)+1)+')'}));
  h.push('<div class="grid g2">');
  h.push('<div class="card"><div class="card-b">'
    + chartHead('Struktura troškova '+YEAR,'Udjel svake kategorije u ukupnim rashodima')
    + donut(items.slice(0,8).concat(items.length>8?[{n:'Ostalo',v:items.slice(8).reduce((s,i)=>s+i.v,0),c:'var(--tx-3)'}]:[]))
    +'</div></div>');
  h.push('<div class="card"><div class="card-b">'
    + chartHead('Najveći troškovi','Deset najvećih stavki u '+YEAR+'.')
    +'<div style="margin-top:14px">'+hbar(items.slice(0,10))+'</div></div></div>');
  h.push('</div>');

  /* unos 2025 */
  h.push('<div class="card" style="margin-top:16px"><div class="card-h"><div style="flex:1"><div class="card-t">Podaci za 2025. — usporedna godina</div>'
    +'<div class="card-sub">Dobit se računa automatski. Vrijednosti se spremaju odmah.</div></div>'
    +'<button class="btn sm dgr" onclick="clear25()">'+IC.trash+' Očisti</button></div><div class="card-b"><div class="tw">'
    +'<table><thead><tr><th class="l sticky-l" style="min-width:118px">'+(YEAR-1)+'.</th>'
    +MR.map((m,i)=>'<th style="min-width:104px" title="'+MN[i]+'">'+m+'</th>').join('')+'<th style="min-width:110px">UKUPNO</th></tr></thead><tbody>');
  [['prihodi','Prihodi','var(--pos)'],['rashodi','Rashodi','var(--neg)']].forEach(r=>{
    h.push('<tr><td class="l sticky-l" style="font-weight:600;color:'+r[2]+'">'+r[1]+'</td>'
      + MR.map((_,i)=>'<td><input class="cell-inp p25" data-c="'+r[0]+'" data-i="'+i+'" value="'+(D.p25[r[0]][i]?nf2(D.p25[r[0]][i]):'')+'" placeholder="—"></td>').join('')
      +'<td class="mono" style="font-weight:600">'+nf0(sum(D.p25[r[0]]))+'</td></tr>');
  });
  h.push('<tr class="row-tot"><td class="l sticky-l">Dobit '+(YEAR-1)+'</td>'
    + MR.map((_,i)=>'<td class="mono '+(D.p25.dobit[i]>=0?'txt-pos':'txt-neg')+'">'+(D.p25.dobit[i]?nf0(D.p25.dobit[i]):'—')+'</td>').join('')
    +'<td class="mono '+(td5>=0?'txt-pos':'txt-neg')+'" style="font-weight:700">'+nf0(td5)+'</td></tr>');
  h.push('</tbody></table></div></div></div>');

  setView(h.join(''),'Nadzorna ploča', EXP);
  document.querySelectorAll('.p25').forEach(inp=>{
    inp.addEventListener('focus',function(){ const v=pn(this.value); this.value=v?String(v).replace('.',','):''; this.select(); });
    inp.addEventListener('blur',function(){
      const v=pn(this.value), c=this.dataset.c, i=+this.dataset.i;
      D.p25[c][i]=v; D.p25.dobit[i]=(D.p25.prihodi[i]||0)-(D.p25.rashodi[i]||0);
      save(); reRender();
    });
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') this.blur(); });
  });
}
function kpi(label,v,col,sub,unit){
  const body = v==null ? '<span style="color:var(--tx-3)">—</span>'
    : unit==='br' ? nf0(v)                                  /* obični broj, bez valute */
    : unit==='%' ? pc(v)+' <span class="eur">%</span>'
    : unit && unit!=='EUR' ? nf2(v)+' <span class="eur">'+esc(unit)+'</span>'
    : nf2(v)+' <span class="eur">EUR</span>';
  return '<div class="kpi" style="--kc:'+col+'"><div class="kpi-l">'+esc(label)+'</div>'
    +'<div class="kpi-v" style="color:'+(v==null?'var(--tx-3)':col)+'">'+body+'</div>'
    +'<div class="kpi-c">'+sub+'</div></div>';
}

function viewRDG(EXP){
  const c=calc();
  const h=['<div class="card"><div class="card-h"><div style="flex:1"><div class="card-t">Račun dobiti i gubitka '+YEAR+'</div>'
    +'<div class="card-sub">Ćelije s oznakom <span class="bdg inf">T</span> zbroj su pojedinačnih transakcija — mijenjaju se u odjeljku Transakcije. Ostale možete upisati izravno.</div></div>'
    +'<button class="btn sm" onclick="addRowDlg()">'+IC.plus+' Nova stavka</button></div><div class="card-b" style="padding:0">'
    +'<div class="tw" style="max-height:calc(100vh - 230px)"><table><thead><tr>'
    +'<th class="l sticky-l" style="min-width:262px">Stavka</th>'
    + MR.map((m,i)=>'<th style="min-width:104px" title="'+MN[i]+'">'+m+'</th>').join('')
    +'<th style="min-width:150px">UKUPNO</th><th style="width:38px" class="no-print"></th></tr></thead><tbody>'];

  ['prihod','place','fiksni','ostali'].forEach(sec=>{
    const rows=D.rows.filter(r=>r.s===sec);
    if(!rows.length) return;
    h.push('<tr class="row-sec"><td class="l sticky-l" style="color:'+SEC[sec].c+'">'+SEC[sec].l+'</td><td colspan="14"></td></tr>');
    rows.forEach(r=>{
      const vals=MR.map((_,i)=>val(r.k,i));
      h.push('<tr><td class="l sticky-l"><div style="display:flex;align-items:center;gap:7px">'
        +'<i style="width:3px;height:15px;border-radius:2px;background:'+(CATCOL[r.k]||'var(--tx-3)')+';flex:0 0 3px"></i>'
        +'<span style="font-weight:550;cursor:pointer" onclick="go(\'cat\');CAT=\''+r.k+'\';render()" title="Otvori transakcije">'+esc(r.l)+'</span></div></td>'
        + MR.map((_,i)=>{
            const t=fromTx(r.k,i);
            if(t) return '<td class="mono" style="color:'+(sec==='prihod'?'var(--pos)':'var(--tx)')+';font-weight:550" title="Zbroj '+((D.td[r.k][i]||[]).length)+' transakcija">'
              + (vals[i]?nf2(vals[i]):'—')+' <span class="bdg inf" style="font-size:8px;padding:0 3px;vertical-align:1px">T</span></td>';
            return '<td><input class="cell-inp pv" data-k="'+r.k+'" data-i="'+i+'" value="'+(vals[i]?nf2(vals[i]):'')+'" placeholder="—"></td>';
          }).join('')
        +'<td class="mono" style="font-weight:650;color:'+(sec==='prihod'?'var(--pos)':'var(--neg)')+'">'
          +nf2(sum(vals))+' <span class="eur">EUR</span></td>'
        +'<td class="no-print">'+(r.s==='prihod'&&r.k==='prihodi_grupe'?'':'<button class="btn sm dgr" onclick="delRow(\''+r.k+'\')" title="Obriši stavku">'+IC.x+'</button>')+'</td></tr>');
    });
    const st=MR.map((_,i)=>rows.reduce((s,r)=>s+val(r.k,i),0));
    const secCol = sec==='prihod' ? 'var(--pos)' : 'var(--neg)';
    h.push('<tr class="row-tot"><td class="l sticky-l">Ukupno '+SEC[sec].l.toLowerCase()+'</td>'
      + st.map(v=>'<td class="mono">'+(v?nf2(v):'—')+'</td>').join('')
      +'<td class="mono" style="color:'+secCol+'">'+nf2(sum(st))+' <span class="eur">EUR</span></td>'
      +'<td class="no-print"></td></tr>');
  });

  h.push('<tr class="row-tot"><td class="l sticky-l" style="color:var(--neg)">UKUPNI RASHODI</td>'
    + c.rashodi.map(v=>'<td class="mono txt-neg">'+(v?nf2(v):'—')+'</td>').join('')
    +'<td class="mono txt-neg">'+nf2(sum(c.rashodi))+' <span class="eur">EUR</span></td>'
    +'<td class="no-print"></td></tr>');
  const finC=v=>v>=0?'#4ade80':'#fb7185';
  const td=sum(c.dobit);
  h.push('<tr class="row-fin"><td class="l sticky-l">DOBIT / GUBITAK</td>'
    + c.dobit.map(v=>'<td class="mono"><span style="color:'+finC(v)+'">'+(v?nf2(v):'—')+'</span></td>').join('')
    +'<td class="mono"><span style="color:'+finC(td)+';font-weight:700">'+nf2(td)
      +' <span class="eur" style="color:rgba(255,255,255,.55)">EUR</span></span></td>'
    +'<td class="no-print"></td></tr>');
  /* povrat pozajmica i rezultat bez njega — informativno, ništa se ne premješta */
  if(sum(c.fin)){
    h.push('<tr><td class="l sticky-l txt-mut" style="font-size:11px;font-style:italic">od toga povrat pozajmica</td>'
      + c.fin.map(v=>'<td class="mono txt-mut" style="font-size:11px">'+(v?nf2(v):'—')+'</td>').join('')
      +'<td class="mono txt-mut" style="font-size:11px">'+nf2(sum(c.fin))+' <span class="eur">EUR</span></td>'
      +'<td class="no-print"></td></tr>');
    const tdf=sum(c.dobitFin);
    h.push('<tr class="row-fin"><td class="l sticky-l">DOBIT PRIJE FINANCIRANJA</td>'
      + c.dobitFin.map(v=>'<td class="mono"><span style="color:'+finC(v)+'">'+(v?nf2(v):'—')+'</span></td>').join('')
      +'<td class="mono"><span style="color:'+finC(tdf)+';font-weight:700">'+nf2(tdf)
        +' <span class="eur" style="color:rgba(255,255,255,.55)">EUR</span></span></td>'
      +'<td class="no-print"></td></tr>');
  }
  const act2=activeM(c), lastA=act2.length?act2[act2.length-1]:-1;
  h.push('<tr class="row-tot"><td class="l sticky-l">Kumulativno</td>'
    + c.kum.map((v,i)=>'<td class="mono '+(v>=0?'txt-pos':'txt-neg')+'">'+(act2.indexOf(i)>-1?nf2(v):'—')+'</td>').join('')
    +'<td class="mono '+(lastA>=0&&c.kum[lastA]>=0?'txt-pos':'txt-neg')+'">'
      +(lastA>=0?nf2(c.kum[lastA])+' <span class="eur">EUR</span>':'—')+'</td>'
    +'<td class="no-print"></td></tr>');
  h.push('</tbody></table></div></div></div>');

  setView(h.join(''),'Račun dobiti i gubitka', EXP);
  document.querySelectorAll('.pv').forEach(inp=>{
    inp.addEventListener('focus',function(){ const v=pn(this.value); this.value=v?String(v).replace('.',','):''; this.select(); });
    inp.addEventListener('blur',function(){
      D.p[this.dataset.k][+this.dataset.i]=pn(this.value); save(); reRender();
    });
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault();this.blur();} });
  });
}

      +'<td><input class="cell-inp tx"'+dm+' data-f="v" value="'+esc(t.v)+'" placeholder="dd.mm."></td>'
      +'<td><input class="cell-inp tx"'+dm+' data-f="p" value="'+esc(t.p)+'" placeholder="dd.mm." style="'+(unp?'color:var(--neg);font-weight:650':'color:var(--pos)')+'"></td>'
      +'<td class="no-print"><button class="btn sm dgr" onclick="delTx('+r.i+','+r.m+')">'+IC.x+'</button></td></tr>');
  });
  h.push('</tbody><tfoot><tr class="row-tot">'+(god?'<td></td>':'')+'<td class="l">UKUPNO</td>'
    +'<td class="mono" style="color:'+col+';font-weight:700">'+nf2(tot)+' <span class="eur">EUR</span></td>'
    +'<td colspan="4"></td></tr></tfoot></table></div></div>');

  setView(h.join(''),'Transakcije', catPer()+stdExport());
  const q=document.getElementById('catQ');
  q.addEventListener('input',function(){ CATQ=this.value; const p=this.selectionStart; render(); const n=document.getElementById('catQ'); n.focus(); n.setSelectionRange(p,p); });
  document.querySelectorAll('.tx').forEach(inp=>{
    if(inp.dataset.f==='a'){
      inp.addEventListener('focus',function(){ const v=pn(this.value); this.value=v?String(v).replace('.',','):''; this.select(); });
    }
    inp.addEventListener('blur',function(){
      const i=+this.dataset.i, f=this.dataset.f, arr=D.td[CAT][+this.dataset.m];
      if(!arr||!arr[i]) return;
      if(f==='a') arr[i].a=pn(this.value);
      else if(f==='d'||f==='v'||f==='p'){
        let v=this.value.trim();
        if(v && !/[.\/]/.test(v)){ if(v.length<=2) v=v+'.'; else if(v.length===4) v=v.slice(0,2)+'.'+v.slice(2)+'.'; }
        arr[i][f]=v;
      } else arr[i][f]=this.value;
      save(); reRender();
    });
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault();this.blur();} });
  });
}

/* ═══════════════════ DOSPIJEĆA ══════════════════════════════════════════ */
function getDues(){
  const T=todayO(), tn=dnum(T);
  const over=[], today=[], soon=[], later=[];
  const win=(D.settings.notifDays||3);
  D.rows.forEach(r=>{
    (D.td[r.k]||[]).forEach((mo,mi)=>{
      (mo||[]).forEach(t=>{
        const a=Number(t.a)||0; if(!a) return;
        if(t.p && t.p.trim()) return;                 // već plaćeno
        const vd = pd(t.v) || pd(t.d); if(!vd) return;
        if(!vd.y || vd.y<2000) vd.y=YEAR;
        const n=dnum(vd), days=Math.round((new Date(vd.y,vd.m-1,vd.d)-new Date(T.y,T.m-1,T.d))/864e5);
        const rec={k:r.k, lbl:r.l, m:mi, o:t.o, a:a, v:fmtDY(vd), days:days, inb:r.s==='prihod'};
        if(n<tn) over.push(rec);
        else if(n===tn) today.push(rec);
        else if(days<=win) soon.push(rec);
        else later.push(rec);
      });
    });
  });
  const s=(a,b)=>a.days-b.days;
  return {over:over.sort(s), today:today.sort(s), soon:soon.sort(s), later:later.sort(s)};
}

    +'</div></div>');
  h.push('</div>');

  setView(h.join(''),'CEO panel', EXP);

/* ═══════════════════ UPOZORENJA ═════════════════════════════════════════ */
function buildAlerts(){
  const c=calc(), act=activeM(c), n=act.length, A=[];
  const add=(t,ti,b,m)=>A.push({t:t,ti:ti,b:b,m:m||''});

  /* redci nastali uvozom izvoda koji se preklapaju s ručno unesenim stavkama */
  try{
    const au=importAudit();
    const nS=au.filter(a=>a.kind==='spoji').length, nD=au.filter(a=>a.kind==='duplikat').length;
    if(nS||nD) add('d','Uvezene stavke treba srediti — prihod i rashod su uvećani',
      (nS?nS+' uplata pripada računu koji je već u knjizi i još je bez datuma plaćanja. ':'')
      +(nD?nD+' stavki uvoz je ponovio, a već su ručno unesene. ':'')
      +'Otvorite Uvoz izvoda → Provjera uvezenih stavaka i upotrijebite „Spoji" odnosno „Obriši redak".',
      au.filter(a=>a.kind!=='ok').map(a=>String(a.row.t.o||'').slice(0,30)).join(' · '));
  }catch(e){}

  if(n>=2){
    const p=act[n-2], q=act[n-1];
    const dr=c.rashodi[p]?(c.rashodi[q]-c.rashodi[p])/c.rashodi[p]*100:0;
    if(dr>10) add('d','Rashodi porasli '+pc(dr)+' % u odnosu na prethodni mjesec',
      'Rashodi su s '+nf2(c.rashodi[p])+' EUR porasli na '+nf2(c.rashodi[q])+' EUR. Pregledajte najveće stavke.', MN[q]);
    else if(dr<-10) add('g','Rashodi smanjeni '+pc(Math.abs(dr))+' %',
      'Rashodi su smanjeni s '+nf2(c.rashodi[p])+' na '+nf2(c.rashodi[q])+' EUR.', MN[q]);
    const dp=c.prihodi[p]?(c.prihodi[q]-c.prihodi[p])/c.prihodi[p]*100:0;
    if(dp>15) add('g','Prihodi porasli '+pc(dp)+' %',
      'Prihodi su s '+nf2(c.prihodi[p])+' EUR porasli na '+nf2(c.prihodi[q])+' EUR.', MN[q]);
    else if(dp<-20) add('w','Prihodi pali '+pc(Math.abs(dp))+' %',
      'Prihodi su pali s '+nf2(c.prihodi[p])+' na '+nf2(c.prihodi[q])+' EUR. Provjerite naplatu i aktivne ugovore.', MN[q]);
  }
  act.forEach(i=>{
    if(c.dobit[i]<-1000) add('d','Negativan rezultat — '+MN[i],
      'Gubitak '+nf2(Math.abs(c.dobit[i]))+' EUR. Prihodi '+nf2(c.prihodi[i])+' EUR, rashodi '+nf2(c.rashodi[i])+' EUR.', MN[i]);
    const mkt=val('domena_ads',i)+val('marketing',i);
    if(c.prihodi[i]>0 && mkt/c.prihodi[i]>0.20) add('w','Marketing i alati iznad 20 % prihoda — '+MN[i],
      nf2(mkt)+' EUR = '+pc((mkt/c.prihodi[i]*100))+' % prihoda ('+nf2(c.prihodi[i])+' EUR).', MN[i]);
    const pl=D.rows.filter(r=>r.s==='place').reduce((s,r)=>s+val(r.k,i),0);
    if(c.rashodi[i]>0 && pl/c.rashodi[i]>0.60) add('w','Plaće iznad 60 % rashoda — '+MN[i],
      'Plaće čine '+pc((pl/c.rashodi[i]*100))+' % ukupnih rashoda ('+nf2(pl)+' od '+nf2(c.rashodi[i])+' EUR). Referentna vrijednost je ispod 55 %.', MN[i]);
    const le=val('leasing_ekrani',i)+val('najam_auta',i)+val('najam_ureda',i);
    if(c.rashodi[i]>0 && le/c.rashodi[i]>0.25) add('w','Leasing i najmovi iznad 25 % rashoda — '+MN[i],
      nf2(le)+' EUR = '+pc((le/c.rashodi[i]*100))+' % rashoda.', MN[i]);
  });
  const td=sum(c.dobit), burn=n?act.reduce((s,i)=>s+c.rashodi[i],0)/n:0;
  if(burn>0){
    const rw=td/burn;
    if(rw>0&&rw<3) add('d','Runway '+pc(rw)+' mjeseci',
      'Pri prosječnom mjesečnom rashodu od '+nf2(burn)+' EUR akumulirani rezultat pokriva manje od tri mjeseca poslovanja.','Trend');
    else if(rw>0&&rw<6) add('w','Runway '+pc(rw)+' mjeseci',
      'Preporučeni minimum je šest mjeseci. Trenutni mjesečni rashod: '+nf2(burn)+' EUR.','Trend');
  }
  const neg=forecast(3).filter(f=>f.dobit<0);
  if(neg.length) add('w','Projekcija predviđa negativan rezultat',
    'Linearna projekcija pokazuje gubitak u: '+neg.map(f=>f.m).join(', ')+'.','Projekcija');

  const du=getDues();
  if(du.over.length){
    const so=du.over.filter(d=>!d.inb).reduce((s,d)=>s+d.a,0);
    const pr=du.over.filter(d=>d.inb).reduce((s,d)=>s+d.a,0);
    if(so>0) add('d','Dospjele nepodmirene obveze: '+nf2(so)+' EUR',
      du.over.filter(d=>!d.inb).length+' stavki kojima je valuta plaćanja prošla.','Dospijeća');
    if(pr>0) add('w','Nenaplaćena potraživanja: '+nf2(pr)+' EUR',
      du.over.filter(d=>d.inb).length+' izdanih računa kojima je valuta plaćanja prošla.','Dospijeća');
  }
  const ord={d:0,w:1,g:2,i:3};
  return A.sort((a,b)=>ord[a.t]-ord[b.t]);
}

  const A=buildAlerts();

function duesText(){
  const du=getDues(), L=[];
  L.push('DOSPIJEĆA — '+fmtDY(todayO()));
  const sec=(t,a)=>{ if(!a.length) return;
    L.push(''); L.push(t.toUpperCase()+' ('+a.length+' · '+nf2(a.reduce((s,d)=>s+d.a,0))+' EUR)');
    a.forEach(d=>L.push('  '+d.v+'  '+nf2(d.a).padStart(12)+' EUR  '+(d.inb?'[naplata] ':'[plaćanje] ')+(d.o||'').slice(0,52)));
  };
  sec('U kašnjenju',du.over); sec('Danas',du.today); sec('Sljedećih '+(D.settings.notifDays||3)+' dana',du.soon);
  if(!du.over.length&&!du.today.length&&!du.soon.length) L.push('\nNema dospjelih ni nadolazećih stavki.');
  return L.join('\n');

function copyDues(){
  const t=duesText();

function askNotif(){

  Notification.requestPermission().then(p=>{ render(); if(p==='granted') toast('Obavijesti uključene'); });
}
function notifBody(){
  const du=getDues();
  const so=du.over.reduce((s,d)=>s+d.a,0), st=du.today.reduce((s,d)=>s+d.a,0), ss=du.soon.reduce((s,d)=>s+d.a,0);
  const L=[];
  if(du.today.length) L.push('Danas: '+du.today.length+' stavki · '+nf2(st)+' EUR');
  if(du.over.length)  L.push('U kašnjenju: '+du.over.length+' stavki · '+nf2(so)+' EUR');
  if(du.soon.length)  L.push('Sljedećih '+(D.settings.notifDays||3)+' dana: '+du.soon.length+' · '+nf2(ss)+' EUR');
  return L.length?L.join('\n'):'Nema dospjelih obveza.';
}
function testNotif(){ fireNotif(true); }
function fireNotif(force){
  const S=D.settings;
  if(!force){
    if(!S.notif) return;
    if(S.lastNotif===isoToday()) return;
    if(new Date().getHours() < (S.notifH||8)) return;

    try{ new Notification('Dospijeća — '+fmtDY(todayO()), {body:body, tag:'dys-rdg-dues', requireInteraction:false}); }catch(e){}

}

/* ═══════════════════════════════════════════════════════════════════════════
   IZVOZI — CSV · Excel · PDF
   ═══════════════════════════════════════════════════════════════════════════ */
const BOM='﻿';
const csvCell = v => { const s=String(v==null?'':v); return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
const csvOut  = rows => BOM + rows.map(r=>r.map(csvCell).join(';')).join('\r\n');
const nCsv    = n => (Math.round((Number(n)||0)*100)/100).toFixed(2).replace('.',',');

function rdgMatrix(){
  const c=calc(), R=[], M=expMonths(), whole=M.length===12;
  const pick=arr=>M.map(i=>arr[i]);
  R.push([D.settings.naziv||'DOT YOUR SPOT','Račun dobiti i gubitka '+YEAR]);
  R.push(['Razdoblje', expLabel()]);
  if(D.settings.oib) R.push(['OIB',D.settings.oib]);
  R.push(['Izvještaj izrađen',new Date().toLocaleString('hr-HR')]);
  R.push([]);
  R.push(['Stavka'].concat(M.map(i=>MN[i])).concat(['UKUPNO']));
  ['prihod','place','fiksni','ostali'].forEach(sec=>{
    const rows=D.rows.filter(r=>r.s===sec); if(!rows.length) return;
    R.push([SEC[sec].l]);
    rows.forEach(r=>{ const v=M.map(i=>val(r.k,i)); R.push([r.l].concat(v.map(nCsv)).concat([nCsv(sum(v))])); });
    const st=M.map(i=>rows.reduce((s,r)=>s+val(r.k,i),0));
    R.push(['Ukupno '+SEC[sec].l.toLowerCase()].concat(st.map(nCsv)).concat([nCsv(sum(st))]));
  });
  R.push([]);
  const P=pick(c.prihodi), RA=pick(c.rashodi), DO=pick(c.dobit);
  R.push(['UKUPNI PRIHODI'].concat(P.map(nCsv)).concat([nCsv(sum(P))]));
  R.push(['UKUPNI RASHODI'].concat(RA.map(nCsv)).concat([nCsv(sum(RA))]));
  R.push(['DOBIT / GUBITAK'].concat(DO.map(nCsv)).concat([nCsv(sum(DO))]));
  const FI=pick(c.fin), DF=pick(c.dobitFin);
  if(sum(c.fin)){
    R.push(['od toga povrat pozajmica'].concat(FI.map(nCsv)).concat([nCsv(sum(FI))]));
    R.push(['DOBIT PRIJE FINANCIRANJA'].concat(DF.map(nCsv)).concat([nCsv(sum(DF))]));
  }
  if(whole) R.push(['KUMULATIVNO'].concat(c.kum.map(nCsv)).concat([]));
  R.push([]);
  R.push(['Usporedba '+(YEAR-1)+'.']);
  const p5=pick(D.p25.prihodi), r5=pick(D.p25.rashodi), d5=pick(D.p25.dobit);
  R.push(['Prihodi '+(YEAR-1)].concat(p5.map(nCsv)).concat([nCsv(sum(p5))]));
  R.push(['Rashodi '+(YEAR-1)].concat(r5.map(nCsv)).concat([nCsv(sum(r5))]));
  R.push(['Dobit '+(YEAR-1)].concat(d5.map(nCsv)).concat([nCsv(sum(d5))]));
  return R;
}
function txRows(){
  const R=[['Kategorija','Mjesec','Datum','Iznos EUR','Partner / opis','Valuta plaćanja','Plaćeno','Status']];
  const T=todayO(), MSEL=expMonths();
  D.rows.forEach(r=>(D.td[r.k]||[]).forEach((mo,mi)=>{ if(MSEL.indexOf(mi)===-1) return; (mo||[]).forEach(t=>{
    if(!(Number(t.a)||0) && !t.o) return;
    const vd=pd(t.v); let st='';
    if(t.p) st='plaćeno'; else if(vd) st = dnum(vd)<dnum(T)?'u kašnjenju' : dnum(vd)===dnum(T)?'dospijeva danas':'otvoreno';
    R.push([r.l, MN[mi], t.d||'', nCsv(t.a), t.o||'', t.v||'', t.p||'', st]);
  }); }));
  return R;
}
function exportCSV(){
  dl('DYS_RDG_'+expSlug()+'_'+isoToday()+'.csv', new Blob([csvOut(rdgMatrix())],{type:'text/csv;charset=utf-8'}));
  toast('CSV izvezen');
}
function exportCatCSV(){
  const r=D.rows.find(x=>x.k===CAT), god=CATM<0;
  const R=[[r.l+' — '+(god?'cijela godina ':MN[CATM]+' ')+YEAR],[],
           (god?['Mjesec']:[]).concat(['Datum','Iznos EUR','Partner / opis','Valuta plaćanja','Plaćeno'])];
  let uk=0;
  (D.td[CAT]||[]).forEach((mo,mi)=>{ if(!god && mi!==CATM) return;
    (mo||[]).forEach(t=>{ uk+=Number(t.a)||0;
      R.push((god?[MN[mi]]:[]).concat([t.d||'',nCsv(t.a),t.o||'',t.v||'',t.p||''])); }); });
  R.push((god?['']:[]).concat(['UKUPNO',nCsv(uk)]));
  dl('DYS_'+CAT+'_'+(god?'godina':MR[CATM])+'_'+YEAR+'.csv', new Blob([csvOut(R)],{type:'text/csv;charset=utf-8'}));
  toast('CSV izvezen');
}
async function exportXLSX(){
  try{
    const X=await needXlsx();
    const wb=X.utils.book_new();
    const num=r=>r.map(c=>{ const s=String(c); return /^-?\d{1,3}(\.\d{3})*,\d{2}$|^-?\d+,\d{2}$/.test(s)?pn(s):c; });
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(rdgMatrix().map(num)), 'RDG '+expSlug().slice(0,24));
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(txRows().map(num)), 'Transakcije');
    const c=calc();
    const MSEL=expMonths();
    const st=[['Kategorija','Ukupno EUR','Udjel %'],['Razdoblje: '+expLabel()]];
    const tr=MSEL.reduce((a,i)=>a+c.rashodi[i],0);
    D.rows.filter(r=>r.s!=='prihod').map(r=>({l:r.l,v:MSEL.reduce((a,i)=>a+val(r.k,i),0)}))
      .filter(x=>x.v).sort((a,b)=>b.v-a.v)
      .forEach(x=>st.push([x.l, Math.round(x.v*100)/100, tr?Math.round(x.v/tr*1000)/10:0]));
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(st), 'Struktura troškova');
    const fc=forecast(3), fr=[['Mjesec','Prihodi','Rashodi','Dobit']];
    fc.forEach(f=>fr.push([f.m, Math.round(f.prihodi*100)/100, Math.round(f.rashodi*100)/100, Math.round(f.dobit*100)/100]));
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(fr), 'Projekcija');
    const du=getDues(), dr=[['Status','Valuta','Kategorija','Partner','Iznos EUR','Dana']];
    // dospijeća se uvijek izvoze u cijelosti — vezana su uz današnji dan, ne uz razdoblje
    [['U kašnjenju',du.over],['Danas',du.today],['Nadolazi',du.soon]].forEach(g=>
      g[1].forEach(d=>dr.push([g[0], d.v, d.lbl, d.o, Math.round(d.a*100)/100, d.days])));

/* ═══════════════════════════════════════════════════════════════════════════
   UVOZ IZLAZNIH RAČUNA
   Učitava popis računa koje DYS izdaje (CSV / Excel / zalijepljena tablica / PDF)
   i smješta ih u Prihode prema mjesecu datuma računa.
   ═══════════════════════════════════════════════════════════════════════════ */

let INV = null;   // {rows, header, map, items, src, cat, filter}

/* ── Prepoznavanje uloge stupca po nazivu zaglavlja ───────────────────────── */
const INVKEYS = {
  datum:  ['datum racuna','datum izdavanja','datum izdanja','datum dokumenta','datum','dat.','izdano','issue date','date'],
  broj:   ['broj racuna','br. racuna','br.racuna','broj dokumenta','broj','br.','rn.br','rn br','racun','invoice','dokument','oznaka'],
  kupac:  ['kupac','partner','naziv kupca','naziv partnera','klijent','primatelj','tvrtka','obveznik','naziv','customer'],
  iznos:  ['iznos s pdv','ukupno s pdv','za platiti','sveukupno','ukupan iznos','ukupno','iznos','bruto','total','vrijednost'],
  valuta: ['datum dospijeca','dospijece','rok placanja','valuta placanja','valuta','v.pl','dospjelost','due'],
  placeno:['datum placanja','placeno','naplaceno','datum naplate','uplaceno','paid'],
};
const INVROLES = [
  ['datum','Datum računa','obavezno'],
  ['iznos','Iznos (EUR)','obavezno'],
  ['broj','Broj računa',''],
  ['kupac','Kupac / partner',''],
  ['valuta','Valuta plaćanja / dospijeće',''],
  ['placeno','Datum plaćanja',''],
];

/** Tablica iz datoteke → {rows:[[]], header:index|-1} */
function invTable(lines){
  const rows = lines.map(l=>{
    if(l.seg && l.seg.length>1) return l.seg.map(s=>String(s.s||'').trim());
    return String(l.t||'').split(/\t|\s{3,}/).map(x=>x.trim());
  }).filter(r=>r.join('').trim().length);
  // najšira širina = broj stupaca
  let w=0; rows.forEach(r=>{ if(r.length>w) w=r.length; });
  rows.forEach(r=>{ while(r.length<w) r.push(''); });
  // zaglavlje: prvi redak s barem 2 poznata naziva i bez iznosa
  let header=-1;
  for(let i=0;i<Math.min(rows.length,20);i++){
    let hits=0;
    rows[i].forEach(c=>{ if(invRole(c)) hits++; });
    if(hits>=2){ header=i; break; }
  }
  return {rows:rows, header:header, w:w};
}
/* Ravna lista svih ključnih riječi, najduže prve — da "Datum plaćanja"
   ne bude proglašen datumom računa samo zato što počinje s "datum". */
const INVFLAT = (function(){
  const out=[];
  for(const role in INVKEYS) INVKEYS[role].forEach(k=>out.push({k:k, r:role}));
  return out.sort((a,b)=>b.k.length-a.k.length);
})();
function invRole(cell){
  const t=norm(cell).toLowerCase().trim();
  if(!t||t.length>44) return null;
  for(let i=0;i<INVFLAT.length;i++) if(t===INVFLAT[i].k) return INVFLAT[i].r;
  for(let i=0;i<INVFLAT.length;i++){
    const k=INVFLAT[i].k;
    if(k.length>=5 && t.indexOf(k)>-1) return INVFLAT[i].r;
  }
  for(let i=0;i<INVFLAT.length;i++){
    const k=INVFLAT[i].k;
    if(t.indexOf(k)===0) return INVFLAT[i].r;
  }
  return null;
}

/** Automatsko mapiranje stupaca — po zaglavlju, a ako ga nema, po sadržaju */
function invAutoMap(T){
  const map={datum:-1,broj:-1,kupac:-1,iznos:-1,valuta:-1,placeno:-1};
  if(T.header>-1){
    T.rows[T.header].forEach((c,i)=>{
      const r=invRole(c);
      if(r && map[r]===-1) map[r]=i;
    });
  }
  const body = T.rows.slice(T.header>-1?T.header+1:0);
  const stat=[];
  for(let i=0;i<T.w;i++){
    let d=0,a=0,tx=0,len=0,mx=0;
    body.forEach(r=>{
      const v=String(r[i]||'').trim(); if(!v) return;
      if(pd(v)||/^\d{1,2}[.\/]\d{1,2}[.\/]\d{2,4}/.test(v)) d++;
      const n=pn(v);
      if(n && /[\d]/.test(v) && /[,.]\d{2}\b|^\d+$/.test(v)){ a++; if(Math.abs(n)>mx) mx=Math.abs(n); }
      if(/[a-zA-ZčćžšđČĆŽŠĐ]{3,}/.test(v)){ tx++; len+=v.length; }
    });
    stat.push({i:i,d:d,a:a,tx:tx,len:len,mx:mx});
  }
  const free=r=>stat.filter(s=>Object.keys(map).every(k=>map[k]!==s.i)||map[r]===s.i);
  if(map.datum===-1){ const c=free('datum').slice().sort((x,y)=>y.d-x.d)[0]; if(c&&c.d>0) map.datum=c.i; }
  if(map.iznos===-1){ const c=free('iznos').slice().sort((x,y)=>(y.a-x.a)||(y.mx-x.mx))[0]; if(c&&c.a>0) map.iznos=c.i; }
  if(map.kupac===-1){ const c=free('kupac').slice().sort((x,y)=>y.len-x.len)[0]; if(c&&c.tx>0) map.kupac=c.i; }
  if(map.valuta===-1){ const c=free('valuta').slice().filter(s=>s.i!==map.datum).sort((x,y)=>y.d-x.d)[0]; if(c&&c.d>0) map.valuta=c.i; }
  return map;
}

/** Primjena mapiranja → stavke spremne za knjiženje */
function invBuild(T,map,cat){
  const out=[];
  const body=T.rows.slice(T.header>-1?T.header+1:0);
  body.forEach(r=>{
    const rawD = map.datum>-1 ? r[map.datum] : '';
    const dt = pd(rawD) || pd(String(rawD).split(' ')[0]) || pd(String(rawD).replace(/\s/g,''));
    if(!dt) return;
    const amt = map.iznos>-1 ? pn(r[map.iznos]) : 0;
    if(!amt) return;
    const broj = map.broj>-1 ? String(r[map.broj]||'').trim() : '';
    const kupac= map.kupac>-1 ? String(r[map.kupac]||'').trim() : '';
    const vd   = map.valuta>-1 ? pd(String(r[map.valuta]||'').split(' ')[0]) : null;
    const pdt  = map.placeno>-1 ? pd(String(r[map.placeno]||'').split(' ')[0]) : null;
    const pRaw = map.placeno>-1 ? String(r[map.placeno]||'').trim() : '';
    let opis = broj ? ('RN.BR:'+broj.replace(/^RN\.?\s?BR\.?:?\s*/i,'')) : '';
    if(kupac) opis = opis ? (opis+' / '+kupac) : kupac;
    if(!opis) opis='(bez opisa)';
    const it={
      id: uid(), dt:dt, dts:fmtDY(dt), amt:amt, desc:opis,
      broj:broj, kupac:kupac,
      v: vd?fmtD(vd):'', p: pdt?fmtD(pdt):'',
      naplacen: !!pdt || /^(da|placeno|plaćeno|naplaceno|naplaćeno|yes|1)$/i.test(pRaw),
      cat: cat||'prihodi_grupe', use:true, dir:'in'
    };
    if(it.naplacen && !it.p) it.p=it.v||fmtD(it.dt);
    it.dup = isDuplicate({dt:it.dt, amt:Math.abs(it.amt), desc:it.desc});
    if(it.dup) it.use=false;
    out.push(it);
  });
  return out;
}


/* ═══════════════════════════════════════════════════════════════════════════
   POJEDINAČNI RAČUN (PDF dokument, ne popis)
   Prepoznaje raspored računa DOT YOUR SPOT: "R račun br.", "Datum računa",
   "Rok plaćanja", blok "Kupac" i "Ukupan iznos naplate".
   Ako PDF sadrži više računa jedan za drugim, svaki se čita zasebno.
   ═══════════════════════════════════════════════════════════════════════════ */

const RE_INV_NO  = /RA[CČ]UN\s*BR\.?\s*:?\s*([0-9A-Za-z]+(?:[-\/][0-9A-Za-z]+){0,3})/i;
const RE_INV_DAT = /DATUM\s*RA[CČ]UNA\s*:?\s*(\d{1,2}\s*\.\s*\d{1,2}\s*\.\s*\d{2,4})/i;
const RE_INV_ROK = /(?:ROK\s*PLA[CĆ]ANJA|DATUM\s*DOSPIJE[CĆ]A|VALUTA\s*PLA[CĆ]ANJA|DOSPIJE[CĆ]E)\s*:?\s*(\d{1,2}\s*\.\s*\d{1,2}\s*\.\s*\d{2,4})/i;
const RE_INV_TOT = /(?:UKUPAN\s*IZNOS\s*NAPLATE|UKUPNO\s*ZA\s*(?:PLATITI|NAPLATU)|ZA\s*PLATITI|SVEUKUPNO|UKUPNO\s*S\s*PDV)\s*:?\s*([\d.,]+)/i;

/** Prepoznaje je li datoteka pojedinačni račun (ili više njih), a ne popis */
function looksLikeInvoiceDoc(lines){
  const t=lines.map(l=>l.t).join(' ');
  return RE_INV_NO.test(t) && RE_INV_TOT.test(t);
}

/** Iz linija PDF-a čita jedan ili više pojedinačnih računa */
function parseInvoiceDocs(lines, cat){
  // podijeli na dokumente na svakom "račun br."
  const starts=[];
  lines.forEach((l,i)=>{ if(RE_INV_NO.test(l.t)) starts.push(i); });
  if(!starts.length) return [];
  const blocks=[];
  starts.forEach((st,k)=>{
    const en = k+1<starts.length ? starts[k+1] : lines.length;
    blocks.push(lines.slice(st>2?st-2:0, en));
  });
  const out=[];
  blocks.forEach(bl=>{
    const txt=bl.map(l=>l.t).join('\n');
    const mNo=txt.match(RE_INV_NO), mDa=txt.match(RE_INV_DAT), mRo=txt.match(RE_INV_ROK), mTo=txt.match(RE_INV_TOT);
    if(!mTo) return;
    const dt = mDa ? pd(mDa[1].replace(/\s/g,'')) : null;
    if(!dt) return;
    const amt = pn(mTo[1]);
    if(!amt) return;
    const rok = mRo ? pd(mRo[1].replace(/\s/g,'')) : null;
    const broj = mNo ? mNo[1].trim() : '';
    const kupac = invBuyer(bl);
    let opis = broj ? 'RN.BR:'+broj : '';
    if(kupac) opis = opis ? opis+' / '+kupac : kupac;
    if(!opis) opis='(bez opisa)';
    const it={
      id:uid(), dt:dt, dts:fmtDY(dt), amt:amt, desc:opis, broj:broj, kupac:kupac,
      v: rok?fmtD(rok):'', p:'', naplacen:false,
      cat:cat||'prihodi_grupe', use:true, dir:'in', doc:true,
      pv: mPv ? pn(mPv[1]) : 0
    };
    it.dup = isDuplicate({dt:it.dt, amt:Math.abs(it.amt), desc:it.desc});
    if(it.dup==='tocno') it.use=false;
    out.push(it);
  });
  return out;
}

/** Naziv kupca: desni stupac ispod naslova "Kupac" */
function invBuyer(bl){
  const SKIP=/^(oib|adresa|ulica|ul\.|hr\d|iban|mb|mbs|tel|e-?mail|pdv|kupac|ra[cč]un izdao|naru[cč]itelj|primatelj)/i;
  for(let i=0;i<bl.length;i++){
    const l=bl[i];
    if(!/\bKUPAC\b|\bNARU[CČ]ITELJ\b|\bPRIMATELJ\b/i.test(l.t)) continue;
    // s x-koordinatama: uzmi segmente desno od riječi "Kupac"
    if(l.seg && l.seg.length){
      let kx=null;
      l.seg.forEach(s=>{ if(/KUPAC|NARU[CČ]ITELJ|PRIMATELJ/i.test(s.s) && kx===null) kx=s.x; });
      if(kx!==null){
        for(let j=i+1;j<Math.min(i+5,bl.length);j++){
          const n=bl[j];
          if(!n.seg||!n.seg.length) continue;
          const right=n.seg.filter(s=>s.x>=kx-14).map(s=>s.s).join(' ').trim();
          if(right && !SKIP.test(right) && /[A-Za-zČĆŽŠĐčćžšđ]{3}/.test(right)) return right.slice(0,80);
        }
      }
    }
    // bez koordinata: tekst iza riječi "Kupac" ili sljedeći koristan redak
    const same=l.t.replace(/^.*\b(KUPAC|NARU[CČ]ITELJ|PRIMATELJ)\b[:\s]*/i,'').trim();
    if(same && !SKIP.test(same) && /[A-Za-zČĆŽŠĐčćžšđ]{3}/.test(same)) return same.slice(0,80);
    for(let j=i+1;j<Math.min(i+5,bl.length);j++){
      const c=bl[j].t.trim();
      if(c && !SKIP.test(c) && /[A-Za-zČĆŽŠĐčćžšđ]{3}/.test(c)) return c.slice(0,80);
    }
  }
  return '';
}

async function invFile(f){
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  invStat('<div class="alert i"><div class="alert-i">'+IC.clock+'</div><div><div class="alert-t">Obrađujem '+esc(f.name)+'…</div>'
    +'<div class="alert-b">Čitam tablicu i prepoznajem stupce.</div></div></div>');
  try{
    let lines;
    if(ext==='xls'||ext==='xlsx') lines = await xlsxLines(await f.arrayBuffer());
    else if(ext==='pdf')          lines = await pdfLines(await f.arrayBuffer());
    else                          lines = csvLines(await f.text());
    if(!lines.length) throw new Error('Datoteka ne sadrži čitljivu tablicu.');
    invRun(lines, f.name);

    invStat('<div class="alert d"><div class="alert-i">'+IC.warn+'</div><div><div class="alert-t">Uvoz nije uspio</div>'

function invRun(lines, src){

  if(looksLikeInvoiceDoc(lines)){

    if(items.length){
      INV={T:null, map:null, src:src, cat:cat, items:items, filter:'all', doc:true};
      invOpen();
      return;
    }
  }
  // 2) popis računa u tablici
  const T=invTable(lines);
  if(!T.rows.length) return invStat('<div class="alert w"><div class="alert-i">'+IC.warn+'</div><div><div class="alert-t">Tablica je prazna</div></div></div>');
  const map=invAutoMap(T);

function invCommit(){
  if(!INV) return;
  const sel=INV.items.filter(i=>i.use);
  if(!sel.length) return toast('Nema označenih računa',1);
  const months={};
  sel.forEach(it=>{
    const mi=it.dt.m-1; if(mi<0||mi>11) return;
    if(!D.td[it.cat]) D.td[it.cat]=[[],[],[],[],[],[],[],[],[],[],[],[]];
    while(D.td[it.cat].length<12) D.td[it.cat].push([]);
    const red={
      d: fmtD(it.dt), a: Math.round(it.amt*100)/100, o: it.desc,
      v: it.v || fmtD(it.dt), p: it.p || '', src:'racun'
    };
    if(it.pv>0) red.pv=Math.round(it.pv*100)/100;
    D.td[it.cat][mi].push(red);
    months[mi]=(months[mi]||0)+1;
  });
  Object.keys(D.td).forEach(k=>D.td[k].forEach(m=>m.sort((a,b)=>{
    const A=pd(a.d),B=pd(b.d); return (A?A.d:99)-(B?B.d:99);
  })));
  const tot=sel.reduce((s,i)=>s+i.amt,0);

function cfMap(){ return Object.assign({}, CFMAP_DEF, D.settings.cfmap||{}); }
function cfRules(){
  const u=(D.settings.cfrules||[]).map(r=>({p:norm(r.p), l:r.l, u:1, id:r.id}));
  return u.concat(CFRULES_DEF.map(r=>({p:norm(r[0]), l:r[1], u:0})));
}
function cfLineOf(cat, desc, isIn){
  const t=norm(desc||'');
  // Pozajmice i krediti su financiranje, ne poslovni tijek
  if(/POZAJM|ZAJAM|KREDIT|DOKAPITAL/.test(t)) return isIn ? 'loan1' : 'out1';
  // Pravilo po partneru pobjeđuje mapiranje po kategoriji
  const R=cfRules();
  let best=null, len=-1;
  for(let i=0;i<R.length;i++){
    const r=R[i];
    if(!r.p || t.indexOf(r.p)===-1) continue;
    const sc=r.p.length+(r.u?1000:0);
    if(sc>len){ len=sc; best=r; }
  }
  if(best && !isIn) return best.l;
  const m=cfMap();
  return m[cat] || (isIn?'in_other':'opex_other');
}
function cfLearn(desc, line){
  const key=ruleKeyFrom(desc); if(!key||key.length<3) return;
  D.settings.cfrules=D.settings.cfrules||[];
  const n=norm(key);
  const ex=D.settings.cfrules.find(r=>norm(r.p)===n);
  if(ex) ex.l=line;
  else D.settings.cfrules.push({id:uid(), p:key, l:line});
}

/* ── Tjedan ───────────────────────────────────────────────────────────────── */
let CFW = null;   // ponedjeljak tekućeg prikaza (Date)
const DAYS = ['Pon','Uto','Sri','Čet','Pet','Sub','Ned'];
function monday(d){
  const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const w=(x.getDay()+6)%7;         // 0 = ponedjeljak
  x.setDate(x.getDate()-w);
  return x;
}
function cfWeek(){ if(!CFW) CFW=monday(new Date()); return CFW; }
function cfDays(){
  const m=cfWeek(), out=[];
  for(let i=0;i<7;i++){ const d=new Date(m); d.setDate(m.getDate()+i); out.push(d); }
  return out;
}
function cfKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function cfLabel(){
  const d=cfDays(), a=d[0], b=d[6];
  return a.getDate()+'.'+MS[a.getMonth()]+' – '+b.getDate()+'.'+MS[b.getMonth()]+' '+b.getFullYear()+'.';
}

/**
 * Izračun tjedna: za svaki redak i svaki dan zbroj plaćanja tog dana.
 * @returns {vals:{lineId:[7]}, tx:{lineId:[[...]]}, days:[Date]}
 */
function cfCalc(){
  const days=cfDays(), keys=days.map(cfKey);
  const vals={}, tx={};
  CFL.forEach(l=>{ vals[l.id]=[0,0,0,0,0,0,0]; tx[l.id]=[[],[],[],[],[],[],[]]; });
  D.rows.forEach(r=>{
    const isIn = r.s==='prihod';
    (D.td[r.k]||[]).forEach((mo,mi)=>(mo||[]).forEach(t=>{
      const a=Number(t.a)||0; if(!a) return;
      const pdt=pd(t.p); if(!pdt) return;                 // samo stvarno plaćeno
      const k=pdt.y+'-'+String(pdt.m).padStart(2,'0')+'-'+String(pdt.d).padStart(2,'0');
      const di=keys.indexOf(k); if(di<0) return;
      const line=cfLineOf(r.k, t.o, isIn);
      vals[line][di]+=a;
      tx[line][di].push({o:t.o, a:a, cat:r.l});
    }));
  });
  // Plaće su u RDG-u mjesečni iznos bez datuma — ulaze u tijek na upisani datum isplate
  const PD=D.settings.placeDates||{};
  for(let mi=0;mi<12;mi++){
    const ds=PD[mi]; if(!ds) continue;
    const q=pd(ds); if(!q) continue;
    const k=q.y+'-'+String(q.m).padStart(2,'0')+'-'+String(q.d).padStart(2,'0');
    const di=keys.indexOf(k); if(di<0) continue;
    let amt=0;
    D.rows.filter(r=>r.s==='place').forEach(r=>{ if(!fromTx(r.k,mi)) amt+=Number((D.p[r.k]||[])[mi])||0; });
    if(!amt) continue;
    vals.opex_emp[di]+=amt;
    tx.opex_emp[di].push({o:'Bruto plaće za '+MN[mi], a:amt, cat:'Plaće'});
  }

  // zbrojevi
  const g=(grp,ids)=>{ const s=[0,0,0,0,0,0,0];
    CFL.filter(l=>ids.indexOf(l.id)>-1).forEach(l=>l&&vals[l.id].forEach((v,i)=>s[i]+=v)); return s; };
  const IN =['in_licence','in_payments','in_hw','in_other','loan1','loan2','other_in1'];
  const CG =['cogs_licence','cogs_payments','cogs_hw','cogs_other'];
  const OP =['opex_emp','opex_mat','opex_swpf','opex_extsrv','opex_mkt','opex_rent','opex_prof','opex_itdev','opex_other','opex_extsw'];
  const OT =['int_paid','int_conv','vat','intercomp','out1','out2'];
  vals.tot_in=g('in',IN); vals.tot_cogs=g('cogs',CG); vals.tot_opex=g('opex',OP);
  const oth=g('other',OT);
  vals.net = vals.tot_in.map((v,i)=>v - vals.tot_cogs[i] - vals.tot_opex[i] - oth[i]);
  const bal = (D.settings.cfBal||{})[cfKey(days[0])];
  let cur = (bal===undefined||bal===null||bal==='') ? null : Number(bal);
  vals.bgn=[0,0,0,0,0,0,0]; vals.end=[0,0,0,0,0,0,0];
  for(let i=0;i<7;i++){
    if(cur===null){ vals.bgn[i]=null; vals.end[i]=null; }
    else { vals.bgn[i]=cur; cur=cur+vals.net[i]; vals.end[i]=cur; }
  }
  return {vals:vals, tx:tx, days:days, other:oth};
}

/** Neto po tjednu — za trakicu s odabirom tjedana */
function cfWeekNet(mon){
  const keys=[]; for(let i=0;i<7;i++){ const d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i); keys.push(cfKey(d)); }
  let net=0, n=0;
  D.rows.forEach(r=>{
    const isIn=r.s==='prihod';
    (D.td[r.k]||[]).forEach(mo=>(mo||[]).forEach(t=>{
      const a=Number(t.a)||0; if(!a) return;
      const q=pd(t.p); if(!q) return;
      const k=q.y+'-'+String(q.m).padStart(2,'0')+'-'+String(q.d).padStart(2,'0');
      if(keys.indexOf(k)<0) return;
      net += isIn ? a : -a; n++;
    }));
  });
  const PD=D.settings.placeDates||{};
  for(let mi=0;mi<12;mi++){
    const q=pd(PD[mi]); if(!q) continue;
    const k=q.y+'-'+String(q.m).padStart(2,'0')+'-'+String(q.d).padStart(2,'0');
    if(keys.indexOf(k)<0) continue;
    let amt=0; D.rows.filter(r=>r.s==='place').forEach(r=>{ if(!fromTx(r.k,mi)) amt+=Number((D.p[r.k]||[])[mi])||0; });
    if(amt){ net-=amt; n++; }
  }
  return {net:net, n:n};
}

/* ═══════════════════════════════════════════════════════════════════════════
   USPOREDBA S HRVOJEVOM TABLICOM
   Učita se izvorna Excel tablica (list _dot_your_spot_CRO) i njezine se
   dnevne vrijednosti usporede s onim što aplikacija računa iz knjige.
   Uspoređuje se redak po redak i dan po dan, pa se odmah vidi koja stavka
   nedostaje na kojoj strani.
   ═══════════════════════════════════════════════════════════════════════════ */

const CFMON = {JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12,
               SIJ:1,VELJ:2,OZU:3,TRA:4,SVI:5,LIP:6,SRP:7,KOL:8,RUJ:9,LIS:10,STU:11,PRO:12};

/** Naziv retka → id, neovisno o razmacima i velikim slovima */
function cfLabelId(s){
  const n=String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
  if(!n) return null;
  for(let i=0;i<CFL.length;i++){
    if(CFL[i].l.toLowerCase().replace(/\s+/g,' ').trim()===n) return CFL[i].id;
  }
  const AL={'cash in - payments':'in_payments','beginning cash':'__bgn','ending cash':'__end',
            'total net cash flow':'net','(optional) cash account balance at beginning of day':'__bal'};
  return AL[n]||null;
}

/** Zaglavlje stupca "1.Aug(Sa)" → datum; godina se prati kroz prijelaz mjeseca */
function cfHdrDate(s, st){
  const m=String(s||'').trim().match(/^(\d{1,2})\s*\.\s*([A-Za-zČĆŠŽčćšž]{3,})/);
  if(!m) return null;
  const mo=CFMON[m[2].slice(0,3).toUpperCase()];
  if(!mo) return null;
  if(st.last!==null && mo<st.last) st.y++;
  st.last=mo;
  return st.y+'-'+String(mo).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0');
}

/** Excel → {file, when, days:{datum:{id:iznos}}} */
async function cfCmpParse(file){
  const X=await needXlsx();
  const wb=X.read(await file.arrayBuffer(), {type:'array', cellDates:false, raw:true});
  let ws=null;
  wb.SheetNames.forEach(n=>{ if(!ws && /dot.?your.?spot|cash.?flow/i.test(n)) ws=wb.Sheets[n]; });
  if(!ws) ws=wb.Sheets[wb.SheetNames[0]];
  const G=X.utils.sheet_to_json(ws,{header:1, raw:true, defval:null});
  if(!G.length) throw new Error('List je prazan');

  /* redak zaglavlja = onaj s najviše prepoznatih datuma */
  let hi=-1, hn=0, hd=null;
  for(let r=0;r<Math.min(G.length,15);r++){
    const st={y:YEAR, last:null}, d=[];
    let n=0;
    (G[r]||[]).forEach((c,ci)=>{ const k=cfHdrDate(c,st); d[ci]=k; if(k) n++; });
    if(n>hn){ hn=n; hi=r; hd=d; }
  }
  if(hn<5) throw new Error('Nisu pronađeni stupci s datumima (npr. „1.Aug(Sa)")');

  const days={};
  for(let r=hi+1;r<G.length;r++){
    const row=G[r]||[];
    let id=null;
    for(let c=0;c<3 && !id;c++) id=cfLabelId(row[c]);
    if(!id || id.charAt(0)==='_' ) continue;
    for(let c=0;c<row.length;c++){
      const k=hd[c]; if(!k) continue;
      const v=row[c];
      if(typeof v!=='number' || !isFinite(v) || Math.abs(v)<0.005) continue;
      (days[k]=days[k]||{});
      days[k][id]=Math.round(((days[k][id]||0)+v)*100)/100;
    }
  }
  return {file:file.name, when:new Date().toLocaleString('hr-HR'), days:days};
}

async function cfCmpLoad(file){
  try{
    const r=await cfCmpParse(file);
    const n=Object.keys(r.days).length;
    if(!n) throw new Error('Nije pročitana nijedna vrijednost');
    D.settings.cfcmp=r; save(true); reRender();
    toast('Tablica učitana — '+n+' dana za usporedbu');
  }catch(e){ toast('Tablicu nije moguće pročitati: '+e.message, 1); }
}
function cfCmpClear(){ delete D.settings.cfcmp; save(true); reRender(); toast('Usporedba uklonjena'); }

/** Usporedba za zadani tjedan: po retku i po danu */
function cfCmpWeek(){
  const C=D.settings.cfcmp; if(!C) return null;
  const R=cfCalc(), days=R.days.map(cfKey);
  const linije=[], dani=[];
  const IDS=CFL.filter(l=>l.g==='in'||l.g==='out').map(l=>l.id);
  IDS.forEach(id=>{
    let a=0,b=0;
    days.forEach(k=>{ a+=(R.vals[id]||[])[days.indexOf(k)]||0; b+=((C.days[k]||{})[id])||0; });
    a=Math.round(a*100)/100; b=Math.round(b*100)/100;
    if(Math.abs(a)<0.005 && Math.abs(b)<0.005) return;
    const st=[];
    days.forEach((k,di)=>{
      const av=Math.round(((R.vals[id]||[])[di]||0)*100)/100;
      const bv=Math.round((((C.days[k]||{})[id])||0)*100)/100;
      if(Math.abs(av-bv)<0.005) return;
      st.push({k:k, a:av, b:bv, tx:((R.tx[id]||[])[di]||[]).slice()});
    });
    linije.push({id:id, l:(CFL.find(x=>x.id===id)||{}).l||id, a:a, b:b, d:Math.round((a-b)*100)/100, st:st});
  });
  const ima = days.some(k=>{ const d=C.days[k]; return d && IDS.some(id=>d[id]!==undefined); });
  return {linije:linije, ima:ima, dana:days.filter(k=>C.days[k]).length};
}

/** Sve tjedne od prvog do zadnjeg dana u tablici — zeleno / crveno */
function cfCmpAllWeeks(){
  const C=D.settings.cfcmp; if(!C) return [];
  const ks=Object.keys(C.days).sort();
  if(!ks.length) return [];
  const d0=new Date(ks[0]), d1=new Date(ks[ks.length-1]);
  const out=[]; let m=monday(d0);
  const save=CFW;
  while(m<=d1){
    CFW=new Date(m.getFullYear(),m.getMonth(),m.getDate());
    const w=cfCmpWeek();
    out.push({mon:cfKey(m), lbl:cfLabel(), ok:w && w.linije.every(l=>Math.abs(l.d)<0.005), ima:w&&w.ima,
              n:w?w.linije.filter(l=>Math.abs(l.d)>=0.005).length:0});
    m=new Date(m.getFullYear(),m.getMonth(),m.getDate()+7);
  }
  CFW=save;
  return out;
}

      +razlike.length+(razlike.length===1?' redak se ne poklapa':' redaka se ne poklapa')+'</div>'
      +'<div class="alert-b">Plus znači da aplikacija ima više od tablice, minus da tablica ima stavku koje u knjizi nema. '
      +'Ispod svake razlike stoje stavke iz knjige za taj dan.</div></div></div>');
  }

  if(W && W.ima){
    h.push('<table style="margin-top:11px"><thead><tr><th class="l">Redak</th><th>Aplikacija</th><th>Tablica</th><th>Razlika</th></tr></thead><tbody>');
    W.linije.forEach(l=>{
      const ok=Math.abs(l.d)<0.005;
      h.push('<tr'+(ok?'':' style="background:var(--neg-bg)"')+'>'
        +'<td class="l" style="font-size:11.5px'+(ok?'':';font-weight:650')+'">'+esc(l.l)+'</td>'
        +'<td class="mono">'+nf2(l.a)+' <span class="eur">EUR</span></td>'
        +'<td class="mono">'+nf2(l.b)+' <span class="eur">EUR</span></td>'
        +'<td class="mono" style="font-weight:650;color:'+(ok?'var(--tx-3)':(l.d>0?'var(--warn)':'var(--neg)'))+'">'
        +(ok?'—':(l.d>0?'+':'')+nf2(l.d))+'</td></tr>');
      l.st.forEach(s=>{
        const stavke = s.tx.length
          ? s.tx.map(t=>nf2(t.a)+' &nbsp;'+esc(String(t.o).slice(0,54))).join('<br>')
          : '<span class="txt-mut">u knjizi nema stavke toga dana</span>';
        h.push('<tr><td class="l" colspan="4" style="padding:5px 12px 9px 26px;font-size:10.5px;color:var(--tx-2)">'
          +'<strong>'+esc(s.k.split('-').reverse().join('.'))+'.</strong> — aplikacija '+nf2(s.a)+' · tablica '+nf2(s.b)
          +'<div style="margin-top:3px" class="mono">'+stavke+'</div></td></tr>');
      });
    });
    h.push('</tbody></table>');
    h.push('<div style="display:flex;gap:8px;margin-top:12px"><button class="btn sm" onclick="cfCmpCsv()">'+IC.dl+' Razlike u CSV</button></div>');
  }
  h.push('</div></div>');
  return h.join('');
}

function cfCmpCsv(){
  const all=cfCmpAllWeeks(), rows=[['Tjedan','Redak','Aplikacija','Tablica','Razlika','Datum','Stavke iz knjige']];
  const sv=CFW;
  all.forEach(w=>{
    const pr=w.mon.split('-'); CFW=new Date(+pr[0],+pr[1]-1,+pr[2]);
    const W=cfCmpWeek(); if(!W||!W.ima) return;
    W.linije.filter(l=>Math.abs(l.d)>=0.005).forEach(l=>{
      rows.push([w.lbl, l.l, nf2(l.a), nf2(l.b), nf2(l.d), '', '']);
      l.st.forEach(s=>rows.push(['', '', nf2(s.a), nf2(s.b), nf2(s.a-s.b),
        s.k.split('-').reverse().join('.')+'.', s.tx.map(t=>nf2(t.a)+' '+t.o).join(' | ')]));
    });
  });
  CFW=sv;
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  dl('DYS_razlike_cash_flow_'+isoToday()+'.csv', new Blob([csv],{type:'text/csv;charset=utf-8'}));
}

function wireCmp(){
  const inp=document.getElementById('cmpInp');
  if(inp) inp.onchange=e=>{ const f=e.target.files[0]; if(f) cfCmpLoad(f); };
  const dz=document.getElementById('cmpDz');

    ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over');}));
