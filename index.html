*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
body{font-family:var(--font);font-weight:400;background:var(--bg);color:var(--text-primary);font-size:15px;letter-spacing:-0.01em;}
input,select,button,th,td{font-family:var(--font);}
input:focus{outline:none;border-color:var(--accent)!important;box-shadow:0 0 0 3px var(--accent-light)!important;}
select:focus{outline:none;}
input[type=number]::-webkit-inner-spin-button{opacity:0;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-tertiary);}
:root[data-theme="dark"] input[type=date]::-webkit-calendar-picker-indicator,
:root[data-theme="dark"] input[type=time]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.7;}

/* Sidebar */
.sidebar-link{
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;border-radius:var(--radius-sm);
  cursor:pointer;font-size:14px;font-weight:400;
  color:var(--text-secondary);letter-spacing:-0.01em;
  transition:all .15s ease;border:none;background:none;
  width:100%;text-align:left;
}
.sidebar-link:hover{background:var(--hover);color:var(--text-primary);}
.sidebar-link.active{background:var(--accent);color:var(--on-accent);font-weight:500;}
.sidebar-link.active svg{opacity:1;}

/* Cards */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:20px 22px;
  box-shadow:var(--shadow-sm);
}

/* Buttons */
.btn{
  border:none;border-radius:var(--radius-md);
  padding:9px 18px;cursor:pointer;
  font-family:var(--font);font-weight:500;
  font-size:14px;letter-spacing:-0.01em;
  transition:all .15s ease;
  display:inline-flex;align-items:center;gap:6px;
}
.btn:active{transform:scale(0.98);}
.btn-primary{
  background:var(--accent);color:var(--on-accent);
  box-shadow:0 1px 4px rgba(0,113,227,0.3);
}
.btn-primary:hover{background:var(--accent-hover);box-shadow:0 2px 8px rgba(0,113,227,0.4);}
.btn-outline{
  background:var(--surface);color:var(--text-primary);
  border:1px solid var(--border-strong);
  box-shadow:var(--shadow-sm);
}
.btn-outline:hover{background:var(--surface-secondary);border-color:var(--text-tertiary);}
.btn-blue{background:var(--accent);color:var(--on-accent);}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:translateX(0)}}
.page-enter{animation:fadeUp .25s cubic-bezier(0.34,1.56,0.64,1) both;}

/* Inputs */
input,select{
  font-family:var(--font);
  border-radius:var(--radius-sm);
  border:1px solid var(--border-strong);
  background:var(--surface);
  color:var(--text-primary);
  transition:all .15s;
  font-size:14px;
}
input::placeholder{color:var(--text-tertiary);}

/* Table */
th{font-weight:600;letter-spacing:-0.01em;}
td{letter-spacing:-0.01em;}

/* Segment control */
.seg-ctrl{
  display:flex;
  background:var(--hover);
  border-radius:var(--radius-sm);
  padding:3px;gap:2px;
}
.seg-btn{
  padding:6px 14px;border:none;
  cursor:pointer;font-size:13px;font-weight:500;
  border-radius:6px;
  background:transparent;color:var(--text-secondary);
  transition:all .15s;letter-spacing:-0.01em;
  font-family:var(--font);
}
.seg-btn.active{
  background:var(--surface);

.badge{
  display:inline-flex;align-items:center;
  padding:2px 8px;border-radius:20px;

.unos-label{font-size:13px;font-weight:600;color:var(--text-secondary);letter-spacing:-0.01em;}
.unos-input,.unos-select{

function getEaster(year){
  const a=year%19,b=Math.floor(year/100),c=year%100;
  const d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30;

// Poznata povremena greška: token izgleda kao da je izdan u budućnosti.
// Rješenje je ponoviti zahtjev s rastućom odgodom.
function isClockError(e){
  const m=((e&&(e.message||e.msg))||"")+" "+((e&&e.code)||"");
  return /issued at future|PGRST303|JWSInvalidSignature/i.test(m);
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function withRetry(fn,tries=4){
  let last=null;
  for(let i=0;i<tries;i++){
    try{ return await fn(); }
    catch(e){
      last=e;
      if(!isClockError(e)) throw e;
      await wait([400,1200,2500,4000][i]||4000);
    }
  }
  throw last;
}

async function cloudLoad(){
  return withRetry(_cloudLoad);
}
async function _cloudLoad(){
  const c=sbClient(); if(!c) throw new Error("Supabase nije učitan");
  const [r1,r2]=await Promise.all([
    c.from("radnici").select("id,ime,titula,redoslijed").order("redoslijed",{ascending:true}),
    c.from("evidencija").select("kljuc,podaci")
  ]);
  if(r1.error) throw r1.error;
  if(r2.error) throw r2.error;
  const employees=(r1.data||[]).map(r=>({id:r.id,name:r.ime,title:r.titula||""}));
  const data={}; (r2.data||[]).forEach(r=>{data[r.kljuc]=r.podaci||{};});
  return {employees,data};
}

async function fillSheet(ws,wb,empName,empTitle,year,month,monthData,isFirst,startRow=1){
  const dc=DAYS_IN_MONTH(year,month);
  const pad=n=>String(n).padStart(2,"0");
  const period=`01.${pad(month+1)}.${year}.-${pad(dc)}.${pad(month+1)}.${year}.`;

  // Column widths — col 1=logo, col 2=datum, col 3=početak, col 4=završetak, col5+=kodovi
  if(isFirst){
    ws.getColumn(1).width=3;   // logo stub
    ws.getColumn(2).width=8;   // datum
    ws.getColumn(3).width=14;  // početak rada
    ws.getColumn(4).width=16;  // završetak rada
    const cw=[9,12,9,13,10,12,14,10,11,13,13,15];Object.keys(CODE_LABELS).slice(0,12).forEach((_,i)=>{ws.getColumn(5+i).width=cw[i]||12;});ws.getColumn(17).width=13;
  }

  const R=n=>startRow+n;
  const sc=(r,c,v,s={})=>{ws.getCell(r,c).value=v;if(Object.keys(s).length)ws.getCell(r,c).style=s;};
  const thin={style:"thin",color:{argb:"FFD0D0D0"}};
  const allBorder={top:thin,left:thin,bottom:thin,right:thin};

  // ── Header info (no logo area, start from col 1) ──
  ws.getRow(R(0)).height=15;
  sc(R(0),1,"Organizacijska jedinica: DOT YOUR SPOT",{font:{bold:true,size:10,name:"Calibri"},alignment:{vertical:"middle"}});
  ws.mergeCells(R(0),1,R(0),10);

  ws.getRow(R(1)).height=14;
  sc(R(1),1,`Razdoblje: ${pad(1)}.${pad(month+1)}.${year}.-${pad(dc)}.${pad(month+1)}.${year}.`,{font:{bold:true,size:10,name:"Calibri"},alignment:{vertical:"middle"}});
  ws.mergeCells(R(1),1,R(1),10);

  ws.getRow(R(2)).height=14;
  sc(R(2),1,`Radnik: ${empName} - ${empTitle}`,{font:{bold:true,size:10,color:{argb:"FF1E40AF"},name:"Calibri"},alignment:{vertical:"middle"}});
  ws.mergeCells(R(2),1,R(2),10);

  ws.getRow(R(3)).height=6; // spacer

  // ── Column headers ──
  const HR=R(4);
  ws.getRow(HR).height=22;
  const CODE_SHORT=["Zastoj","Ukupno sati","Rad noću","Prekovremeni","Smjenski","Rad ned/blag","Godišnji odmor","Blagdani","Bolovanje","Plaćeni dop.","Očinski dop.","Neplaćeni dop."];
  const headers=["DATUM","POČETAK RADA","ZAVRŠETAK RADA",...CODE_SHORT,"UKUPNO SATI"];
  headers.forEach((h,ci)=>{
    const cell=ws.getCell(HR,2+ci);
    cell.value=h;
    cell.style={
      font:{bold:true,size:8,color:{argb:"FFFFFFFF"},name:"Calibri"},
      fill:{type:"pattern",pattern:"solid",fgColor:{argb:"FF1E3A5F"}},
      alignment:{horizontal:"center",vertical:"middle",wrapText:true},
      border:allBorder
    };
  });

  // ── Day rows ──
  const holidays=getCroatianHolidays(year);
  for(let d=1;d<=dc;d++){
    const dd=monthData[d]||emptyDay();
    const totalH=parseFloat(dd.codes?.II)||calcH(dd.start,dd.end)||0;
    const ri=R(4+d);
    ws.getRow(ri).height=14;
    const isSat=IS_SAT(year,month,d),isSun=IS_SUN(year,month,d),isHol=!!holidays[`${year}-${month}-${d}`];
    const hasSick=parseFloat(dd.codes?.IX||0)>0;

    // Row fill
    let rowFill=null;
    if(isSat) rowFill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFFF99"}};  // žuta
    if(isSun) rowFill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFCCCC"}};  // crvena
    if(isHol) rowFill={type:"pattern",pattern:"solid",fgColor:{argb:"FFD6EAFF"}};  // svijetlo plava

    const cellStyle=(extra={})=>{
      const base={alignment:{horizontal:"center",vertical:"middle"},border:allBorder,font:{size:9,name:"Calibri",...(extra.font||{})},...extra};
      if(rowFill) base.fill=rowFill;
      return base;
    };

    // Datum
    const datumCell=ws.getCell(ri,2);
    datumCell.value=`${d}.`;
    datumCell.style=cellStyle({font:{bold:true,size:9,name:"Calibri"},alignment:{horizontal:"left",vertical:"middle",indent:1}});

    // Početak rada
    const startCell=ws.getCell(ri,3);
    startCell.value=dd.start||"";
    startCell.style=cellStyle();

    // Završetak rada
    const endCell=ws.getCell(ri,4);
    endCell.value=dd.end||"";
    endCell.style=cellStyle();

    // Kodovi (I. – XX.)
    Object.keys(CODE_LABELS).slice(0,12).forEach((k,ci)=>{
      // II = ukupni sati (automatski izračun)
      let raw;
      if(k==="II") raw=totalH||"";
      else raw=dd.codes?.[k]||"";
      const v=raw!==""?(isNaN(raw)?raw:Number(raw)):"";
      const cell=ws.getCell(ri,5+ci);
      cell.value=v;

      // Font colour logic
      let fontOverride={size:9,name:"Calibri"};
      if(k==="II"&&v>0)  fontOverride={...fontOverride,bold:true,color:{argb:"FF2563EB"}}; // plava - ukupno sati
      if(k==="IX"&&v>0)  fontOverride={...fontOverride,bold:true,color:{argb:"FFDC2626"}}; // crvena - bolovanje

      // IX rubrika fill: ako ima bolovanje → crvena pozadina bez obzira na red
      let cellFill=rowFill;
      if(k==="IX"&&v>0) cellFill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFECACA"}};

      const s={alignment:{horizontal:"center",vertical:"middle"},border:allBorder,font:fontOverride};
      if(cellFill) s.fill=cellFill;
      cell.style=s;
    });

    // Kolona UKUPNO SATI = zbroj svih unesenih kodova za taj dan
    const rowTotal=(()=>{
      let sum=0;
      Object.keys(CODE_LABELS).slice(0,12).forEach(k=>{
        if(k==="II") sum+=totalH;
        else sum+=parseFloat(dd.codes?.[k]||0)||0;
      });
      return Math.round(sum*10)/10||"";
    })();
    const totalCell=ws.getCell(ri,17);
    totalCell.value=rowTotal;
    const totalFill=rowFill||null;
    const ts={alignment:{horizontal:"center",vertical:"middle"},border:allBorder,font:{bold:true,size:9,name:"Calibri",color:rowTotal>0?{argb:"FF1E293B"}:{argb:"FFCBD5E1"}}};
    if(totalFill) ts.fill=totalFill;
    totalCell.style=ts;
  }

  // ── Ukupno row ──
  const tr=R(4+dc+1);
  ws.getRow(tr).height=16;
  const whiteFill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFFFFF"}};
  const ukupnoHeaderStyle={font:{bold:true,size:9,color:{argb:"FF1E3A5F"},name:"Calibri"},fill:{type:"pattern",pattern:"solid",fgColor:{argb:"FF1E3A5F"}},border:allBorder,alignment:{horizontal:"left",vertical:"middle",indent:1}};

  // Merge first 3 cols for "UKUPNO" label
  ws.getCell(tr,1).value="UKUPNO";
  ws.getCell(tr,1).style={...ukupnoHeaderStyle,font:{bold:true,size:9,color:{argb:"FFFFFFFF"},name:"Calibri"}};
  ws.getCell(tr,2).style=ukupnoHeaderStyle;
  ws.getCell(tr,3).style=ukupnoHeaderStyle;
  ws.getCell(tr,4).style=ukupnoHeaderStyle;
  try{ws.mergeCells(tr,1,tr,4);}catch(e){}

  let grandTotal=0;
  Object.keys(CODE_LABELS).slice(0,12).forEach((k,ci)=>{
    let s=0;
    for(let d=1;d<=dc;d++){
      const dd=monthData[d]||emptyDay();
      if(k==="II") s+=parseFloat(dd.codes?.II)||calcH(dd.start,dd.end)||0;
      else s+=parseFloat(dd.codes?.[k]||0)||0;
    }
    grandTotal+=s;
    const cell=ws.getCell(tr,5+ci);
    cell.value=s||"";
    // Ukupno row: bijela pozadina, plava boja za II, crvena za IX, sivo za ostalo
    let fontC={size:9,bold:true,name:"Calibri",color:{argb:"FF94A3B8"}};
    if(k==="II"&&s>0)  fontC={...fontC,color:{argb:"FF2563EB"}};
    if(k==="IX"&&s>0)  fontC={...fontC,color:{argb:"FFDC2626"}};
    cell.style={font:fontC,fill:whiteFill,border:allBorder,alignment:{horizontal:"center",vertical:"middle"}};
  });
  // Grand total cell
  const gtCell=ws.getCell(tr,17);
  gtCell.value=Math.round(grandTotal*10)/10||"";
  gtCell.style={font:{bold:true,size:10,name:"Calibri",color:{argb:"FF1E293B"}},fill:whiteFill,border:allBorder,alignment:{horizontal:"center",vertical:"middle"}};

  // Logo (samo za prvog zaposlenika, gore desno izvan tablice)
  if(isFirst){
    try{
      const imgId=wb.addImage({base64:LOGO_B64,extension:"jpeg"});
      ws.addImage(imgId,{tl:{col:18,row:startRow-1},br:{col:20,row:startRow+2},editAs:"oneCell"});
    }catch(e){}
  }
  return tr+1;
}

function BarChart({labels,datasets,height=240}){
  const ref=useRef();const chartRef=useRef();
  useEffect(()=>{
    if(!ref.current||!window.Chart)return;
    if(chartRef.current)chartRef.current.destroy();
    chartRef.current=new window.Chart(ref.current,{type:"bar",data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"top",labels:{font:{family:"Calibri Light",size:11},color:"var(--text-secondary)"}}},scales:{x:{ticks:{font:{family:"Calibri Light",size:10},color:"var(--text-tertiary)",maxRotation:30},grid:{display:false}},y:{ticks:{font:{family:"Calibri Light",size:10},color:"var(--text-tertiary)"},grid:{color:"rgba(128,128,128,0.18)"},beginAtZero:true}}}});
    return()=>{if(chartRef.current)chartRef.current.destroy();};
  },[labels,datasets]);
  return <canvas ref={ref} style={{height,width:"100%"}}/>;
}

// ── Vrste unosa (kao u DYS CRM-u) ──────────────────────────────────────────────
const ENTRY_TYPES=[
  {v:"work",  code:"II",    label:"Radni dan",                        kind:"work"},
  {v:"IV",    code:"IV",    label:"Prekovremeni rad",                 kind:"work"},
  {v:"III",   code:"III",   label:"Rad noću",                         kind:"work"},
  {v:"V",     code:"V",     label:"Smjenski rad",                     kind:"work"},
  {v:"VI",    code:"VI",    label:"Rad nedjeljom / blagdanom",        kind:"work"},
  {v:"XIII",  code:"XIII",  label:"Terenski rad",                     kind:"work"},
  {v:"XIV",   code:"XIV",   label:"Pripravnost",                      kind:"work"},
  {v:"I",     code:"I",     label:"Zastoj / prekid rada",             kind:"span"},
  {v:"VII",   code:"VII",   label:"Godišnji odmor",                   kind:"abs"},
  {v:"VIII",  code:"VIII",  label:"Blagdan (naknada plaće)",          kind:"abs"},
  {v:"IX",    code:"IX",    label:"Bolovanje",                        kind:"abs"},
  {v:"X",     code:"X",     label:"Plaćeni dopust",                   kind:"abs"},
  {v:"XI",    code:"XI",    label:"Očinski dopust",                   kind:"abs"},
  {v:"XII",   code:"XII",   label:"Neplaćeni dopust (osobna skrb)",   kind:"abs"},
  {v:"XV",    code:"XV",    label:"Vojna obveza",                     kind:"abs"},
  {v:"XVI",   code:"XVI",   label:"Nenazočnost na zahtjev radnika",   kind:"abs"},
  {v:"XVII",  code:"XVII",  label:"Štrajk",                           kind:"abs"},
  {v:"XVIII", code:"XVIII", label:"Lockout",                          kind:"abs"},
  {v:"XIX",   code:"XIX",   label:"Nenazočnost (krivnja radnika)",    kind:"abs"},
  {v:"XX",    code:"XX",    label:"Neplaćeni dopust (javne funkcije)",kind:"abs"},
];
const TYPE_BY_V=Object.fromEntries(ENTRY_TYPES.map(t=>[t.v,t]));
const pad2=n=>String(n).padStart(2,"0");
// Sati <-> HH:MM
const hToTime=h=>{const n=parseFloat(h);if(isNaN(n))return"";const hh=Math.floor(n);const mm=Math.round((n-hh)*60);return pad2(Math.min(hh,23))+":"+pad2(mm===60?0:mm);};
const timeToH=t=>{if(!t)return"";const p=String(t).split(":");const a=parseInt(p[0],10),b=parseInt(p[1]||"0",10);if(isNaN(a))return"";return String(Math.round((a+b/60)*100)/100);};
const spanHours=(s,e)=>{const a=parseFloat(timeToH(s)),b=parseFloat(timeToH(e));if(isNaN(a)||isNaN(b))return 0;let d=b-a;if(d<0)d+=24;return Math.round(d*100)/100;};
// Iz spremljenog dana pogodi vrstu unosa
function guessType(dd){
  const c=dd.codes||{};
  const t=ENTRY_TYPES.find(t=>t.v!=="work"&&parseFloat(c[t.code])>0);
  if(t&&!(dd.start||dd.end))return t.v;
  if(t&&t.kind==="abs")return t.v;
  return "work";
}

// ── Ikone obrasca ──────────────────────────────────────────────────────────────
const IconX=()=><svg width="15" height="15" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
const IconCheck=()=><svg width="15" height="15" fill="none" stroke="currentColor" strokeWidth="2.6" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>;
const IconTrash=()=><svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>;
const IconCaret=({open})=><svg width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24" style={{transform:open?"rotate(90deg)":"none",transition:"transform .18s"}}><polyline points="9 18 15 12 9 6"/></svg>;

// ── Modal za unos ──────────────────────────────────────────────────────────────
function DayModal({emp,day,month,year,dayData,onSave,onDelete,onClose,employees,onChangeEmp}){
  const hadData=!!(dayData.start||dayData.end||Object.values(dayData.codes||{}).some(v=>v));
  const isWE=IS_WEEKEND(year,month,day),isH=!!getHoliday(year,month,day);
  const holName=getHoliday(year,month,day);

  const [type,setType]=useState(()=>hadData?guessType(dayData):"work");
  const [start,setStart]=useState(()=>{
    if(dayData.start)return hToTime(dayData.start);
    return (hadData||isWE||isH)?"":"08:00";
  });
  const [end,setEnd]=useState(()=>{
    if(dayData.end)return hToTime(dayData.end);
    return (hadData||isWE||isH)?"":"16:00";
  });
  const [note,setNote]=useState(dayData.note||"");
  const [dan,setDan]=useState(day);
  const [codes,setCodes]=useState({...(dayData.codes||{})});
  const [advanced,setAdvanced]=useState(false);

  // Dok je obrazac otvoren, stranica iza njega se ne pomiče.
  // Bez ovoga se na mobitelu skrola pozadina umjesto obrasca.
  useEffect(()=>{
    const y=window.scrollY||window.pageYOffset||0;
    const b=document.body,st=b.style;
    const prev={position:st.position,top:st.top,left:st.left,right:st.right,width:st.width,overflow:st.overflow};
    st.position="fixed";st.top=(-y)+"px";st.left="0";st.right="0";st.width="100%";st.overflow="hidden";
    return()=>{
      st.position=prev.position;st.top=prev.top;st.left=prev.left;
      st.right=prev.right;st.width=prev.width;st.overflow=prev.overflow;
      window.scrollTo(0,y);
    };
  },[]);

  const t=TYPE_BY_V[type]||TYPE_BY_V.work;
  const usesSpan=t.kind==="work"||t.kind==="span";
  const [sati,setSati]=useState(()=>{
    const g=guessType(dayData);
    const c=dayData.codes||{};
    if(hadData&&TYPE_BY_V[g]&&TYPE_BY_V[g].kind==="abs")return String(parseFloat(c[TYPE_BY_V[g].code])||8);
    return "8";
  });

  const autoH=usesSpan?spanHours(start,end):(parseFloat(sati)||0);
  const dc=DAYS_IN_MONTH(year,month);
  const dateStr=`${year}-${pad2(month+1)}-${pad2(dan)}`;

  const prevType=useRef(hadData?guessType(dayData):"work");
  const spremi=()=>{
    const nc={...codes};
    // Ako je vrsta unosa promijenjena, ukloni kod prethodne vrste
    const prev=TYPE_BY_V[prevType.current];
    if(prev&&prev.code!==t.code)delete nc[prev.code];
    let s="",e="";
    if(usesSpan){
      s=timeToH(start);e=timeToH(end);
      const h=spanHours(start,end);
      nc[t.code]=h||"";
      // Zastoj/prekid rada nije odrađeno radno vrijeme
      nc.II=(t.kind==="span")?"":(h||"");
    }else{
      nc[t.code]=parseFloat(sati)||"";
      nc.II="";
    }
    Object.keys(nc).forEach(k=>{if(nc[k]===""||nc[k]===null||nc[k]===undefined||parseFloat(nc[k])===0)delete nc[k];});
    onSave({start:s,end:e,codes:nc,note:note||"",type:t.v},dan);
  };

  return(
    <div className="unos-scrim" onMouseDown={ev=>{if(ev.target===ev.currentTarget)onClose();}}>
      <div className="unos-sheet" onMouseDown={ev=>ev.stopPropagation()}>
        <div className="unos-head">
          <div style={{minWidth:0}}>
            <div className="unos-title">{hadData?"Uredi unos":"Novi unos"}</div>
            <div className="unos-sub">
              {DAY_NAMES[DOW(year,month,dan)]}, {pad2(dan)}. {MONTHS[month]} {year}
              {holName?" · 🇭🇷 "+holName:""}
            </div>
          </div>
          <button className="unos-close" onClick={onClose} aria-label="Zatvori"><IconX/></button>
        </div>

        <div className="unos-body">
          <div className="unos-grid">
            <div className="unos-field">
              <label className="unos-label">Djelatnik</label>
              <select className="unos-select" value={emp.id}
                onChange={ev=>onChangeEmp&&onChangeEmp(ev.target.value)}>
                {(employees||[emp]).map(x=><option key={x.id} value={x.id}>{x.name} · {x.title}</option>)}
              </select>
            </div>
            <div className="unos-field">
              <label className="unos-label">Vrsta unosa</label>
              <select className="unos-select" value={type} onChange={ev=>setType(ev.target.value)}>
                {ENTRY_TYPES.map(x=><option key={x.v} value={x.v}>{x.label}</option>)}
              </select>
            </div>
            <div className="unos-field">
              <label className="unos-label">Datum</label>
              <input className="unos-input" type="date" value={dateStr}
                min={`${year}-${pad2(month+1)}-01`} max={`${year}-${pad2(month+1)}-${pad2(dc)}`}
                onChange={ev=>{const d=parseInt((ev.target.value||"").split("-")[2],10);if(d>=1&&d<=dc)setDan(d);}}/>
            </div>
            <div className="unos-field">
              <label className="unos-label">Napomena</label>
              <input className="unos-input" type="text" value={note} placeholder="Projekt / opis (opcionalno)"
                onChange={ev=>setNote(ev.target.value)}/>
            </div>
            {usesSpan?(
              <div className="unos-pair">
                <div className="unos-field">
                  <label className="unos-label">Početak</label>
                  <input className="unos-input" type="time" step="300" value={start} onChange={ev=>setStart(ev.target.value)}/>
                </div>
                <div className="unos-field">
                  <label className="unos-label">Kraj</label>
                  <input className="unos-input" type="time" step="300" value={end} onChange={ev=>setEnd(ev.target.value)}/>
                </div>
              </div>
            ):(
              <div className="unos-field">
                <label className="unos-label">Broj sati</label>
                <input className="unos-input" type="number" min="0" max="24" step="0.5" value={sati}
                  onChange={ev=>setSati(ev.target.value)}/>
              </div>
            )}
          </div>

          <div className="unos-note">
            <IconClock/>
            <span>Obračun ({t.code}.): <strong>{autoH} {autoH===1?"sat":(autoH>=2&&autoH<5?"sata":"sati")}</strong></span>
          </div>

          <div className="unos-adv">
            <button className="unos-adv-btn" onClick={()=>setAdvanced(a=>!a)}>
              <IconCaret open={advanced}/> Napredno — svi kodovi (I.–XX.)
            </button>
            {advanced&&(
              <React.Fragment>
                <div style={{fontSize:11.5,color:"var(--text-tertiary)",marginTop:8,lineHeight:1.45}}>
                  Vrijednosti upisane ovdje čuvaju se uz unos. Polja koja pokriva odabrana vrsta unosa
                  bit će prepisana pri spremanju.
                </div>
                <div className="unos-codes">
                  {Object.entries(CODE_LABELS).map(([k,label])=>(
                    <div key={k} style={{background:"var(--surface-secondary)",borderRadius:10,padding:"8px 10px",border:k===t.code?"1px solid var(--c-blue-200)":"1px solid var(--border)"}}>
                      <label style={{fontSize:10.5,color:k===t.code?"var(--c-blue-700)":"var(--text-tertiary)",display:"block",marginBottom:4,fontWeight:600}}>
                        {k}. {label.length>34?label.substring(0,34)+"…":label}
                      </label>
                      <input type="number" min="0" value={codes[k]??""} placeholder="0"
                        onChange={ev=>setCodes(c=>({...c,[k]:ev.target.value}))}
                        style={{width:"100%",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:7,padding:"6px 8px",color:"var(--text-primary)",fontSize:13,boxSizing:"border-box"}}/>
                    </div>
                  ))}
                </div>
              </React.Fragment>
            )}
          </div>
        </div>

        <div className="unos-foot">
          {hadData&&(
            <button onClick={onDelete}
              style={{marginRight:"auto",background:"var(--red-light)",color:"var(--red)",border:"1px solid var(--c-red-200)",borderRadius:12,padding:"10px 16px",cursor:"pointer",fontWeight:600,fontSize:14,fontFamily:"var(--font)",display:"inline-flex",alignItems:"center",gap:6}}>
              <IconTrash/> Obriši
            </button>
          )}
          <button className="btn btn-outline" onClick={onClose}>Odustani</button>
          <button className="btn btn-primary" onClick={spremi}><IconCheck/> Spremi</button>
        </div>
      </div>
    </div>
  );
}

// ── Početna stranica ───────────────────────────────────────────────────────────
function PageHome({data,year,month,setPage,setSelectedEmp,openDayModal,employees}){
  const now=new Date();
  const dc=DAYS_IN_MONTH(year,month);

  // Recent entries - gather last entered days across all employees
  const recent=[];
  employees.forEach(emp=>{
    const md=data[`${emp.id}_${year}_${month}`]||{};
    for(let d=dc;d>=1;d--){
      const dd=md[d];
      if(dd&&(dd.start||dd.end)){
        const totalH=parseFloat(dd.codes?.II)||calcH(dd.start,dd.end)||0;
        recent.push({emp,day:d,month,year,start:dd.start,end:dd.end,totalH});
      }
    }
  });
  recent.sort((a,b)=>b.day-a.day||(employees.findIndex(e=>e.id===b.emp.id)-employees.findIndex(e=>e.id===a.emp.id)));
  const recentTop=recent.slice(0,8);

  // Stats
  let totalUnosi=0,totalSatiMj=0;
  employees.forEach(emp=>{const md=data[`${emp.id}_${year}_${month}`]||{};for(let d=1;d<=dc;d++){const dd=md[d];if(dd&&(dd.start||dd.end)){totalUnosi++;totalSatiMj+=parseFloat(dd.codes?.II)||calcH(dd.start,dd.end)||0;}}});
  let ukupnoSvi=0;
  employees.forEach(emp=>{for(let m2=0;m2<12;m2++){const md=data[`${emp.id}_${year}_${m2}`]||{};const dc2=DAYS_IN_MONTH(year,m2);for(let d=1;d<=dc2;d++){const dd=md[d];if(dd&&(dd.start||dd.end))ukupnoSvi++;}}});

  const kpi=[
    {label:"Zaposlenici",value:employees.length,icon:<IconUsers/>,color:"var(--c-slate-200)",iconBg:"var(--c-slate-100)",textC:"var(--c-slate-900)"},
    {label:"Ukupno unosa",value:ukupnoSvi,icon:<IconCalendar/>,color:"var(--c-slate-200)",iconBg:"var(--c-slate-100)",textC:"var(--c-slate-900)"},
    {label:"Unosi ovaj mjesec",value:totalUnosi,icon:<IconClock/>,color:"var(--c-red-100)",iconBg:"var(--c-red-25)",textC:"var(--c-red-600)"},
    {label:"Sati ovaj mjesec",value:Math.round(totalSatiMj),icon:<IconTrend/>,color:"var(--c-amber-100)",iconBg:"var(--c-amber-50)",textC:"var(--c-amber-600)"},
  ];

  const pad=n=>String(n).padStart(2,"0");

  return(
    <div className="page-enter">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:28}}>
        <div>
          <h1 style={{fontSize:26,fontWeight:700,color:"var(--text-primary)",marginBottom:4}}>Dobrodošli</h1>
          <div style={{fontSize:14,color:"var(--text-tertiary)"}}>{MONTHS[month]} {year}</div>
        </div>
        <button className="btn btn-primary" onClick={()=>setPage("unos")} style={{display:"flex",alignItems:"center",gap:6,padding:"10px 20px",borderRadius:12}}>
          <IconPlus/> Novi unos
        </button>
      </div>

      {/* KPI */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:16,marginBottom:28}}>
        {kpi.map((k,i)=>(
          <div key={i} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:18,padding:"20px 22px",display:"flex",justifyContent:"space-between",alignItems:"center",boxShadow:"var(--shadow-sm)"}}>
            <div>
              <div style={{fontSize:13,color:"var(--text-tertiary)",marginBottom:8}}>{k.label}</div>
              <div style={{fontSize:28,fontWeight:700,color:k.textC,lineHeight:1}}>{k.value}</div>
            </div>
            <div style={{width:44,height:44,borderRadius:14,background:k.iconBg,border:`1px solid ${k.color}`,display:"flex",alignItems:"center",justifyContent:"center",color:k.textC}}>{k.icon}</div>
          </div>
        ))}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 340px",gap:20}}>
        {/* Recent entries */}
        <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:16,overflow:"hidden"}}>
          <div style={{padding:"18px 22px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontWeight:700,fontSize:15,color:"var(--text-primary)"}}>Nedavni unosi</div>
            <button onClick={()=>setPage("unos")} style={{background:"none",border:"none",color:"var(--text-tertiary)",cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",gap:4}}>Vidi sve <IconArrow/></button>
          </div>
          {recentTop.length===0?(
            <div style={{padding:"40px 22px",textAlign:"center",color:"var(--text-tertiary)",fontSize:14,letterSpacing:"-0.01em"}}>Nema unesenih sati za ovaj mjesec</div>

            recentTop.map((r,i)=>(

        {/* Quick actions */}

          <div style={{fontWeight:700,fontSize:15,color:"var(--text-primary)",marginBottom:16}}>Brze akcije</div>
          {[
            {icon:<IconUsers/>,label:"Upravljanje zaposlenicima",sub:"Pregled svih zaposlenika",page:"zaposlenici",c:"var(--c-slate-100)"},
            {icon:<IconClock/>,label:"Unos radnih sati",sub:"Evidentiraj radno vrijeme",page:"unos",c:"var(--c-slate-100)"},
            {icon:<IconCalendar/>,label:"Mjesečni pregled",sub:"Kalendarski prikaz",page:"pregled",c:"var(--c-slate-100)"},
            {icon:<IconReport/>,label:"Izvještaji i izvoz",sub:"Excel izvoz podataka",page:"izvjestaji",c:"var(--c-slate-100)"},
          ].map((a,i)=>(
            <button key={i} onClick={()=>setPage(a.page)}

              onMouseEnter={e=>{e.currentTarget.style.background="var(--c-slate-50)";e.currentTarget.style.borderColor="var(--c-slate-300)";}}
              onMouseLeave={e=>{e.currentTarget.style.background="var(--surface)";e.currentTarget.style.borderColor="var(--border)";}}>
              <div style={{width:36,height:36,borderRadius:9,background:"var(--surface-secondary)",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--text-secondary)",flexShrink:0}}>{a.icon}</div>
              <div>
                <div style={{fontWeight:600,fontSize:13,color:"var(--text-primary)"}}>{a.label}</div>
                <div style={{fontSize:11,color:"var(--text-tertiary)",marginTop:1}}>{a.sub}</div>
              </div>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── Modal za zaposlenika ───────────────────────────────────────────────────────
function EmployeeModal({employee,onSave,onDelete,onClose,isNew}){
  const [vals,setVals]=useState({
    name:employee?.name||"",
    title:employee?.title||"",
  });
  const [err,setErr]=useState("");
  const save=()=>{
    if(!vals.name.trim()){setErr("Ime i prezime su obavezni.");return;}
    if(!vals.title.trim()){setErr("Pozicija je obavezna.");return;}
    const name=vals.name.trim().toUpperCase();
    const title=vals.title.trim().toUpperCase();
    const id=employee?.id||"emp_"+Date.now();
    onSave({id,name,title});
  };
  return(
    <div style={{position:"fixed",inset:0,background:"var(--scrim)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:16}}>
      <div style={{background:"var(--surface)",borderRadius:16,padding:28,width:"100%",maxWidth:460,boxShadow:"var(--shadow-modal)",border:"1px solid var(--border)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
          <div style={{fontWeight:700,fontSize:17,color:"var(--text-primary)"}}>{isNew?"Novi zaposlenik":"Uredi zaposlenika"}</div>
          <button onClick={onClose} style={{background:"var(--surface-secondary)",border:"none",borderRadius:8,width:32,height:32,cursor:"pointer",fontSize:16,color:"var(--text-secondary)",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
        </div>
        {/* Preview avatar */}
        <div style={{display:"flex",justifyContent:"center",marginBottom:20}}>
          <div style={{width:64,height:64,borderRadius:"50%",background:"var(--accent)",color:"var(--on-accent)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,fontWeight:700}}>
            {vals.name?getInitials(vals.name):"?"}
          </div>
        </div>
        <div style={{marginBottom:14}}>
          <label style={{fontSize:12,color:"var(--text-secondary)",display:"block",marginBottom:6,fontWeight:600}}>Ime i prezime *</label>
          <input value={vals.name} onChange={e=>setVals(v=>({...v,name:e.target.value}))} placeholder="npr. IVAN HORVAT"
            style={{width:"100%",background:"var(--bg)",border:"1px solid var(--border)",borderRadius:12,padding:"11px 14px",color:"var(--text-primary)",fontSize:14,boxSizing:"border-box"}}/>
        </div>
        <div style={{marginBottom:20}}>
          <label style={{fontSize:12,color:"var(--text-secondary)",display:"block",marginBottom:6,fontWeight:600}}>Pozicija / radno mjesto *</label>
          <input value={vals.title} onChange={e=>setVals(v=>({...v,title:e.target.value}))} placeholder="npr. PROGRAMER"
            style={{width:"100%",background:"var(--bg)",border:"1px solid var(--border)",borderRadius:12,padding:"11px 14px",color:"var(--text-primary)",fontSize:14,boxSizing:"border-box"}}/>
        </div>
        {err&&<div style={{background:"var(--red-light)",border:"1px solid rgba(255,59,48,0.2)",borderRadius:8,padding:"8px 12px",marginBottom:14,fontSize:13,color:"var(--red)"}}>{err}</div>}
        <div style={{display:"flex",gap:10}}>
          <button onClick={save} className="btn btn-primary" style={{flex:1,fontSize:14,padding:"12px"}}>
            {isNew?"➕ Dodaj zaposlenika":"💾 Spremi promjene"}
          </button>
          {!isNew&&onDelete&&(
            <button onClick={onDelete} style={{background:"var(--red-light)",color:"var(--red)",border:"1px solid rgba(255,59,48,0.2)",borderRadius:8,padding:"12px 16px",cursor:"pointer",fontWeight:600,fontSize:13}}>
              🗑 Ukloni
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function PageZaposlenici({data,year,month,setPage,setSelectedEmp,employees,onSaveEmployee,onDeleteEmployee}){
  const dc=DAYS_IN_MONTH(year,month);
  const [modal,setModal]=useState(null); // null | {emp:null} (new) | {emp:empObj} (edit)
  return(
    <div className="page-enter">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
        <div>
          <h2 style={{fontSize:22,fontWeight:700,color:"var(--text-primary)",letterSpacing:"-0.03em"}}>Zaposlenici</h2>
          <div style={{fontSize:13,color:"var(--text-tertiary)",marginTop:2}}>{employees.length} aktivnih zaposlenika</div>
        </div>
        <button className="btn btn-primary" onClick={()=>setModal({emp:null})} style={{display:"flex",alignItems:"center",gap:6,padding:"10px 18px",borderRadius:12}}>
          <IconPlus/> Novi zaposlenik
        </button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:14}}>
        {employees.map(emp=>{
          const md=data[`${emp.id}_${year}_${month}`]||{};
          let sati=0,dani=0;
          for(let d=1;d<=dc;d++){const dd=md[d];if(dd&&(dd.start||dd.end)){dani++;sati+=parseFloat(dd.codes?.II)||calcH(dd.start,dd.end)||0;}}
          return(
            <div key={emp.id}
              style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:16,padding:"20px",transition:"all .15s",position:"relative"}}>
              {/* Edit button */}
              <button onClick={e=>{e.stopPropagation();setModal({emp});}}
                style={{position:"absolute",top:12,right:12,background:"var(--surface-secondary)",border:"none",borderRadius:7,padding:"4px 8px",cursor:"pointer",fontSize:11,color:"var(--text-secondary)",fontWeight:600}}>✏ Uredi</button>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16,cursor:"pointer"}}
                onClick={()=>{setSelectedEmp(emp.id);setPage("unos");}}>
                <Avatar emp={emp} size={44} employees={employees}/>
                <div>
                  <div style={{fontWeight:700,fontSize:14,color:"var(--text-primary)"}}>{emp.name.split(" ").map(w=>w.charAt(0)+w.slice(1).toLowerCase()).join(" ")}</div>
                  <div style={{fontSize:11,color:"var(--text-tertiary)",marginTop:2}}>{emp.title}</div>
                </div>
              </div>
              <div style={{display:"flex",gap:10,cursor:"pointer"}} onClick={()=>{setSelectedEmp(emp.id);setPage("unos");}}>
                <div style={{flex:1,background:"var(--bg)",borderRadius:8,padding:"8px 12px",textAlign:"center"}}>
                  <div style={{fontSize:11,color:"var(--text-tertiary)"}}>Sati ({MONTHS[month].substring(0,3)})</div>
                  <div style={{fontSize:18,fontWeight:700,color:"var(--accent)",marginTop:2}}>{Math.round(sati)}</div>
                </div>
                <div style={{flex:1,background:"var(--bg)",borderRadius:8,padding:"8px 12px",textAlign:"center"}}>
                  <div style={{fontSize:11,color:"var(--text-tertiary)"}}>Dana uneseno</div>
                  <div style={{fontSize:18,fontWeight:700,color:"var(--text-primary)",marginTop:2}}>{dani}</div>
                </div>
              </div>
            </div>
          );
        })}
        {/* Add new card */}
        <div onClick={()=>setModal({emp:null})}
          style={{background:"var(--surface-secondary)",border:"2px dashed var(--c-slate-200)",borderRadius:16,padding:"20px",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:140,transition:"all .15s",gap:10}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor="var(--c-blue-600)";e.currentTarget.style.background="var(--c-blue-50)";}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor="var(--c-slate-200)";e.currentTarget.style.background="var(--c-neutral-50)";}}>
          <div style={{width:40,height:40,borderRadius:"50%",background:"var(--c-slate-200)",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--text-tertiary)"}}><IconPlus/></div>
          <div style={{fontSize:13,color:"var(--text-tertiary)",fontWeight:600}}>Dodaj zaposlenika</div>
        </div>
      </div>
      {modal!==null&&(
        <EmployeeModal
          employee={modal.emp}
          isNew={!modal.emp}
          onClose={()=>setModal(null)}
          onSave={emp=>{onSaveEmployee(emp);setModal(null);}}
          onDelete={modal.emp?()=>{onDeleteEmployee(modal.emp.id);setModal(null);}:null}
        />
      )}
    </div>
  );
}

// ── Unos sati (kalendar + tablica) ─────────────────────────────────────────────
function PageUnos({data,year,month,setYear,setMonth,selectedEmp,setSelectedEmp,persist,excelReady,employees,initialDay,onConsumeInitial}){
  const [view,setView]=useState("calendar");
  const [editDay,setEditDay]=useState(null);
  const [flash,setFlash]=useState(false);
  useEffect(()=>{if(initialDay){setEditDay(initialDay);onConsumeInitial&&onConsumeInitial();}},[initialDay]);
  const skey=`${selectedEmp}_${year}_${month}`;
  const monthData=data[skey]||{};
  const dc=DAYS_IN_MONTH(year,month);
  const employee=employees.find(e=>e.id===selectedEmp)||employees[0];

  const totals={};
  Object.keys(CODE_LABELS).forEach(k=>{let s=0;for(let d=1;d<=dc;d++){const dd=monthData[d]||emptyDay();s+=k==="II"?(parseFloat(dd.codes?.II)||calcH(dd.start,dd.end)||0):(parseFloat(dd.codes?.[k]||0)||0);}totals[k]=s;});

  const saveDay=(day,vals,newDay)=>{
    const target=(newDay&&newDay!==day)?newDay:day;
    const md={...monthData,[target]:vals};
    if(target!==day) delete md[day];
    const updated={...data,[skey]:md};
    persist(updated);setEditDay(null);setFlash(true);setTimeout(()=>setFlash(false),1500);
  };
  const deleteDay=day=>{const updated={...data,[skey]:{...monthData}};delete updated[skey][day];persist(updated);setEditDay(null);};
  const prevM=()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);};
  const nextM=()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);};

  return(
    <div className="page-enter">
      {/* Toolbar */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <div style={{display:"flex",alignItems:"center",gap:6,background:"var(--surface)",borderRadius:12,padding:"7px 12px",border:"1px solid var(--border)"}}>
            <button onClick={prevM} style={{background:"none",border:"none",color:"var(--text-tertiary)",cursor:"pointer",fontSize:18,lineHeight:1,padding:"0 2px"}}>‹</button>
            <span style={{fontWeight:700,fontSize:14,minWidth:140,textAlign:"center"}}>{MONTHS[month]} {year}</span>
            <button onClick={nextM} style={{background:"none",border:"none",color:"var(--text-tertiary)",cursor:"pointer",fontSize:18,lineHeight:1,padding:"0 2px"}}>›</button>
          </div>
          <select value={selectedEmp} onChange={e=>setSelectedEmp(e.target.value)}
            style={{background:"var(--surface)",color:"var(--text-primary)",border:"1px solid var(--border)",borderRadius:12,padding:"8px 12px",fontSize:13,fontWeight:600,cursor:"pointer",minWidth:240}}>
            {employees.map(e=><option key={e.id} value={e.id}>{e.name} – {e.title}</option>)}
          </select>
          <div style={{display:"flex",background:"var(--surface-secondary)",borderRadius:12,padding:3,gap:2}}>
            {["calendar","table"].map(v=>(
              <button key={v} onClick={()=>setView(v)}
                style={{padding:"6px 14px",border:"none",cursor:"pointer",fontSize:12,fontWeight:600,borderRadius:8,background:view===v?"var(--surface)":"transparent",color:view===v?"var(--c-slate-900)":"var(--c-slate-400)",boxShadow:view===v?"var(--shadow-sm)":"none",transition:"all .15s"}}>
                {v==="calendar"?"📅 Kalendar":"📊 Tablica"}
              </button>
            ))}
          </div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          {flash&&<span style={{color:"var(--green)",fontSize:13,fontWeight:600}}>✓ Spremljeno</span>}
          <button onClick={()=>{
              const t=new Date();
              const d=(t.getFullYear()===year&&t.getMonth()===month)?t.getDate():1;
              setEditDay(d);
            }} className="btn btn-primary" style={{fontSize:12}}><IconPlus/> Novi unos</button>
          <button onClick={()=>exportSingle(employee.name,employee.title,year,month,monthData)} disabled={!excelReady}
            className="btn btn-outline" style={{opacity:excelReady?1:.5,fontSize:12}}>⬇ Export radnik</button>
          <button onClick={()=>exportAll(year,month,data,employees)} disabled={!excelReady}
            className="btn btn-primary" style={{opacity:excelReady?1:.5,fontSize:12}}>⬇ Export svi</button>
        </div>
      </div>

      {/* Summary strip */}
      <div style={{display:"flex",gap:10,marginBottom:18,flexWrap:"wrap"}}>
        {[{k:"II",l:"Ukupno sati",c:"var(--c-blue-600)"},{k:"IV",l:"Prekovremeni",c:"var(--c-amber-600)"},{k:"VII",l:"Godišnji odmor",c:"var(--c-green-600)"},{k:"IX",l:"Bolovanje",c:"var(--c-red-600)"},{k:"X",l:"Plaćeni dopust",c:"var(--c-violet-600)"}]
         .map(it=>(
          <div key={it.k} style={{background:"var(--surface)",border:"1px solid var(--border)",padding:"10px 16px",minWidth:110,borderTop:`3px solid ${it.c}`,borderRadius:14,overflow:"hidden"}}>
            <div style={{fontSize:10,color:"var(--text-tertiary)",marginBottom:3}}>{it.l}</div>
            <div style={{fontSize:22,fontWeight:700,color:it.c}}>{totals[it.k]||0}</div>
          </div>
        ))}
      </div>

      {/* Calendar */}
      {view==="calendar"&&(
        <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:16,padding:16}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",marginBottom:8}}>
            {["Pon","Uto","Sri","Čet","Pet","Sub","Ned"].map(d=>(
              <div key={d} style={{textAlign:"center",fontSize:11,fontWeight:600,color:"var(--text-tertiary)",padding:"5px 0"}}>{d}</div>
            ))}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
            {Array.from({length:(DOW(year,month,1)+6)%7}).map((_,i)=><div key={`e${i}`}/>)}
            {Array.from({length:dc},(_,i)=>i+1).map(day=>{
              const dd=monthData[day]||emptyDay();
              const isSat=IS_SAT(year,month,day),isSun=IS_SUN(year,month,day);
              const holName=getHoliday(year,month,day),isHol=!!holName;
              const totalH=parseFloat(dd.codes?.II)||calcH(dd.start,dd.end)||0;
              const hasData=dd.start||dd.end||Object.values(dd.codes||{}).some(v=>v);
              const ac=["III","IV","VI","VII","IX","X"].find(k=>parseFloat(dd.codes?.[k])>0);
              let bg="var(--c-neutral-50)",border="var(--c-slate-100)",dayCol="var(--c-slate-500)",stripe=null,textMuted="var(--c-slate-400)";
              if(isSat){bg="var(--c-amber-50)";border="var(--c-amber-200)";dayCol="var(--c-amber-600)";stripe="var(--c-amber-500)";textMuted="var(--c-amber-500)";}
              if(isSun){bg="var(--c-red-50)";border="var(--c-red-200)";dayCol="var(--c-red-600)";stripe="var(--c-red-500)";textMuted="var(--c-red-500)";}
              if(isHol){bg="var(--c-violet-50)";border="var(--c-violet-200)";dayCol="var(--c-violet-600)";stripe="var(--c-violet-500)";textMuted="var(--c-violet-500)";}
              if(hasData&&totalH>0&&!isSat&&!isSun&&!isHol){bg="var(--c-blue-50)";border="var(--c-blue-200)";}
              if(ac==="IX"){bg="var(--c-red-50)";border="var(--c-red-200)";}
              if(ac==="VII"){bg="var(--c-green-50)";border="var(--c-green-200)";}
              const today=new Date();
              const isToday=today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===day;
              return(
                <div key={day} onClick={()=>setEditDay(day)}
                  style={{background:bg,border:`1px solid ${isToday?"var(--c-blue-600)":border}`,borderRadius:12,cursor:"pointer",minHeight:76,overflow:"hidden",transition:"all .12s",position:"relative"}}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor="var(--c-blue-600)";e.currentTarget.style.boxShadow="0 2px 10px var(--accent-light)";}}
                  onMouseLeave={e=>{e.currentTarget.style.borderColor=isToday?"var(--c-blue-600)":border;e.currentTarget.style.boxShadow="none";}}>
                  {stripe&&<div style={{height:3,background:stripe,borderRadius:"10px 10px 0 0"}}/>}
                  <div style={{padding:"6px 8px 8px"}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                      <span style={{fontSize:13,fontWeight:700,color:isToday?"var(--c-blue-600)":dayCol,background:isToday?"var(--c-blue-100)":"transparent",borderRadius:4,padding:"0 3px"}}>{day}</span>
                      <span style={{fontSize:9,color:textMuted,opacity:.6}}>{DAY_NAMES[DOW(year,month,day)]}</span>
                    </div>
                    {isHol&&<div style={{fontSize:8,color:"var(--purple)",fontWeight:600,marginBottom:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>🇭🇷 {holName}</div>}
                    {hasData&&<>
                      {(dd.start||dd.end)&&<div style={{fontSize:10,color:"var(--text-secondary)",marginBottom:1}}>{dd.start||"—"}–{dd.end||"—"}h</div>}
                      {totalH>0&&<div style={{fontSize:14,fontWeight:700,color:"var(--accent)"}}>{totalH}h</div>}
                      {ac&&<div style={{fontSize:9,color:ac==="IX"?"var(--c-red-600)":ac==="VII"?"var(--c-green-600)":"var(--c-amber-600)",fontWeight:700}}>{ac}. {parseFloat(dd.codes[ac])}h</div>}
                      {dd.note&&<div title={dd.note} style={{fontSize:9,color:"var(--text-tertiary)",marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{dd.note}</div>}
                    </>}
                    {!hasData&&!isSat&&!isSun&&!isHol&&<div style={{fontSize:10,color:"var(--text-tertiary)",marginTop:4}}>+ unos</div>}
                  </div>
                </div>
              );
            })}
          </div>
          {/* Legend */}
          <div style={{display:"flex",gap:14,marginTop:14,flexWrap:"wrap",alignItems:"center",paddingTop:12,borderTop:"1px solid var(--border)"}}>
            <span style={{fontSize:11,color:"var(--text-tertiary)",fontWeight:700}}>LEGENDA:</span>
            {[{c:"var(--c-amber-500)",l:"Subota"},{c:"var(--c-red-500)",l:"Nedjelja"},{c:"var(--c-violet-500)",l:"Državni praznik"},{c:"var(--c-blue-600)",l:"Radni dan s unosom"}]
             .map(it=>(
              <div key={it.l} style={{display:"flex",alignItems:"center",gap:5}}>
                <div style={{width:12,height:12,borderRadius:3,background:"transparent",border:`2px solid ${it.c}`,overflow:"hidden",position:"relative"}}>
                  <div style={{position:"absolute",top:0,left:0,right:0,height:3,background:it.c}}/>
                </div>
                <span style={{fontSize:11,color:"var(--text-secondary)"}}>{it.l}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Table */}
      {view==="table"&&(
        <div style={{background:"var(--surface)",borderRadius:16,border:"1px solid var(--border)",overflow:"hidden"}}>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
              <thead>
                <tr style={{background:"var(--bg)"}}>
                  <th style={{padding:"10px 12px",textAlign:"left",color:"var(--text-secondary)",fontWeight:700,borderBottom:"1px solid var(--border)",minWidth:70}}>Dan</th>
                  <th style={{padding:"10px 8px",textAlign:"center",color:"var(--text-secondary)",fontWeight:700,borderBottom:"1px solid var(--border)"}}>Početak</th>
                  <th style={{padding:"10px 8px",textAlign:"center",color:"var(--text-secondary)",fontWeight:700,borderBottom:"1px solid var(--border)"}}>Završetak</th>
                  {Object.keys(CODE_LABELS).map(k=>(
                    <th key={k} title={CODE_LABELS[k]} style={{padding:"10px 5px",textAlign:"center",color:k==="II"?"var(--c-blue-600)":"var(--c-slate-600)",fontWeight:700,borderBottom:"1px solid var(--border)",minWidth:32}}>{k}.</th>
                  ))}
                  <th style={{padding:"10px 8px",borderBottom:"1px solid var(--border)"}}/>
                </tr>
              </thead>
              <tbody>
                {Array.from({length:dc},(_,i)=>i+1).map(day=>{
                  const dd=monthData[day]||emptyDay();
                  const isSat=IS_SAT(year,month,day),isSun=IS_SUN(year,month,day),isHol=!!getHoliday(year,month,day);
                  const totalH=parseFloat(dd.codes?.II)||calcH(dd.start,dd.end)||0;
                  let rowBg="transparent",dayCol="var(--c-slate-900)",lBorder="4px solid transparent";
                  if(isSat){rowBg="var(--c-amber-50)";dayCol="var(--c-amber-600)";lBorder="4px solid var(--c-amber-500)";}
                  if(isSun){rowBg="var(--c-red-50)";dayCol="var(--c-red-600)";lBorder="4px solid var(--c-red-500)";}
                  if(isHol){rowBg="var(--c-violet-50)";dayCol="var(--c-violet-600)";lBorder="4px solid var(--c-violet-500)";}
                  return(
                    <tr key={day} style={{background:rowBg,borderBottom:"1px solid var(--c-slate-50)",borderLeft:lBorder}}
                      onMouseEnter={e=>e.currentTarget.style.background="var(--c-sky-50)"}
                      onMouseLeave={e=>e.currentTarget.style.background=rowBg}>
                      <td style={{padding:"7px 12px",fontWeight:700,color:dayCol}}>
                        {day}. <span style={{fontSize:10,color:dayCol,opacity:.6,fontWeight:400}}>{DAY_NAMES[DOW(year,month,day)]}</span>
                        {isHol&&<span style={{fontSize:9,color:"var(--purple)",marginLeft:3}}>🇭🇷</span>}
                      </td>
                      <td style={{padding:"7px 5px",textAlign:"center",color:"var(--text-secondary)"}}>{dd.start||""}</td>
                      <td style={{padding:"7px 5px",textAlign:"center",color:"var(--text-secondary)"}}>{dd.end||""}</td>
                      {Object.keys(CODE_LABELS).map(k=>(
                        <td key={k} style={{padding:"7px 5px",textAlign:"center",color:k==="II"?(totalH>0?"var(--c-blue-600)":"var(--c-slate-300)"):"var(--c-slate-500)",fontWeight:k==="II"?700:400}}>
                          {k==="II"?(totalH>0?totalH:""):(dd.codes?.[k]||"")}
                        </td>
                      ))}
                      <td style={{padding:"7px 8px"}}>
                        <button onClick={()=>setEditDay(day)} style={{background:"var(--surface-secondary)",border:"none",color:"var(--text-secondary)",borderRadius:6,padding:"3px 8px",cursor:"pointer",fontSize:12}}>✏</button>
                      </td>
                    </tr>
                  );
                })}
                <tr style={{background:"var(--accent-light)",borderTop:"2px solid var(--c-blue-200)"}}>
                  <td colSpan={3} style={{padding:"10px 12px",fontWeight:700,color:"var(--accent)"}}>UKUPNO</td>
                  {Object.keys(CODE_LABELS).map(k=>(
                    <td key={k} style={{padding:"10px 5px",textAlign:"center",fontWeight:700,color:totals[k]>0?"var(--c-blue-700)":"var(--c-slate-300)"}}>{totals[k]>0?totals[k]:""}</td>
                  ))}
                  <td/>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      )}

      {editDay!==null&&(
        <DayModal key={selectedEmp+"_"+editDay} emp={employee} day={editDay} month={month} year={year}
          dayData={monthData[editDay]||emptyDay()}
          employees={employees} onChangeEmp={setSelectedEmp}
          onSave={(v,nd)=>saveDay(editDay,v,nd)} onDelete={()=>deleteDay(editDay)} onClose={()=>setEditDay(null)}/>
      )}
    </div>
  );
}

// ── Pregled (dashboard) ────────────────────────────────────────────────────────
function PagePregled({data,year,month,setYear,setMonth,employees}){
  const prevM=()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);};
  const nextM=()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);};
  const dc=DAYS_IN_MONTH(year,month);
  const empStats=employees.map(emp=>{
    const md=data[`${emp.id}_${year}_${month}`]||{};
    const get=k=>{let s=0;for(let d=1;d<=dc;d++){const dd=md[d]||emptyDay();s+=k==="II"?(parseFloat(dd.codes?.II)||calcH(dd.start,dd.end)||0):(parseFloat(dd.codes?.[k]||0)||0);}return Math.round(s*10)/10;};
    return{...emp,II:get("II"),IV:get("IV"),VII:get("VII"),IX:get("IX"),X:get("X"),III:get("III"),VI:get("VI")};
  });
  // Full name helper: "KARLO ĐUDERIJA" → "Karlo Đuderija"
  const fullName=name=>name.split(" ").map(w=>w.charAt(0)+w.slice(1).toLowerCase()).join(" ");
  return(
    <div className="page-enter">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24,flexWrap:"wrap",gap:10}}>
        <div><h2 style={{fontSize:22,fontWeight:700,color:"var(--text-primary)",letterSpacing:"-0.03em"}}>Mjesečni pregled</h2><div style={{fontSize:13,color:"var(--text-tertiary)",marginTop:2}}>Statistike za sve zaposlenike</div></div>
        <div style={{display:"flex",alignItems:"center",gap:8,background:"var(--surface)",borderRadius:12,padding:"7px 14px",border:"1px solid var(--border)"}}>
          <button onClick={prevM} style={{background:"none",border:"none",color:"var(--text-tertiary)",cursor:"pointer",fontSize:18,lineHeight:1}}>‹</button>
          <span style={{fontWeight:700,fontSize:14,minWidth:140,textAlign:"center"}}>{MONTHS[month]} {year}</span>
          <button onClick={nextM} style={{background:"none",border:"none",color:"var(--text-tertiary)",cursor:"pointer",fontSize:18,lineHeight:1}}>›</button>
        </div>
      </div>
      {/* Table only */}
      <div className="card" style={{padding:0,overflow:"hidden"}}>
        <div style={{padding:"16px 20px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontWeight:700,fontSize:14,color:"var(--text-primary)"}}>Detalji po zaposleniku — {MONTHS[month]} {year}</div>
          <div style={{fontSize:12,color:"var(--text-tertiary)"}}>{employees.length} zaposlenika</div>
        </div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr style={{background:"var(--bg)"}}>
              {["Zaposlenik","Pozicija","Ukupno sati","Prekovremeni","Noćni rad","Godišnji","Bolovanje","Pl. dopust"].map((h,i)=>(
                <th key={i} style={{padding:"12px 16px",textAlign:i<2?"left":"center",color:"var(--text-secondary)",fontWeight:700,borderBottom:"1px solid var(--border)",whiteSpace:"nowrap",fontSize:12,textTransform:"uppercase",letterSpacing:.3}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {empStats.map((e,i)=>(
                <tr key={e.id} style={{borderBottom:"1px solid var(--border)",background:"var(--surface)"}}
                  onMouseEnter={ev=>ev.currentTarget.style.background="var(--c-slate-50)"}
                  onMouseLeave={ev=>ev.currentTarget.style.background="var(--surface)"}>
                  <td style={{padding:"12px 16px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:12}}>
                      <Avatar emp={e} size={34} employees={employees}/>
                      <span style={{fontWeight:600,color:"var(--text-primary)",fontSize:14}}>{fullName(e.name)}</span>
                    </div>
                  </td>
                  <td style={{padding:"12px 16px",color:"var(--text-tertiary)",fontSize:11,textTransform:"uppercase",letterSpacing:.3}}>{e.title}</td>
                  {[e.II,e.IV,e.III,e.VII,e.IX,e.X].map((v,vi)=>{
                    const colors=["var(--c-blue-600)","var(--c-amber-600)","var(--c-indigo-500)","var(--c-green-600)","var(--c-red-600)","var(--c-violet-600)"];
                    return <td key={vi} style={{padding:"12px 16px",textAlign:"center",color:v>0?colors[vi]:"var(--c-slate-300)",fontWeight:v>0?700:400,fontSize:14}}>{v||"—"}</td>;
                  })}
                </tr>
              ))}
              <tr style={{background:"var(--accent-light)",borderTop:"2px solid var(--c-blue-200)"}}>
                <td colSpan={2} style={{padding:"13px 16px",fontWeight:700,color:"var(--accent)",fontSize:13}}>UKUPNO</td>
                {[empStats.reduce((a,e)=>a+e.II,0),empStats.reduce((a,e)=>a+e.IV,0),empStats.reduce((a,e)=>a+e.III,0),empStats.reduce((a,e)=>a+e.VII,0),empStats.reduce((a,e)=>a+e.IX,0),empStats.reduce((a,e)=>a+e.X,0)]
                 .map((v,i)=><td key={i} style={{padding:"13px 16px",textAlign:"center",fontWeight:700,color:v>0?"var(--c-blue-700)":"var(--c-slate-300)",fontSize:14}}>{v||"—"}</td>)}
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── Main App ───────────────────────────────────────────────────────────────────
function App({session,onSignOut}){
  const excelReady=!!window.ExcelJS;
  const [xlReady,setXlReady]=useState(excelReady);
  useEffect(()=>{if(!window.ExcelJS){const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";s.onload=()=>setXlReady(true);document.head.appendChild(s);}else setXlReady(true);},[]);

  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth());
  const [employees,setEmployees]=useState(()=>lsLoadEmps());
  const [selectedEmp,setSelectedEmp]=useState(()=>{const e=lsLoadEmps();return e[0]?.id||DEFAULT_EMPLOYEES[0].id;});
  const [data,setData]=useState(()=>lsLoad());
  const [page,setPage]=useState("home");
  const [editDayModal,setEditDayModal]=useState(null);
  const [menuOpen,setMenuOpen]=useState(false);
  const [sync,setSync]=useState("idle");   // idle | run | ok | err
  const [syncMsg,setSyncMsg]=useState("");
  const [cloudEmpty,setCloudEmpty]=useState(false);
  const [theme,setTheme]=useState(()=>{try{return localStorage.getItem(LS_THEME)||"system"}catch{return"system"}});

  useEffect(()=>{
    applyTheme(theme);
    try{localStorage.setItem(LS_THEME,theme)}catch{}
    if(theme!=="system"||!window.matchMedia)return;
    const mq=window.matchMedia("(prefers-color-scheme: dark)");
    const h=()=>applyTheme("system");
    mq.addEventListener?mq.addEventListener("change",h):mq.addListener(h);
    return()=>{mq.removeEventListener?mq.removeEventListener("change",h):mq.removeListener(h);};
  },[theme]);


  const runSync=useCallback(async fn=>{
    setSync("run");setSyncMsg("");
    try{await fn();setSync("ok");}
    catch(e){
      console.error(e);
      setSync("err");
      const raw=e?.message||String(e);
      setSyncMsg(/issued at future|PGRST303/i.test(raw)
        ? "Sat računala nije usklađen s poslužiteljem. Uskladite vrijeme na računalu pa pokušajte ponovno."
        : raw);
    }
  },[]);

  // Povlačenje s poslužitelja pri pokretanju
  const pull=useCallback(async()=>{
    const r=await cloudLoad();
    const hasEmps=r.employees.length>0;
    const hasData=Object.keys(r.data).length>0;
    if(hasEmps){
      setEmployees(r.employees);lsSaveEmps(r.employees);
      setSelectedEmp(cur=>r.employees.some(e=>e.id===cur)?cur:r.employees[0].id);
    }
    if(hasData){setData(r.data);lsSave(r.data);}
    setCloudEmpty(!hasEmps&&!hasData);
  },[]);

  useEffect(()=>{runSync(pull);},[runSync,pull]);

  // Prijenos lokalnih podataka na poslužitelj (jednokratno)
  const handleMigrate=()=>runSync(async()=>{
    await cloudSaveEmps(employees);
    await cloudSaveKeys(data,Object.keys(data));
    setCloudEmpty(false);
  });

  const dataRef=useRef(data);
  useEffect(()=>{dataRef.current=data;},[data]);

  const persist=useCallback(nd=>{
    const prev=dataRef.current||{};
    const changed=Object.keys(nd).filter(k=>JSON.stringify(nd[k])!==JSON.stringify(prev[k]));
    dataRef.current=nd;
    setData(nd);
    lsSave(nd);
    if(changed.length)runSync(()=>cloudSaveKeys(nd,changed));
  },[runSync]);

  const handleExportJSON=()=>{
    const backup={data,employees,exportedAt:new Date().toISOString(),version:"dys_v2"};
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    const now=new Date();
    a.download=`radni-sati-podaci_${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}.json`;
    a.click();
  };

  const handleImportJSON=(e)=>{
    const file=e.target.files?.[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const backup=JSON.parse(ev.target.result);
        if(backup.data){persist(backup.data);}
        if(backup.employees&&Array.isArray(backup.employees)){
          setEmployees(backup.employees);
          lsSaveEmps(backup.employees);
        }
        alert("✅ Podaci su uspješno učitani!");
      }catch(err){
        alert("❌ Greška pri čitanju datoteke. Provjerite je li datoteka ispravna.");
      }
    };
    reader.readAsText(file);
    e.target.value="";
  };

  const saveEmployee=useCallback(emp=>{
    setEmployees(prev=>{
      const idx=prev.findIndex(e=>e.id===emp.id);
      const updated=idx>=0?prev.map(e=>e.id===emp.id?emp:e):[...prev,emp];
      lsSaveEmps(updated);
      runSync(()=>cloudSaveEmps(updated));
      return updated;
    });
  },[runSync]);

  const deleteEmployee=useCallback(id=>{
    setEmployees(prev=>{
      const updated=prev.filter(e=>e.id!==id);
      lsSaveEmps(updated);
      if(selectedEmp===id&&updated.length>0) setSelectedEmp(updated[0].id);
      runSync(()=>cloudDeleteEmp(id));
      return updated;
    });
  },[selectedEmp,runSync]);

  const openDayModal=(day,empId)=>{setSelectedEmp(empId||selectedEmp);setEditDayModal({day,empId:empId||selectedEmp});setPage("unos");setMenuOpen(false);};

  const navItems=[
    {id:"home",label:"Početna",icon:<IconHome/>},
    {id:"zaposlenici",label:"Zaposlenici",icon:<IconUsers/>},
    {id:"unos",label:"Unos sati",icon:<IconClock/>},
    {id:"pregled",label:"Mjesečni pregled",icon:<IconCalendar/>},
    {id:"izvjestaji",label:"Izvještaji",icon:<IconReport/>},
  ];

  return(
    <div style={{display:"flex",minHeight:"100vh",background:"var(--bg)"}}>
      {/* Gumb izbornika — vidljiv samo na mobitelu */}
      <button className="dys-burger" onClick={()=>setMenuOpen(o=>!o)} aria-label={menuOpen?"Zatvori izbornik":"Otvori izbornik"}>
        {menuOpen
          ? <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          : <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>}
      </button>
      {menuOpen&&<div className="dys-overlay" onClick={()=>setMenuOpen(false)}/>}

      {/* Sidebar — Apple macOS style */}
      <div className={"dys-sidebar"+(menuOpen?" open":"")} style={{width:228,background:"var(--sidebar-bg)",backdropFilter:"blur(24px)",WebkitBackdropFilter:"blur(24px)",borderRight:"1px solid var(--border)",display:"flex",flexDirection:"column",flexShrink:0,position:"fixed",top:0,left:0,bottom:0,zIndex:100}}>
        <div style={{padding:"24px 18px 14px"}}>
          <div style={{fontWeight:700,fontSize:16,color:"var(--text-primary)",letterSpacing:"-0.025em"}}>dotyourspot</div>
          <div style={{marginTop:10}}>
            <select value={year} onChange={e=>setYear(Number(e.target.value))}
              style={{background:"var(--hover)",border:"1px solid var(--border)",borderRadius:8,fontSize:12,color:"var(--text-secondary)",cursor:"pointer",fontWeight:500,padding:"4px 10px",fontFamily:"var(--font)"}}>
              {[2023,2024,2025,2026,2027].map(y=><option key={y} value={y}>{y}</option>)}
            </select>
          </div>
        </div>
        <nav style={{padding:"2px 10px",flex:1}}>
          {navItems.map(item=>(
            <button key={item.id} className={`sidebar-link${page===item.id?" active":""}`} onClick={()=>{setPage(item.id);setMenuOpen(false);}}>
              <span style={{opacity:page===item.id?1:0.5,display:"flex",flexShrink:0}}>{item.icon}</span>
              {item.label}
            </button>
          ))}
        </nav>
        <div style={{padding:"14px 18px 20px",borderTop:"1px solid var(--border)"}}>
          {/* Tema */}
          <div style={{marginBottom:14}}>
            <div style={{fontSize:10,color:"var(--text-tertiary)",fontWeight:600,letterSpacing:"0.05em",textTransform:"uppercase",marginBottom:8}}>Izgled</div>
            <div className="theme-seg">
              {[
                {v:"light",l:"Svijetla",i:<IconSun/>},
                {v:"dark",l:"Tamna",i:<IconMoon/>},
                {v:"system",l:"Sustav",i:<IconAuto/>},
              ].map(o=>(
                <button key={o.v} className={theme===o.v?"on":""} onClick={()=>setTheme(o.v)} title={o.l}>
                  {o.i}<span>{o.l}</span>
                </button>
              ))}
            </div>
          </div>
          {/* Backup / Restore */}
          <div style={{marginBottom:14}}>
            <div style={{fontSize:10,color:"var(--text-tertiary)",fontWeight:600,letterSpacing:"0.05em",textTransform:"uppercase",marginBottom:8}}>Backup podataka</div>
            <div style={{display:"flex",gap:7}}>
              <button onClick={handleExportJSON}
                style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:5,background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,padding:"8px 6px",cursor:"pointer",fontSize:12,fontWeight:500,color:"var(--text-secondary)",boxShadow:"var(--shadow-sm)",transition:"all .15s"}}
                onMouseEnter={e=>{e.currentTarget.style.background="var(--bg)";e.currentTarget.style.borderColor="var(--border-strong)";}}
                onMouseLeave={e=>{e.currentTarget.style.background="var(--surface)";e.currentTarget.style.borderColor="var(--border)";}}>
                <svg width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Spremi
              </button>
              <label style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:5,background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,padding:"8px 6px",cursor:"pointer",fontSize:12,fontWeight:500,color:"var(--text-secondary)",boxShadow:"var(--shadow-sm)",transition:"all .15s"}}
                onMouseEnter={e=>{e.currentTarget.style.background="var(--bg)";e.currentTarget.style.borderColor="var(--border-strong)";}}
                onMouseLeave={e=>{e.currentTarget.style.background="var(--surface)";e.currentTarget.style.borderColor="var(--border)";}}>
                <svg width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Učitaj
                <input type="file" accept=".json" onChange={handleImportJSON} style={{position:"absolute",opacity:0,width:0,height:0,pointerEvents:"none"}}/>
              </label>
            </div>
          </div>
          {/* Stanje sinkronizacije */}
          <div style={{marginBottom:12,padding:"10px 11px",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,boxShadow:"var(--shadow-sm)"}}>
            <div style={{display:"flex",alignItems:"center",gap:7}}>
              <span className={"sync-dot "+(sync==="run"?"sync-run":sync==="ok"?"sync-ok":sync==="err"?"sync-err":"sync-idle")}/>
              <span style={{fontSize:12,fontWeight:500,color:"var(--text-secondary)",flex:1}}>
                {sync==="run"?"Sinkroniziram…":sync==="ok"?"Spremljeno":sync==="err"?"Greška":"Čekam"}
              </span>
              <button onClick={()=>runSync(pull)} title="Povuci s poslužitelja"
                style={{background:"none",border:"none",cursor:"pointer",color:"var(--text-tertiary)",display:"flex",padding:2}}>
                <svg width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
              </button>

            {sync==="err"&&syncMsg&&<div style={{fontSize:10.5,color:"var(--red)",marginTop:6,lineHeight:1.35,wordBreak:"break-word"}}>{syncMsg}</div>}

              <button onClick={handleMigrate}
                style={{marginTop:9,width:"100%",background:"var(--accent)",color:"var(--on-accent)",border:"none",borderRadius:8,padding:"8px 6px",cursor:"pointer",fontSize:11.5,fontWeight:600,fontFamily:"var(--font)"}}>

                style={{marginTop:9,width:"100%",background:"var(--surface)",color:"var(--text-secondary)",border:"1px solid var(--border-strong)",borderRadius:8,padding:"8px 6px",cursor:"pointer",fontSize:11.5,fontWeight:500,fontFamily:"var(--font)"}}>

          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
            <div style={{fontSize:10.5,color:"var(--text-tertiary)",fontWeight:500,letterSpacing:"0.04em",textTransform:"uppercase"}}>DOT YOUR SPOT d.o.o.</div>
            <button onClick={onSignOut} title="Odjava"
              style={{background:"none",border:"none",cursor:"pointer",color:"var(--text-tertiary)",display:"flex",padding:2,flexShrink:0}}>
              <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
          </div>
        </div>
      </div>

      {/* Main */}
      <div className="dys-main" style={{marginLeft:228,flex:1,padding:"40px 44px",maxWidth:"calc(100vw - 228px)",minHeight:"100vh"}}>
        {page==="home"&&<PageHome data={data} year={year} month={month} setPage={setPage} setSelectedEmp={setSelectedEmp} openDayModal={openDayModal} employees={employees}/>}
        {page==="zaposlenici"&&<PageZaposlenici data={data} year={year} month={month} setPage={setPage} setSelectedEmp={setSelectedEmp} employees={employees} onSaveEmployee={saveEmployee} onDeleteEmployee={deleteEmployee}/>}
        {page==="unos"&&<PageUnos data={data} year={year} month={month} setYear={setYear} setMonth={setMonth} selectedEmp={selectedEmp} setSelectedEmp={setSelectedEmp} persist={persist} excelReady={xlReady} employees={employees} initialDay={editDayModal&&editDayModal.day} onConsumeInitial={()=>setEditDayModal(null)}/>}
        {page==="pregled"&&<PagePregled data={data} year={year} month={month} setYear={setYear} setMonth={setMonth} employees={employees}/>}
        {page==="izvjestaji"&&<PageIzvjestaji data={data} year={year} month={month} excelReady={xlReady} employees={employees}/>}
      </div>
    </div>
  );
}

// ── Prijava ────────────────────────────────────────────────────────────────────
function Login(){
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");

  const submit=async()=>{
    if(!email||!pass){setErr("Upišite e-mail i lozinku.");return;}
    setBusy(true);setErr("");
    const c=sbClient();
    if(!c){setErr("Nema veze s poslužiteljem. Provjerite internet i osvježite stranicu.");setBusy(false);return;}
    const {error}=await c.auth.signInWithPassword({email:email.trim(),password:pass});
    if(error){
      setErr(error.message==="Invalid login credentials"?"Neispravan e-mail ili lozinka.":error.message);
      setBusy(false);
    }
  };

  const fld={width:"100%",padding:"12px 14px",borderRadius:10,border:"1px solid var(--border-strong)",background:"var(--surface)",fontSize:16,marginTop:6};

  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)",padding:20}}>
      <div className="page-enter" style={{width:"100%",maxWidth:360,background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius-xl)",boxShadow:"var(--shadow-lg)",padding:"32px 28px"}}>
        <div style={{fontWeight:700,fontSize:19,letterSpacing:"-0.03em"}}>dotyourspot</div>
        <div style={{fontSize:14,color:"var(--text-secondary)",marginTop:4,marginBottom:26}}>Evidencija radnog vremena</div>

        <label style={{fontSize:13,fontWeight:500,color:"var(--text-secondary)"}}>E-mail
          <input type="email" inputMode="email" autoComplete="username" value={email}
            onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} style={fld}/>
        </label>
        <div style={{height:14}}/>
        <label style={{fontSize:13,fontWeight:500,color:"var(--text-secondary)"}}>Lozinka
          <input type="password" autoComplete="current-password" value={pass}
            onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} style={fld}/>
        </label>

        {err&&<div style={{marginTop:14,fontSize:13,color:"var(--red)",background:"var(--red-light)",padding:"9px 11px",borderRadius:9,lineHeight:1.4}}>{err}</div>}

        <button onClick={submit} disabled={busy}
          style={{width:"100%",marginTop:22,background:busy?"var(--text-tertiary)":"var(--accent)",color:"var(--on-accent)",border:"none",borderRadius:11,padding:"13px",fontSize:15,fontWeight:600,cursor:busy?"default":"pointer",fontFamily:"var(--font)",boxShadow:busy?"none":"0 2px 10px rgba(0,113,227,0.35)"}}>
          {busy?"Prijavljujem…":"Prijava"}
        </button>
      </div>
    </div>
  );
}

function Splash(){
  return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)",color:"var(--text-tertiary)",fontSize:14}}>Učitavam…</div>;
}

function Root(){
  const [session,setSession]=useState(undefined); // undefined = još provjeravam

  useEffect(()=>{
    let sub=null;
    const start=()=>{
      const c=sbClient();
      if(!c){setTimeout(start,300);return;}
      c.auth.getSession().then(({data})=>setSession(data.session||null)).catch(()=>setSession(null));
      sub=c.auth.onAuthStateChange((_e,s)=>setSession(s||null)).data;
    };
    start();
    return()=>{try{sub&&sub.subscription.unsubscribe();}catch(e){}};
  },[]);

  const signOut=async()=>{const c=sbClient();if(c)await c.auth.signOut();setSession(null);};

  if(session===undefined)return <Splash/>;
  if(!session)return <Login/>;
  return <App session={session} onSignOut={signOut}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
